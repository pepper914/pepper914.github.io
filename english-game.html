<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="英语游戏">
<meta name="theme-color" content="#fff8ee">
<title>英语冰雪岛 · Elsa & Anna</title>
<style>
/* ===== 基础 ===== */
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
  -webkit-touch-callout: none;
  user-select: none;
}

html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  overflow: hidden;
  background: #e9f4fe;
  font-family: -apple-system, "PingFang SC", "Helvetica Neue", "Microsoft YaHei", sans-serif;
  color: #3a3a3a;
  touch-action: manipulation;
}

button {
  font-family: inherit;
  border: none;
  background: none;
  cursor: pointer;
  color: inherit;
}

#app {
  display: flex;
  flex-direction: column;
  height: 100vh;
  max-width: 1180px;
  margin: 0 auto;
  background: #f3faff;
}

/* ===== 顶部栏 ===== */
.topbar {
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  padding: 12px 20px;
  padding-top: max(12px, env(safe-area-inset-top));
  background: #fff;
  border-bottom: 3px solid #cfe6ff;
}

.kid-switch {
  display: flex;
  gap: 8px;
}

.kid-btn {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 8px 14px;
  border-radius: 999px;
  background: #f4f4f6;
  font-size: 18px;
  font-weight: 700;
  color: #9a9a9a;
  transition: all .18s;
}

.kid-btn.active {
  background: #74bdf0;
  color: #fff;
  box-shadow: 0 4px 0 #46a0dc;
}

.kid-face { font-size: 24px; }

.week-title { flex: 1; text-align: center; }

.week-label {
  font-size: 22px;
  font-weight: 800;
  color: #4a4a4a;
}

.week-sub {
  font-size: 14px;
  color: #a5a5a5;
  margin-top: 2px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 420px;
}

.edit-btn {
  display: flex;
  align-items: center;
  gap: 6px;
  min-height: 52px;
  padding: 0 22px;
  border-radius: 16px;
  background: #dcf0ff;
  color: #1a6fb8;
  font-size: 19px;
  font-weight: 900;
  transition: transform .12s;
}

.edit-btn:active { transform: scale(.95); }

.star-box {
  display: flex;
  align-items: center;
  gap: 6px;
  background: #e0f1ff;
  padding: 8px 16px;
  border-radius: 999px;
}

.star-icon { font-size: 24px; }

.star-num {
  font-size: 24px;
  font-weight: 900;
  color: #1f7fc4;
}

/* ===== 主视图 ===== */
.view {
  flex: 1;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding: 20px;
}

.view-inner {
  max-width: 900px;
  margin: 0 auto;
}

/* ===== 底部导航 ===== */
.tabbar {
  flex: 0 0 auto;
  display: flex;
  background: #fff;
  border-top: 3px solid #cfe6ff;
  padding-bottom: env(safe-area-inset-bottom);
}

.tab {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  padding: 12px 0;
  color: #b0b0b0;
  font-weight: 700;
  transition: all .15s;
}

.tab-ico { font-size: 30px; }

.tab-txt { font-size: 14px; }

.tab.active {
  color: #1f7fc4;
}

.tab.active .tab-ico {
  transform: scale(1.18);
}

.tab:active { transform: scale(.94); }

/* ===== 通用组件 ===== */
.page-title {
  font-size: 26px;
  font-weight: 900;
  color: #4a4a4a;
  margin: 0 0 4px;
}

.page-hint {
  font-size: 16px;
  color: #a0a0a0;
  margin: 0 0 18px;
}

.big-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: 64px;
  padding: 0 30px;
  border-radius: 20px;
  background: #4fa8e8;
  color: #fff;
  font-size: 24px;
  font-weight: 800;
  box-shadow: 0 5px 0 #e8863a;
  transition: transform .1s;
}

.big-btn:active {
  transform: translateY(4px);
  box-shadow: 0 1px 0 #e8863a;
}

.big-btn.green { background: #4ecdc4; box-shadow: 0 5px 0 #35b3ab; }
.big-btn.blue  { background: #6aa9ff; box-shadow: 0 5px 0 #4d8ce6; }
.big-btn.ghost { background: #fff; color: #7a7a7a; box-shadow: 0 0 0 3px #eee inset; }

:disabled { opacity: .45; }

/* ===== 示例内容提示条 ===== */
.demo-banner {
  display: block;
  width: 100%;
  text-align: left;
  background: #eef7ff;
  border: 3px dashed #a9d3ff;
  border-radius: 20px;
  padding: 16px 22px;
  margin-bottom: 18px;
  font-size: 19px;
  font-weight: 700;
  color: #3d7dbf;
  line-height: 1.6;
}

.demo-banner:active { transform: scale(.985); }

.demo-banner .demo-cta {
  font-size: 20px;
  font-weight: 900;
  color: #1f66ad;
}

/* ===== 句子选择列表（拼句子 / 对话共用） ===== */
.sent-list {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 14px;
}

.sent-card {
  position: relative;
  background: #fff;
  border: 3px solid #ffe0bd;
  border-radius: 22px;
  padding: 18px 20px;
  text-align: left;
  transition: all .15s;
}

.sent-card:active { transform: scale(.97); }

.sent-card .en {
  font-size: 26px;
  font-weight: 800;
  color: #3a3a3a;
  line-height: 1.3;
}

.sent-card .zh {
  font-size: 16px;
  color: #a8a8a8;
  margin-top: 6px;
}

.sent-card .done-flag {
  position: absolute;
  top: -10px;
  right: -8px;
  font-size: 30px;
}

.sent-card.done {
  border-color: #b7e6c4;
  background: #f4fdf6;
}

/* ===== 拼句子游戏 ===== */
.slots-row {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  justify-content: center;
  min-height: 84px;
  padding: 14px;
  background: #fff;
  border: 3px dashed #ffd1a3;
  border-radius: 22px;
  margin-bottom: 18px;
}

.slot {
  min-width: 92px;
  height: 66px;
  padding: 0 14px;
  border-radius: 16px;
  border: 3px solid #ffd1a3;
  background: #f2fbff;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 28px;
  font-weight: 800;
  color: #1f7fc4;
  transition: all .15s;
}

.slot.filled {
  background: #fff;
  border-style: solid;
  border-color: #74bdf0;
  color: #3a3a3a;
  box-shadow: 0 3px 0 #ffd9b8;
}

.slot.wrong {
  border-color: #ff7a7a;
  background: #fff2f2;
  color: #e05c5c;
  animation: shake .4s;
}

.slot.right {
  border-color: #7bd389;
  background: #f1fdf3;
  color: #3f9e52;
}

.cards-row {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  justify-content: center;
  margin-bottom: 20px;
}

.word-card {
  min-width: 92px;
  height: 66px;
  padding: 0 16px;
  border-radius: 16px;
  background: #fff;
  border: 3px solid #e6e6ee;
  box-shadow: 0 4px 0 #e6e6ee;
  font-size: 28px;
  font-weight: 800;
  color: #3a3a3a;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: transform .12s;
}

.word-card:active { transform: translateY(3px); box-shadow: 0 1px 0 #e6e6ee; }

.word-card.used {
  opacity: .25;
  pointer-events: none;
}

.word-card.hinted {
  border-color: #74bdf0;
  background: #eaf6ff;
  animation: pop .3s;
}

.puzzle-bar {
  display: flex;
  gap: 12px;
  justify-content: center;
  flex-wrap: wrap;
}

/* ===== 填空游戏 ===== */
.fill-sentence {
  text-align: center;
  font-size: 40px;
  font-weight: 900;
  color: #3a3a3a;
  line-height: 1.5;
  margin: 10px 0 6px;
  word-break: break-word;
}

.fill-sentence .blank {
  display: inline-block;
  min-width: 110px;
  padding: 0 6px;
  border-bottom: 6px solid #4fa8e8;
  color: #4fa8e8;
}

/* 正在填的那个空：底色highlight，孩子一眼知道该填哪 */
.fill-sentence .blank.cur {
  background: #e0f1ff;
  border-bottom-color: #2f8fd8;
  animation: blink 1.4s ease-in-out infinite;
}

.fill-sentence .blank.filled {
  color: #2e9e46;
  border-bottom-color: #7bd389;
  background: transparent;
  animation: none;
}

@keyframes blink {
  0%, 100% { background: #e0f1ff; }
  50%      { background: #cfe9ff; }
}

/* 中文题面（中译英） */
.fill-sentence.zh-big {
  font-size: 46px;
  color: #2b2b2b;
  margin: 26px 0 34px;
}

/* 进阶模式提示条 */
.page-hint.hard-tip {
  display: inline-block;
  background: #e0f1ff;
  color: #16639e;
  font-weight: 800;
  font-size: 17px;
  padding: 6px 16px;
  border-radius: 999px;
  margin: 0 auto 6px;
}

/* 选项是整句时，字号降下来，避免溢出 */
.opt-card.sent .en {
  font-size: 21px;
  font-weight: 800;
  line-height: 1.35;
  text-align: left;
}

.fill-zh {
  text-align: center;
  font-size: 20px;
  color: #a8a8a8;
  margin-bottom: 26px;
}

.opt-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 14px;
  max-width: 760px;
  margin: 0 auto;
}

.opt-card {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
  min-height: 100px;
  padding: 14px;
  border-radius: 22px;
  background: #fff;
  border: 3px solid #e6e6ee;
  box-shadow: 0 5px 0 #e6e6ee;
  transition: all .12s;
}

.opt-card:active { transform: translateY(4px); box-shadow: 0 1px 0 #e6e6ee; }

.opt-card .ico { font-size: 40px; line-height: 1; }
.opt-card .en { font-size: 30px; font-weight: 900; }
.opt-card .zh { font-size: 15px; color: #a8a8a8; }

.opt-card.ok  { border-color: #7bd389; background: #f1fdf3; box-shadow: 0 5px 0 #b7e6c4; }
.opt-card.no  { border-color: #ff9d9d; background: #fff2f2; animation: shake .4s; }

/* ===== 听音游戏 ===== */
.listen-hero {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 14px;
  margin: 8px 0 24px;
}

.play-btn {
  width: 150px;
  height: 150px;
  border-radius: 50%;
  background: #6aa9ff;
  color: #fff;
  font-size: 66px;
  box-shadow: 0 8px 0 #4d8ce6;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: transform .12s;
}

.play-btn:active { transform: translateY(6px); box-shadow: 0 2px 0 #4d8ce6; }
.play-btn.playing { animation: pulse 1s infinite; }

.listen-hint {
  font-size: 18px;
  color: #a0a0a0;
}

.listen-zh-hint {
  font-size: 20px;
  color: #7a7a7a;
  min-height: 28px;
  font-weight: 700;
}

/* ===== 对话 / 跟读 ===== */
.talk-stage {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 16px;
  padding: 24px 20px;
  background: #fff;
  border-radius: 26px;
  border: 3px solid #d8ecff;
  text-align: center;
}

.talk-role {
  font-size: 16px;
  color: #a0a0a0;
  font-weight: 700;
}

.talk-en {
  font-size: 38px;
  font-weight: 900;
  color: #3a3a3a;
  line-height: 1.35;
}

.talk-zh {
  font-size: 20px;
  color: #8a8a8a;
}

.talk-emoji { font-size: 64px; line-height: 1; }

.mic-btn {
  width: 130px;
  height: 130px;
  border-radius: 50%;
  background: #ff6b9d;
  color: #fff;
  font-size: 56px;
  box-shadow: 0 7px 0 #e2548a;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all .12s;
}

.mic-btn:active { transform: translateY(5px); box-shadow: 0 2px 0 #e2548a; }
.mic-btn.recording { background: #e05c5c; box-shadow: 0 7px 0 #c94b4b; animation: pulse 1.2s infinite; }

.heard-text {
  font-size: 22px;
  font-weight: 800;
  color: #3f9e52;
  min-height: 34px;
  background: #f1fdf3;
  border-radius: 14px;
  padding: 6px 18px;
}

.heard-text.bad { color: #c96a6a; background: #fff2f2; }

.talk-nav {
  display: flex;
  justify-content: center;
  gap: 14px;
  margin-top: 18px;
}

.progress-dots {
  display: flex;
  gap: 8px;
  justify-content: center;
  margin-top: 14px;
}

.dot {
  width: 14px;
  height: 14px;
  border-radius: 50%;
  background: #e6e6ee;
}

.dot.on { background: #4fa8e8; }
.dot.done { background: #7bd389; }

/* ===== 设置页 ===== */
.setup-block {
  background: #fff;
  border-radius: 24px;
  padding: 20px;
  margin-bottom: 18px;
  border: 3px solid #cfe6ff;
}

.setup-block h3 {
  margin: 0 0 6px;
  font-size: 22px;
  font-weight: 900;
  color: #4a4a4a;
}

.setup-block .desc {
  margin: 0 0 14px;
  font-size: 15px;
  color: #a0a0a0;
  line-height: 1.6;
}

textarea.input {
  width: 100%;
  min-height: 150px;
  border: 3px solid #e6e6ee;
  border-radius: 16px;
  padding: 14px;
  font-size: 18px;
  font-family: inherit;
  line-height: 1.6;
  resize: vertical;
  user-select: text;
  -webkit-user-select: text;
  color: #3a3a3a;
  background: #fdfdfd;
}

textarea.input:focus {
  outline: none;
  border-color: #74bdf0;
}

input.input {
  width: 100%;
  border: 3px solid #e6e6ee;
  border-radius: 16px;
  padding: 12px 14px;
  font-size: 20px;
  font-family: inherit;
  font-weight: 800;
  user-select: text;
  -webkit-user-select: text;
  color: #3a3a3a;
  background: #fdfdfd;
}

input.input:focus { outline: none; border-color: #74bdf0; }

.row-btns {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
  margin-top: 14px;
}

.small-btn {
  padding: 12px 22px;
  border-radius: 16px;
  background: #f4f4f6;
  font-size: 18px;
  font-weight: 800;
  color: #6a6a6a;
  transition: all .12s;
}

.small-btn:active { transform: scale(.96); }
.small-btn.primary { background: #4fa8e8; color: #fff; }
.small-btn.danger { background: #fff0f0; color: #d96969; }

.word-chips {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin-top: 14px;
}

.chip {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 10px 16px;
  border-radius: 999px;
  background: #eaf6ff;
  font-size: 18px;
  font-weight: 700;
}

.chip .chip-ico { font-size: 22px; }
.chip .chip-zh { color: #a0a0a0; font-size: 15px; }
.chip .chip-x { color: #d09090; font-weight: 900; margin-left: 4px; }

.switch-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  padding: 12px 0;
}

.switch-row + .switch-row { border-top: 2px solid #f2f2f5; }

.switch-label { font-size: 18px; font-weight: 800; color: #4a4a4a; }
.switch-desc { font-size: 14px; color: #a5a5a5; margin-top: 2px; }

.toggle {
  flex: 0 0 auto;
  width: 74px;
  height: 42px;
  border-radius: 999px;
  background: #e6e6ee;
  position: relative;
  transition: background .2s;
}

.toggle.on { background: #7bd389; }

.toggle .knob {
  position: absolute;
  top: 4px;
  left: 4px;
  width: 34px;
  height: 34px;
  border-radius: 50%;
  background: #fff;
  box-shadow: 0 2px 4px rgba(0,0,0,.18);
  transition: left .2s;
}

.toggle.on .knob { left: 36px; }

/* ===== 弹层 ===== */
.overlay {
  position: fixed;
  inset: 0;
  background: rgba(50, 40, 30, .45);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 50;
  padding: 24px;
}

.overlay.hidden { display: none; }

.overlay-card {
  background: #fff;
  border-radius: 28px;
  padding: 30px 34px;
  text-align: center;
  max-width: 560px;
  width: 100%;
  box-shadow: 0 20px 50px rgba(0,0,0,.2);
  animation: pop .3s;
}

.overlay-title {
  font-size: 34px;
  font-weight: 900;
  margin: 0 0 8px;
  color: #4a4a4a;
}

.overlay-text {
  font-size: 19px;
  color: #8a8a8a;
  line-height: 1.6;
  margin: 0 0 20px;
}

.overlay-emoji { font-size: 82px; line-height: 1; margin-bottom: 10px; }

/* ===== 空状态 ===== */
.empty {
  text-align: center;
  padding: 50px 20px;
}

.empty .ico { font-size: 90px; line-height: 1; }
.empty .txt { font-size: 22px; color: #a0a0a0; margin: 14px 0 22px; }

/* ===== 彩纸 ===== */
.confetti-layer {
  position: fixed;
  inset: 0;
  pointer-events: none;
  overflow: hidden;
  z-index: 60;
}

.confetti-piece {
  position: absolute;
  font-size: 30px;
  will-change: transform;
}

/* ===== 动画 ===== */
@keyframes shake {
  0%, 100% { transform: translateX(0); }
  20% { transform: translateX(-9px); }
  40% { transform: translateX(9px); }
  60% { transform: translateX(-6px); }
  80% { transform: translateX(6px); }
}

@keyframes pop {
  0% { transform: scale(.82); opacity: 0; }
  70% { transform: scale(1.06); }
  100% { transform: scale(1); opacity: 1; }
}

@keyframes pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.07); }
}

.hidden { display: none !important; }

/* =========================================================
   冰雪世界：雪花、角色、剧本对话
   ========================================================= */

/* 飘雪背景（不挡点击） */
.snow {
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  overflow: hidden;
}

.snow .flake {
  position: absolute;
  top: -40px;
  color: #9fd3f5;
  animation: fall linear infinite;
}

@keyframes fall {
  to { transform: translateY(112vh) rotate(320deg); }
}

#app { position: relative; z-index: 1; }

/* ------ 角色头像 ------ */
.role-pick {
  display: flex;
  justify-content: center;
  gap: 18px;
  margin-bottom: 14px;
}

.role-card {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  padding: 10px 18px 12px;
  border-radius: 22px;
  background: #fff;
  border: 4px solid #d8e9fb;
  transition: transform .15s, border-color .15s;
}

.role-card .av { width: 74px; height: 74px; }

.role-card .nm {
  font-size: 17px;
  font-weight: 900;
  color: #4a7fa8;
}

.role-card.on {
  border-color: #4fa8e8;
  background: #eaf6ff;
  transform: translateY(-3px);
  box-shadow: 0 6px 0 #b9dcf7;
}

.role-card.on.anna { border-color: #f0873f; background: #fff2e8; box-shadow: 0 6px 0 #f9c8a2; }
.role-card.on.anna .nm { color: #c95f18; }

/* ------ 剧情台词卡 ------ */
.scene {
  background: linear-gradient(180deg, #fff 0%, #f2faff 100%);
  border: 4px solid #cfe6ff;
  border-radius: 26px;
  padding: 18px 20px;
  margin-bottom: 16px;
}

.scene-line {
  display: flex;
  align-items: center;
  gap: 14px;
}

.scene-line.me { flex-direction: row-reverse; }

.scene-line .av {
  width: 84px;
  height: 84px;
  flex: 0 0 auto;
}

.scene-line .who {
  font-size: 15px;
  font-weight: 800;

// 本周出现过的所有英文实词（去掉标点、缩写、功能词）
function contentWords() {
  const pool = [];
  data.words.forEach(w => {
    String(w.en).split(/\s+/).forEach(t => { if (/^[A-Za-z]/.test(t)) pool.push(t.replace(/[.,!?]/g, '')); });
  });
  data.sentences.forEach(s => {
    tokenize(s.en).forEach(t => {
      const bare = t.replace(/[.,!?]/g, '');
      if (/^[A-Za-z]/.test(bare) && bare.length > 1 && !STOP.has(bare.toLowerCase()) && !/['']/.test(bare)) pool.push(bare);
    });
  });
  return Array.from(new Set(pool.filter(Boolean)));
}

// 干扰项：优先本周同类词、首字母相同（形近），不够用内置词库补
function optsAround(target, n) {
  const t = String(target).replace(/[.,!?]/g, '');
  const tl = t.toLowerCase();
  let pool = contentWords().filter(w => w.toLowerCase() !== tl);
  const first = w => (w[0] || '').toLowerCase() === (t[0] || '').toLowerCase() ? 0 : 1;
  pool = shuffle(pool).sort((a, b) => first(a) - first(b));
  let picked = pool.slice(0, n - 1);
  if (picked.length < n - 1) picked = picked.concat(filler(n - 1 - picked.length, [t].concat(picked)));
  return shuffle([t].concat(picked));
}

// 简单模式的选项：本周词随机
function easyOpts(target) {
  const all = data.words.map(w => w.en);
  let pool = all.filter(x => x.toLowerCase() !== String(target).toLowerCase());
  const need = 3 - pool.length;
  if (need > 0) pool = pool.concat(filler(need, pool.concat([target])));
  return shuffle([target].concat(shuffle(pool).slice(0, 3)));
}

// 多余的卡片（拼句子用）
function decoys(exclude, n) {
  const ex = new Set(exclude.map(x => String(x).replace(/[.,!?]/g, '').toLowerCase()));
  let pool = contentWords().filter(w => !ex.has(w.toLowerCase()));
  if (pool.length < n) pool = pool.concat(filler(n - pool.length, Array.from(ex)));
  return shuffle(pool).slice(0, n);
}

// 把一个句子换个关键词，造出「听着很像」的干扰句
function sentVariants(s, n) {
  const toks = tokenize(s.en);
  const cand = [];
  toks.forEach((t, i) => {
    const bare = t.replace(/[.,!?]/g, '');
    if (/^[A-Za-z]/.test(bare) && bare.length > 2 && !STOP.has(bare.toLowerCase()) && !/['']/.test(bare)) cand.push(i);
  });
  const subs = shuffle(contentWords().concat(DICT.slice(0, 80)));
  const outs = [];
  for (const i of cand) {
    if (outs.length >= n) break;
    const w = toks[i];
    const bare = w.replace(/[.,!?]/g, '');
    const tailCh = w.slice(bare.length);
    const alt = subs.find(x => x.toLowerCase() !== bare.toLowerCase());
    if (!alt) continue;
    const copy = toks.slice();
    copy[i] = alt + tailCh;
    outs.push(copy.join(' ').replace(/\s+([.,!?])/g, '$1'));
  }
  return outs;
}

function snowfall() {
  const box = $('#snow');
  if (!box || box.children.length) return;
  const marks = ['❄', '❅', '❆', '✦'];
  for (let i = 0; i < 22; i++) {
    const s = document.createElement('span');
    s.className = 'flake';
    s.textContent = marks[i % marks.length];
    s.style.left = (Math.random() * 100).toFixed(2) + '%';
    s.style.fontSize = (9 + Math.random() * 14).toFixed(0) + 'px';
    s.style.animationDuration = (9 + Math.random() * 11).toFixed(1) + 's';
    s.style.animationDelay = (Math.random() * 12).toFixed(1) + 's';
    s.style.opacity = (0.35 + Math.random() * 0.45).toFixed(2);
    box.appendChild(s);
  }
}

/* ---------- 小工具 ---------- */
const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));

function esc(s) {
  return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
}

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function emoOf(word) {
  const k = String(word || '').toLowerCase().replace(/[^a-z]/g, '');
  return EMOJI_MAP[k] || '';
}

function tokenize(s) {
  return (String(s).trim().match(/[A-Za-z][A-Za-z']*|[.,!?]/g) || []);
}

// 拆分 "英文 | 中文"
function splitSent(line) {
  let parts = line.split(/[|｜\t]/).map(s => s.trim()).filter(Boolean);
  if (!parts.length) return null;
  if (parts.length === 1) return { en: parts[0], zh: '' };
  const zi = parts.findIndex(p => /[\u4e00-\u9fa5]/.test(p));
  if (zi >= 0) {
    const zh = parts[zi];
    const en = parts.filter((_, i) => i !== zi).join(' ');
    return { en, zh };
  }
  return { en: parts[0], zh: parts.slice(1).join(' ') };
}

// 拆分 "apple 苹果" / "ice cream 冰淇淋"
function splitWord(line) {
  let parts;
  if (/[\t,，;；]/.test(line)) {
    parts = line.split(/[\t,，;；]/).map(s => s.trim()).filter(Boolean);
  } else {
    const seg = line.trim().split(/\s+/);
    if (seg.length <= 2) parts = seg;
    else parts = [seg.slice(0, -1).join(' '), seg[seg.length - 1]];
  }
  const en = (parts[0] || '').trim();
  const zh = parts.slice(1).join(' ').trim();
  if (!en) return null;
  return { en, zh };
}

/* ---------- 朗读 ---------- */
let cachedVoice = null;

function pickVoice() {
  if (cachedVoice) return cachedVoice;
  if (!('speechSynthesis' in window)) return null;
  const all = speechSynthesis.getVoices().filter(v => v.lang && v.lang.toLowerCase().startsWith('en'));
  if (!all.length) return null;
  const us = all.filter(v => v.lang.replace('_', '-').toLowerCase() === 'en-us');
  const pool = us.length ? us : all;
  const prefer = ['samantha', 'alex', 'ava', 'allison', 'susan', 'karen', 'daniel', 'moira', 'google us english'];
  for (const n of prefer) {
    const hit = pool.find(v => v.name.toLowerCase().includes(n));
    if (hit) { cachedVoice = hit; return hit; }
  }
  cachedVoice = pool[0];
  return cachedVoice;
}

if ('speechSynthesis' in window) {
  speechSynthesis.onvoiceschanged = () => { cachedVoice = null; pickVoice(); };
  pickVoice();
}

function speak(text, opts) {
  opts = opts || {};
  if (!('speechSynthesis' in window)) return;
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'en-US';
    u.rate = opts.rate || (data.settings.rate || 0.85);
    u.pitch = 1.05;
    const v = pickVoice();
    if (v) u.voice = v;
    if (opts.onend) u.onend = opts.onend;
    speechSynthesis.speak(u);
  } catch (e) {}
}

function shutUp() {
  if ('speechSynthesis' in window) { try { speechSynthesis.cancel(); } catch (e) {} }
}

/* ---------- 音效（无需音频文件） ---------- */
let AC = null;
function sfx(type) {
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    if (AC.state === 'suspended') AC.resume();
    const notes = { right: [523, 659, 784], wrong: [311, 233], tap: [700], win: [523, 659, 784, 1047] }[type] || [600];
    const t0 = AC.currentTime;
    notes.forEach((f, i) => {
      const o = AC.createOscillator(), g = AC.createGain();
      o.type = 'sine';
      o.frequency.value = f;
      const st = t0 + i * 0.1;
      g.gain.setValueAtTime(0.0001, st);
      g.gain.linearRampToValueAtTime(0.16, st + 0.015);
      g.gain.exponentialRampToValueAtTime(0.0001, st + 0.25);
      o.connect(g); g.connect(AC.destination);
      o.start(st); o.stop(st + 0.28);
    });
  } catch (e) {}
}

/* iOS 上语音引擎必须在用户手势里先"碰"一次，否则后面自动朗读会没声音 */
let unlocked = false;
function unlockSpeech() {
  if (unlocked) return;
  unlocked = true;
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    if (AC.state === 'suspended') AC.resume();
  } catch (e) {}
  if ('speechSynthesis' in window) {
    try {
      const u = new SpeechSynthesisUtterance(' ');
      u.volume = 0;
      u.lang = 'en-US';
      speechSynthesis.speak(u);
    } catch (e) {}
  }
}
document.addEventListener('click', unlockSpeech);

/* ---------- 彩纸 ---------- */
function confetti() {
  const layer = $('#confetti');
  const emos = ['🎉', '⭐', '🎊', '🌟', '🎈', '🍬'];
  for (let i = 0; i < 30; i++) {
    const el = document.createElement('div');
    el.className = 'confetti-piece';
    el.textContent = emos[i % emos.length];
    el.style.left = (Math.random() * 96 + 2) + 'vw';
    el.style.top = '-50px';
    layer.appendChild(el);
    const dur = 1700 + Math.random() * 1300;
    if (!el.animate) { setTimeout(() => el.remove(), dur); continue; }
    const anim = el.animate([
      { transform: 'translate(0,0) rotate(0deg)', opacity: 1 },
      { transform: `translate(${(Math.random() * 160 - 80).toFixed(0)}px, 110vh) rotate(${(Math.random() * 720 - 360).toFixed(0)}deg)`, opacity: 0.85 }
    ], { duration: dur, easing: 'cubic-bezier(.25,.6,.6,1)' });
    anim.onfinish = () => el.remove();
  }
}

function chapterDone(k) {
  const p = (prog[state.kid] && prog[state.kid].awarded) || {};

    && data.words.length > 0 && data.words.every((_, i) => p['fill_w' + i]);

function puzzleState() {
  const s = data.sentences[state.puzzleIdx];
  const toks = tokenize(s.en);
  const tail = /[.,!?]/.test(toks[toks.length - 1]) ? toks[toks.length - 1] : '';
  const words = tail ? toks.slice(0, -1) : toks;
  let pieces;
  if (levelOf() === 'hard') {
    // 进阶：混入多余卡片，卡片数 > 空格数
    const extra = words.length >= 4 ? 2 : 1;
    pieces = shuffle(words.concat(decoys(words, extra)));
  } else {
    pieces = shuffle(words);
  }
  return { words, pieces };
}

// 运行时状态挂在 DOM 上
let pz = { words: [], pieces: [], used: {}, slots: [] };
let pzAutoTimer = null;   // 拼对后自动跳下一句的定时器

function initPuzzle() {
  const st = puzzleState();
  pz = { words: st.words, pieces: st.pieces, used: {}, slots: new Array(st.words.length).fill(null) };
  paintPuzzle();
}

function paintPuzzle() {
  const slotsEl = $('#slots');
  slotsEl.innerHTML = pz.words.map((w, i) => {
    const v = pz.slots[i];
    return `<div class="slot ${v ? 'filled' : ''}" data-act="pz-unslot" data-i="${i}">${v ? esc(v) : ''}</div>`;
  }).join('');

  $('#cards').innerHTML = pz.pieces.map((w, i) => {
    return `<button class="word-card ${pz.used[i] ? 'used' : ''}" data-act="pz-slot" data-p="${i}">${esc(w)}</button>`;
  }).join('');
}

function pzPlace(pIdx) {
  if (pz.used[pIdx]) return;
  const empty = pz.slots.indexOf(null);
  if (empty < 0) return;
  pz.used[pIdx] = true;
  pz.slots[empty] = pz.pieces[pIdx];
  sfx('tap');
  paintPuzzle();
  if (pz.slots.indexOf(null) < 0) setTimeout(pzCheck, 180);
}

function pzUnslot(i) {
  if (!pz.slots[i]) return;
  const w = pz.slots[i];
  // 找到对应卡片下标（优先未使用的同内容卡片）
  const idx = pz.pieces.findIndex((p, k) => p === w && !pz.used[k]);
  if (idx >= 0) pz.used[idx] = false;
  else {
    const any = pz.pieces.findIndex((p, k) => p === w && pz.used[k]);
    if (any >= 0) pz.used[any] = false;
  }
  pz.slots[i] = null;
  sfx('tap');
  paintPuzzle();
}

function pzCheck() {
  const ok = pz.slots.every((v, i) => String(v).toLowerCase() === String(pz.words[i]).toLowerCase());
  const s = data.sentences[state.puzzleIdx];
  if (ok) {
    sfx('win');
    confetti();
    $$('.slot').forEach(el => el.classList.add('right'));
    const fresh = award('puzzle_' + state.puzzleIdx);
    speak(s.en, { rate: 0.8 });
    if (state.finalePending) { state.finalePending = false; finaleShow(); return; }
    if (state.chapterJustDone === 'puzzle') { state.chapterJustDone = null; state.puzzleIdx = null; chapterClear('puzzle'); return; }

    // 章节还没完：庆祝一下，自动去下一个没拼过的句子（不用回列表再点）
    const next = nextPuzzleIdx(state.puzzleIdx);
    if (next === null) { state.puzzleIdx = null; chapterClear('puzzle'); return; }
    showOverlay(`<div class="overlay-emoji">🎉</div>
      <h3 class="overlay-title">拼对啦！</h3>
      <p class="overlay-text">${esc(s.en)}<br><span style="color:#a0a0a0">${esc(s.zh || '')}</span></p>
      <div class="ov-btns">
        <button class="big-btn green" data-act="pz-next" data-i="${next}">下一句 →</button>
        <button class="big-btn ghost" data-act="ov-closepuzzle">留在这句</button>
      </div>
      <p class="auto-tip">马上自动去下一句…</p>`);
    if (pzAutoTimer) clearTimeout(pzAutoTimer);
    pzAutoTimer = setTimeout(() => { pzAutoTimer = null; goPuzzle(next); }, 2600);
  } else {
    sfx('wrong');
    $$('.slot').forEach(el => el.classList.add('wrong'));
    setTimeout(() => {
      pz.slots = new Array(pz.words.length).fill(null);
      pz.used = {};
      paintPuzzle();
    }, 1200);
  }
}

// 下一个还没拼对的句子：先往后找，找不到就绕回开头找
function nextPuzzleIdx(cur) {
  const done = i => !!(prog[state.kid] || { awarded: {} }).awarded['puzzle_' + i];
  for (let i = cur + 1; i < data.sentences.length; i++) if (!done(i)) return i;
  for (let i = 0; i < cur; i++) if (!done(i)) return i;
  return null;
}

function goPuzzle(i) {
  if (pzAutoTimer) { clearTimeout(pzAutoTimer); pzAutoTimer = null; }
  hideOverlay();
  state.puzzleIdx = i;
  sfx('tap');
  render();
}

function pzPut(i) {
  const idx = pz.pieces.findIndex((p, k) => p.toLowerCase() === pz.words[i].toLowerCase() && !pz.used[k]);
  if (idx < 0) return false;
  pz.used[idx] = true;
  pz.slots[i] = pz.pieces[idx];
  paintPuzzle();
  const c = $$('.word-card')[idx];
  if (c) c.classList.add('hinted');
  return true;
}

function pzHint() {
  // 从左往右找到第一个不对的位置：错的先撤回，再把正确词放进去
  for (let i = 0; i < pz.words.length; i++) {
    const cur = pz.slots[i];
    if (cur && String(cur).toLowerCase() === String(pz.words[i]).toLowerCase()) continue;
    if (cur) pzUnslot(i);
    if (pzPut(i)) sfx('tap');
    if (pz.slots.indexOf(null) < 0) setTimeout(pzCheck, 180);
    return;
  }
}

/* =========================================================
   视图：挖空填空
   ========================================================= */
function buildFillQs() {
  const hard = levelOf() === 'hard';
  const qs = [];

  data.sentences.forEach((s, si) => {
    const toks = tokenize(s.en);
    const cand = [];
    toks.forEach((t, i) => {
      const bare = t.replace(/[.,!?]/g, '');
      if (/^[A-Za-z]/.test(bare) && bare.length > 2 && !STOP.has(bare.toLowerCase()) && !/['']/.test(bare)) cand.push(i);
    });
    if (!cand.length) return;
    // 进阶：一句话挖两个空（句子里有 2 个以上实词时）
    const take = (hard && cand.length >= 2) ? 2 : 1;
    const idxs = shuffle(cand).slice(0, take).sort((a, b) => a - b);
    const blanks = idxs.map(i => {
      const ans = toks[i].replace(/[.,!?]/g, '');
      return { at: i, answer: ans, opts: hard ? optsAround(ans, 4) : easyOpts(ans) };
    });
    qs.push({ kind: 'sentence', toks, blanks, filled: [], sent: s, si });
  });

  data.words.forEach((w, wi) => {
    qs.push({ kind: 'word', target: w.en, opts: hard ? optsAround(w.en, 4) : easyOpts(w.en), word: w, wi });
  });

  // 进阶专属题型：给中文，选正确的英文句子
  if (hard) {
    const withZh = data.sentences.filter(s => s.zh);
    if (withZh.length >= 3) {
      data.sentences.forEach((s, si) => {
        if (!s.zh) return;
        const pool = data.sentences.filter((o, i) => i !== si && o.en).map(o => o.en);
        if (pool.length < 3) return;
        qs.push({ kind: 'zh2en', sent: s, si, opts: shuffle([s.en].concat(shuffle(pool).slice(0, 3))) });
      });
    }
  }

  return qs;
}

function fillBlankHTML(tok, i, q) {
  const bi = q.blanks.findIndex(b => b.at === i);
  if (bi < 0) return esc(tok);
  const v = q.filled[bi];
  const cur = q.filled.length === bi;
  return `<span class="blank ${v ? 'filled' : ''} ${cur ? 'cur' : ''}" data-b="${bi}">${v ? esc(v) : '&nbsp;?&nbsp;'}</span>`;
}

function viewFill() {
  if (!data.sentences.length && !data.words.length) return emptyView('🕳️', '还没有内容', '去「设置」里添加句型和单词');

  let body = '', title = '选一个词填进去', opts = [], optClass = '';

  if (q.kind === 'sentence') {

    body = `<div class="fill-sentence">${parts.join(' ').replace(/\s+([.,!?])/g, '$1')}</div>
            <div class="fill-zh">${esc(q.sent.zh || '')}</div>`;
    if (q.blanks.length > 1) title = `把两个空都填上（${Math.min(q.filled.length, q.blanks.length)}/${q.blanks.length}）`;
    const cur = q.blanks[q.filled.length];

  let html = '<div class="view-inner">';

  html += `<h2 class="page-title">🕳️ ${title}</h2>`;
  html += `<p class="page-hint">第 ${state.fillI + 1} / ${state.fillQs.length} 题</p>`;
  html += body;
  html += '<div class="opt-grid" id="optGrid">';
  opts.forEach(o => {

function fillPick(btn) {
  const q = state.fillQs[state.fillI];

  // 句子题：逐空填，当前空对了才进下一个

    setTimeout(() => btn.classList.remove('no'), 600);

function nextFill() {

/* =========================================================
   视图：拼写（名词 + 代词，三档递进：排字母 → 补字母 → 自己打）
   设计原则：错不扣分、提示随时给，先让她愿意拼，再求拼对
   ========================================================= */

// 能拿來拼写的词：单个英文词（名词、代词都算）
function spellWords() {
  const out = [];
  data.words.forEach((w, i) => {
    if (/^[A-Za-z]{2,}$/.test(w.en.trim())) out.push({ en: w.en.trim(), zh: w.zh, wi: i });
  });
  return out;
}

const SPELL_ROUND = 10;

function buildSpellQs() {
  const hard = levelOf() === 'hard';
  const ws = spellWords();
  if (!ws.length) return [];
  const p = prog[state.kid] || { awarded: {} };
  const aw = p.awarded || {};
  // 还不会的排前面；会了的也保留，混着练
  const order = shuffle(ws.filter(x => !aw['spell_' + x.wi]))
    .concat(shuffle(ws.filter(x => aw['spell_' + x.wi])));
  const pick = order.slice(0, Math.min(SPELL_ROUND, order.length));
  const n = pick.length;
  const a = Math.max(1, Math.round(n * 0.3));
  const b = Math.max(1, Math.round(n * 0.3));

  return pick.map((x, k) => {
    const q = { en: x.en, zh: x.zh, wi: x.wi, kind: 'type' };
    q.kind = k < a ? 'tile' : (k < a + b ? 'gap' : 'type');
    if (!hard && q.kind === 'type') q.kind = 'gap'; // 简单模式不做整词默写
    const L = x.en.split('');

    if (q.kind === 'tile') {
      let idxs = L.map((_, i) => i);
      if (!hard) idxs = idxs.slice(1);            // 简单模式首字母直接送
      q.pieces = shuffle(idxs).map(i => ({ ch: L[i] }));
      if (hard) {
        const pool = spellWords().filter(o => o.wi !== x.wi).map(o => o.en).join('').split('');
        const extra = shuffle(Array.from(new Set(pool))).slice(0, 2);
        q.pieces = shuffle(q.pieces.concat(extra.map(ch => ({ ch, decoy: true }))));
      }
    }

    if (q.kind === 'gap') {
      const nGap = hard ? Math.min(2, Math.max(1, L.length - 1)) : 1;
      const cand = hard ? L.map((_, i) => i) : L.map((_, i) => i).slice(1);
      q.gaps = shuffle(cand).slice(0, nGap).sort((m, n2) => m - n2);
      const right = Array.from(new Set(q.gaps.map(i => L[i])));
      const opts = right.slice();
      const alpha = 'abcdefghijklmnopqrstuvwxyz'.split('');
      let guard = 0;
      while (opts.length < 4 && guard++ < 60) {
        const c = alpha[Math.floor(Math.random() * 26)];
        if (!opts.includes(c)) opts.push(c);
      }
      q.opts = shuffle(opts);
    }
    return q;
  });
}

function spResetBuf() {
  const q = state.spellQs[state.spellI];
  state.spellMsg = ''; state.spellBad = false; state.spellGapAt = 0;
  if (!q) { state.spellBuf = []; return; }
  const L = q.en.split('');
  if (q.kind === 'tile') {
    state.spellBuf = L.map(() => '');
    if (levelOf() !== 'hard') state.spellBuf[0] = L[0];
  } else if (q.kind === 'gap') {
    state.spellBuf = L.slice();
  } else {
    state.spellBuf = [];
  }
}

// tile 卡片哪些已被占用：按已填字母贪心反推，不用单独维护
function spUsedFlags(q) {
  const used = q.pieces.map(() => false);
  state.spellBuf.forEach(c => {
    if (!c) return;
    const k = q.pieces.findIndex((p, pi) => !used[pi] && p.ch.toLowerCase() === c.toLowerCase());
    if (k >= 0) used[k] = true;
  });
  return used;
}

function spSlotsHTML(q) {
  const L = q.en.split('');
  const hard = levelOf() === 'hard';
  let html = '<div class="sp-slots">';
  L.forEach((ch, i) => {
    let shown = '', cls = '';
    if (q.kind === 'tile') {
      shown = state.spellBuf[i] || '';
      if (i === 0 && !hard) cls = ' fixed';
    } else if (q.kind === 'gap') {
      const gi = q.gaps.indexOf(i);
      if (gi < 0) { shown = ch; cls = ' fixed'; }
      else if (gi < state.spellGapAt) { shown = ch; cls = ' ok'; }
      else { shown = ''; if (gi === state.spellGapAt) cls = ' cur'; }
    } else {
      shown = state.spellBuf[i] || '';
      if (i === state.spellBuf.length) cls = ' cur';
    }
    html += `<div class="sp-slot${cls}" data-act="${cls.includes('fixed') || cls.includes('ok') ? '' : 'sp-unslot'}" data-i="${i}">${esc(shown)}</div>`;
  });
  html += '</div>';
  return html;
}

const KB_ROWS = [
  ['a', 'b', 'c', 'd', 'e', 'f', 'g', 'h', 'i'],
  ['j', 'k', 'l', 'm', 'n', 'o', 'p', 'q', 'r'],
  ['s', 't', 'u', 'v', 'w', 'x', 'y', 'z']
];

function viewSpell() {
  if (!data.words.length) return emptyView('✍️', '还没有单词', '去「录入」里把本周单词粘进去');
  if (!state.spellQs.length) {
    state.spellQs = buildSpellQs();
    state.spellI = 0;
    spResetBuf();
    if (!state.spellQs.length) return emptyView('✍️', '没有可以拼写的单词', '单词要是单独的英文词才好拼');
  }
  const q = state.spellQs[state.spellI];
  if (!q) return '<div class="view-inner"></div>';

  const hard = levelOf() === 'hard';
  const tip = q.kind === 'tile'
    ? (hard ? '把字母卡按顺序点进去（混了多余的卡，要挑出来）' : '首字母已经给你啦，把剩下的字母按顺序点进去')
    : q.kind === 'gap' ? '补上缺掉的那个字母' : '用下面的字母键盘，把这个词自己打出来';
  const ico = emoOf(q.en);

  let html = '<div class="view-inner">';
  html += chapterBanner('spell');
  html += `<h2 class="page-title">✍️ 把这个词拼出来</h2>`;
  html += `<p class="page-hint">第 ${state.spellI + 1} / ${state.spellQs.length} 个 · ${tip}</p>`;
  html += `<div class="sp-prompt">
      ${ico ? `<span class="sp-ico">${ico}</span>` : ''}
      <span class="sp-zh">${esc(q.zh || '听一听，写下来')}</span>
      <button class="sp-speak" data-act="sp-speak">🔊 听</button>
    </div>`;
  html += `<div class="sp-stage${state.spellBad ? ' bad' : ''}">${spSlotsHTML(q)}</div>`;
  html += `<div class="sp-msg ${state.spellBad ? 'bad' : ''}">${state.spellMsg ? esc(state.spellMsg) : '&nbsp;'}</div>`;

  if (q.kind === 'tile') {
    const used = spUsedFlags(q);
    html += '<div class="sp-cards">';
    q.pieces.forEach((p, i) => {
      html += `<button class="sp-card${used[i] ? ' used' : ''}" data-act="sp-tile" data-p="${i}">${esc(p.ch)}</button>`;
    });
    html += '</div>';
  } else if (q.kind === 'gap') {
    html += '<div class="sp-cards">';
    q.opts.forEach(c => {
      html += `<button class="sp-card" data-act="sp-gap" data-c="${esc(c)}">${esc(c)}</button>`;
    });
    html += '</div>';
  } else {
    html += '<div class="sp-kb">';
    KB_ROWS.forEach(row => {
      html += '<div class="sp-kb-row">';
      row.forEach(c => { html += `<button class="sp-key" data-act="sp-key" data-c="${c}">${c.toUpperCase()}</button>`; });
      html += '</div>';
    });
    html += `<div class="sp-kb-row"><button class="sp-key wide" data-act="sp-back">⌫ 退一格</button></div>`;
    html += '</div>';
  }

  html += `<div class="sp-bar">
      <button class="big-btn ghost" data-act="sp-hint">💡 提示</button>
      <button class="big-btn ghost" data-act="sp-reset">🔄 重来</button>
      <button class="big-btn ghost" data-act="sp-skip">⏭️ 换一个</button>
    </div>`;
  html += '</div>';
  return html;
}

function spFull() {
  const q = state.spellQs[state.spellI];
  if (q.kind === 'gap') return state.spellGapAt >= q.gaps.length;
  return state.spellBuf.filter(Boolean).length >= q.en.length;
}

function spCheck() {
  const q = state.spellQs[state.spellI];
  if (!q) return;
  let ok = false;
  if (q.kind === 'gap') ok = state.spellGapAt >= q.gaps.length;
  else ok = state.spellBuf.join('').toLowerCase() === q.en.toLowerCase();

  if (ok) {
    state.spellBad = false;
    state.spellMsg = '对啦！';
    sfx('right');
    award('spell_' + q.wi);
    speak(q.en);
    render();
    setTimeout(() => {
      state.spellI++;
      if (state.spellI >= state.spellQs.length) {
        state.spellQs = []; state.spellI = 0;
        showSpellFinish();
      } else { spResetBuf(); render(); }
    }, 950);
  } else {
    state.spellBad = true;
    state.spellMsg = '还差一点点，再看一眼';
    sfx('wrong');
    render();
    setTimeout(() => { state.spellBad = false; render(); }, 700);
  }
}

// 提示：揭示下一个正确的字母（不限次数，不给压力）
function spHint() {
  const q = state.spellQs[state.spellI];
  if (!q) return;
  const L = q.en.split('');

  if (q.kind === 'gap') {
    const pos = q.gaps[state.spellGapAt];
    if (pos == null) return;
    state.spellBuf[pos] = L[pos];
    state.spellGapAt++;
    state.spellMsg = '这一个字母是 ' + L[pos];
    sfx('tap');
    render();
    if (state.spellGapAt >= q.gaps.length) setTimeout(spCheck, 300);
    return;
  }

  const lock = (q.kind === 'tile' && levelOf() !== 'hard') ? 1 : 0;
  for (let i = lock; i < L.length; i++) {
    if ((state.spellBuf[i] || '').toLowerCase() !== L[i].toLowerCase()) {
      state.spellBuf[i] = L[i];
      state.spellMsg = '第 ' + (i + 1) + ' 个字母是 ' + L[i];
      sfx('tap');
      render();
      if (spFull()) setTimeout(spCheck, 300);
      return;
    }
  }
}

function showSpellFinish() {
  sfx('win');
  confetti();
  if (state.finalePending) { state.finalePending = false; return finaleShow(); }
  if (state.chapterJustDone === 'spell') { state.chapterJustDone = null; return chapterClear('spell'); }
  showOverlay(`<div class="overlay-emoji">✍️</div>
    <h3 class="overlay-title">这一轮都拼完啦！</h3>
    <p class="overlay-text">单词和代词都写了一遍，真棒</p>
    <button class="big-btn green" data-act="ov-restart-spell">再来一轮 →</button>`);
}

function buildListenQs() {
  const hard = levelOf() === 'hard';
  const qs = [];

  data.words.forEach((w, wi) => {
    qs.push({ kind: 'word', target: w.en, opts: hard ? optsAround(w.en, 4) : easyOpts(w.en), zh: w.zh, wi });
  });

  data.sentences.forEach((s, si) => {
    if (hard) {
      // 进阶：四句英文里选听到的那句，干扰句只差一两个词
      let pool = shuffle(data.sentences.filter((o, i) => i !== si && o.en).map(o => o.en)).slice(0, 3);
      if (pool.length < 3) pool = pool.concat(sentVariants(s, 3 - pool.length));
      pool = Array.from(new Set(pool.filter(x => x.toLowerCase() !== s.en.toLowerCase())));
      if (pool.length < 3) return;
      qs.push({ kind: 'sent', target: s.en, opts: shuffle([s.en].concat(pool.slice(0, 3))), si });
    } else {
      const pool = data.sentences.filter((_, i) => i !== si).map(o => o.zh).filter(Boolean);
      if (pool.length < 3) return;
      qs.push({ kind: 'sent', target: s.en, opts: shuffle([s.zh].concat(shuffle(pool).slice(0, 3))), si, byZh: true });
    }
  });

  return qs;
}

function viewListen() {
  if (!data.words.length && !data.sentences.length) return emptyView('👂', '还没有内容', '去「设置」里添加句型和单词');
  if (!state.listenQs.length) state.listenQs = shuffle(buildListenQs());

  html += `<h2 class="page-title">👂 听，城堡里传来什么？</h2>`;
  html += `<p class="page-hint">第 ${state.listenI + 1} / ${state.listenQs.length} 题</p>`;
  html += `<div class="listen-hero">
      <button class="play-btn" data-act="ls-play">🔊</button>
      <div class="listen-hint">再点一次可以再听一遍</div>
      <div class="listen-zh-hint" id="lsReveal"></div>
    </div>`;
  html += '<div class="opt-grid" id="lsGrid">';
  q.opts.forEach(o => {
    const ico = q.kind === 'word' ? emoOf(o) : '';
    const cls = (q.kind === 'sent' && !q.byZh) ? ' sent' : '';
    html += `<button class="opt-card${cls}" data-act="ls-pick" data-w="${esc(o)}">

      <span class="en">${esc(o)}</span>

  html += '</div></div>';

}

function listenPlay() {

}

function listenPick(btn) {

function showListenFinish() {

    <h3 class="overlay-title">耳朵真灵！</h3>
    <p class="overlay-text">这一轮听力都听出来了</p>

}

// 把本周句型编成「爱莎 ⇄ 女儿」的剧本：问句给爱莎，答句/陈述句给女儿
function scriptLines() {
  const lines = data.sentences.map(s => ({
    who: /\?\s*$/.test(s.en) ? 'elsa' : 'kid',
    en: s.en, zh: s.zh
  }));
  const allKid = lines.every(l => l.who === 'kid');
  const allElsa = lines.every(l => l.who === 'elsa');
  if (allKid || allElsa) lines.forEach((l, i) => { l.who = i % 2 ? 'elsa' : 'kid'; });
  return lines;
}

function viewTalk() {

  const list = scriptLines();          // 行数与 data.sentences 一一对应
  if (state.talkI >= list.length) return talkFinishView();

  let html = '<div class="view-inner">';
  html += chapterBanner('talk');
  html += `<h2 class="page-title">${ROLES.elsa.name} 和 ${kidName()} 聊天</h2>`;
  html += `<p class="page-hint">爱莎说一句，你接一句 —— 一句一句往下聊</p>`;

  // 两个人的头像：爱莎 / 女儿（可换成孩子自己的照片）
  html += `<div class="duo">
    <div class="duo-who elsa">
      ${avatarSVG('elsa')}
      <div class="duo-nm">${ROLES.elsa.name}<span>冰雪女王</span></div>
    </div>
    <div class="duo-vs">💬</div>
    <div class="duo-who kid">
      ${avatarSVG('kid')}
      <div class="duo-nm">${kidName()}<span>就是你</span></div>
      <button class="mini-btn" data-act="tk-avatar">📷 换我的头像</button>
    </div>
  </div>`;

  // 对话流：说过的留着当聊天记录，还没轮到的先藏起来
  html += `<div class="chat">`;
  list.forEach((l, i) => {
    const isKid = l.who === 'kid';
    const who = isKid ? 'kid' : 'elsa';
    if (i > state.talkI) {
      html += `<div class="msg ${who} future">
        ${avatarSVG(who)}
        <div class="bubble">◦ ◦ ◦</div>
      </div>`;
      return;
    }
    const now = i === state.talkI;
    html += `<div class="msg ${who} ${now ? 'now' : 'past'}" ${now ? 'id="msgNow"' : `data-act="tk-jump" data-i="${i}"`}>
      ${avatarSVG(who)}
      <div class="bubble">
        <div class="en">${esc(l.en)}</div>
        ${now && l.zh ? `<div class="zh">${esc(l.zh)}</div>` : ''}
        ${now ? `<div class="tip">${isKid ? '🎤 轮到你说了' : '🔊 听爱莎说'}</div>` : '<div class="tip replay">🔁 点一下再听</div>'}
      </div>
    </div>`;
  });
  html += `</div>`;

  html += `<div id="heard" class="heard-text hidden"></div>`;

  html += `<div class="talk-nav" style="justify-content:center;display:flex;gap:12px;flex-wrap:wrap">
      <button class="big-btn blue" data-act="tk-play">🔊 ${mine ? '听一遍' : '听爱莎说'}</button>
      ${mine ? `<button class="big-btn pink" data-act="tk-mic">🎤 我来说</button>` : ''}
      <button class="big-btn green" data-act="tk-done">${mine ? '✅ 我说好了 →' : '➡️ 下一句'}</button>
      <button class="big-btn ghost" data-act="tk-prev">← 上一句</button>
    </div>`;

  html += `<div class="progress-dots">`;
  list.forEach((_, i) => {
    const cls = i < state.talkI ? 'done' : (i === state.talkI ? 'on' : '');
    html += `<div class="dot ${cls}"></div>`;
  });
  html += `</div>`;
  html += `</div>`;
  return html;
}

/* 换女儿头像：从相册/相机选一张，压缩后存在本机（不上传任何服务器） */
function pickAvatar() {
  const inp = document.createElement('input');
  inp.type = 'file';
  inp.accept = 'image/*';
  inp.onchange = () => {
    const f = inp.files && inp.files[0];
    if (!f) return;
    const fr = new FileReader();
    fr.onload = () => {
      const img = new Image();
      img.onload = () => {
        try {
          const size = 320;
          const c = document.createElement('canvas');
          c.width = size; c.height = size;
          const g = c.getContext('2d');
          // 居中裁成正方形
          const s = Math.min(img.width, img.height);
          const sx = (img.width - s) / 2, sy = (img.height - s) / 2;
          g.drawImage(img, sx, sy, s, s, 0, 0, size, size);
          const url = c.toDataURL('image/jpeg', 0.72);
          if (!data.settings.avatar) data.settings.avatar = {};
          data.settings.avatar[state.kid] = url;
          saveData();
          sfx('right');
          render();
          showOverlay(`<div class="overlay-emoji">📷</div>
            <h3 class="overlay-title">头像换好啦</h3>
            <p class="overlay-text">${kidName()} 现在用自己的头像和爱莎聊天了<br><span style="font-size:14px;color:#8aa8c4">照片只存在这台设备上，不会上传</span></p>
            <button class="big-btn green" data-act="ov-close">开始聊天 →</button>`);
        } catch (e) {
          showOverlay(`<div class="overlay-emoji">🙈</div><h3 class="overlay-title">这张图用不了</h3><p class="overlay-text">换一张试试</p><button class="big-btn" data-act="ov-close">知道了</button>`);
        }
      };
      img.onerror = () => { sfx('wrong'); };
      img.src = fr.result;
    };
    fr.readAsDataURL(f);
  };
  inp.click();
}

/* 语音识别（可选，不支持会自动退回跟读） */
let recogObj = null;

function startRecog(cb) {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { cb(null, 'unsupported'); return; }
  try {
    const r = new SR();
    r.lang = 'en-US';
    r.interimResults = false;
    r.maxAlternatives = 3;
    let got = false;
    r.onresult = e => {
      got = true;
      const res = e.results[0];
      let best = '';
      for (let i = 0; i < res.length; i++) best = best || res[i].transcript;
      cb(best, null);
    };
    r.onerror = e => { if (!got) cb(null, e.error || 'error'); };
    r.onend = () => { if (!got) cb(null, 'noresult'); };
    r.start();
    recogObj = r;
  } catch (e) { cb(null, 'error'); }
}

function talkMic() {
  const s = data.sentences[state.talkI];
  const heard = $('#heard');
  if (!heard) return;

  if (!data.settings.recog) {
    // 跟读模式：点击 = 朗读 + 提示孩子跟着读
    speak(s.en, { rate: 0.75 });
    heard.classList.remove('hidden', 'bad');
    heard.textContent = '🔊 跟着读一遍吧';
    return;
  }

  if (state.recording) {
    try { recogObj && recogObj.stop(); } catch (e) {}
    state.recording = false;
    render();
    return;
  }

  state.recording = true;
  render();
  const btn = document.querySelector('.mic-btn');
  btn && btn.classList.add('recording');
  heard.classList.remove('hidden', 'bad');
  heard.textContent = '🎙️ 在听你说…';

  startRecog((text, err) => {
    state.recording = false;
    const el = $('#heard');
    if (!el) return;
    if (text) {
      const norm = t => String(t).toLowerCase().replace(/[^a-z\s]/g, ' ').trim();
      const want = norm(s.en).split(/\s+/).filter(Boolean);
      const got = norm(text).split(/\s+/).filter(Boolean);
      let hit = 0;
      want.forEach(w => { if (got.indexOf(w) >= 0) hit++; });
      const score = hit / Math.max(want.length, 1);
      el.classList.remove('hidden');
      if (score >= 0.6) {
        el.classList.remove('bad');
        el.textContent = `👂 听到啦：${text}`;
        sfx('right');
        award('talk_' + state.talkI);
      } else {
        el.classList.add('bad');
        el.textContent = `👂 听到：${text}（再试一次）`;
      }
    } else {
      el.classList.add('bad');
      const msg = err === 'not-allowed' ? '没拿到麦克风权限，去设置里打开' :
        err === 'no-speech' ? '没听到声音，靠近一点再说' :
        err === 'unsupported' ? '这台设备不能用听写，已切回跟读模式' : '没听清，再试一次';
      el.textContent = `🙈 ${msg}`;
      if (err === 'unsupported') data.settings.recog = false;
    }
  });
}

function talkDone() {
  const s = data.sentences[state.talkI];
  if (state.recording) {
    try { recogObj && recogObj.stop(); } catch (e) {}
    state.recording = false;
  }
  if (!data.settings.recog) {
    award('talk_' + state.talkI);   // 跟读模式：读完即记
  }
  speak(s.en, { rate: 0.8 });
  sfx('tap');
  state.talkI++;
  if (state.talkI >= data.sentences.length) {
    sfx('win');
    confetti();
    state.talkI = 0;
    if (state.finalePending) { state.finalePending = false; finaleShow(); }
    else if (state.chapterJustDone === 'talk') { state.chapterJustDone = null; chapterClear('talk'); }
    else showOverlay(`<div class="overlay-emoji">🎤</div>
      <h3 class="overlay-title">全部读完啦！</h3>
      <p class="overlay-text">今天又说了 ${data.sentences.length} 句英语</p>
      <button class="big-btn green" data-act="tk-restart">再来一轮 →</button>`);
    render();
    return;
  }
  render();
}

/* =========================================================
   渲染与事件
   ========================================================= */
function render() {
  const v = $('#view');
  const map = { puzzle: viewPuzzle, spell: viewSpell, fill: viewFill, listen: viewListen, talk: viewTalk, setup: viewSetup };
  v.innerHTML = (map[state.view] || viewPuzzle)();
  v.scrollTop = 0;
  paintTop();
  if (state.view === 'talk') {
    const now = document.getElementById('msgNow');
    if (now && now.scrollIntoView) { try { now.scrollIntoView({ block: 'center' }); } catch (e) {} }
  }
  if (state.view === 'puzzle' && state.puzzleIdx !== null) initPuzzle();
}

function switchView(name) {
  shutUp();
  state.view = name;
  if (name === 'fill') { state.fillQs = []; state.fillI = 0; }
  if (name === 'listen') { state.listenQs = []; state.listenI = 0; }
  if (name === 'spell') { state.spellQs = []; state.spellI = 0; spResetBuf(); }
  if (name === 'talk') { state.talkI = 0; }
  if (name !== 'puzzle') state.puzzleIdx = null;
  render();
}

document.addEventListener('DOMContentLoaded', () => {
  // 底部导航
  $('#tabbar').addEventListener('click', e => {
    const t = e.target.closest('.tab');
    if (!t) return;
    sfx('tap');
    switchView(t.dataset.view);
  });

  // 孩子切换
  $('#kidSwitch').addEventListener('click', e => {
    const b = e.target.closest('.kid-btn');
    if (!b) return;
    state.kid = b.dataset.kid;
    // 两个孩子的难度可能不同，换人就把本轮题目重置（同样只在拼图页重画）
    state.fillQs = []; state.fillI = 0;
    state.listenQs = []; state.listenI = 0;
    state.spellQs = []; state.spellI = 0; spResetBuf();
    if (state.puzzleIdx !== null && state.view === 'puzzle') initPuzzle();
    sfx('tap');
    render();
  });

  // 顶部「录入」按钮
  $('#editBtn').addEventListener('click', () => {
    sfx('tap');
    switchView('setup');
  });

  // 主视图事件
  $('#view').addEventListener('click', e => {
    const el = e.target.closest('[data-act]');
    if (!el) return;
    const act = el.dataset.act;

    if (act === 'go-setup') { switchView('setup'); return; }
    if (act === 'go-view') {
      const v = el.dataset.v;
      if (STORY_ORDER.includes(v)) {
        state.view = v;
        if (v !== 'puzzle') state.puzzleIdx = null;
        hideOverlay();
        sfx('tap');
        render();
      }
      return;
    }

    // 拼句子
    if (act === 'pz-open') { state.puzzleIdx = +el.dataset.i; sfx('tap'); render(); return; }
    if (act === 'pz-slot') { pzPlace(+el.dataset.p); return; }
    if (act === 'pz-unslot') { pzUnslot(+el.dataset.i); return; }
    if (act === 'pz-hint') { pzHint(); return; }
    if (act === 'pz-speak') { speak(data.sentences[state.puzzleIdx].en, { rate: 0.8 }); return; }
    if (act === 'pz-reset') { initPuzzle(); return; }
    if (act === 'pz-back') { state.puzzleIdx = null; sfx('tap'); render(); return; }

    // 拼写
    if (act === 'sp-tile') {
      const q = state.spellQs[state.spellI];
      const p = +el.dataset.p;
      const empty = state.spellBuf.findIndex(c => !c);
      if (empty >= 0) {
        state.spellBuf[empty] = q.pieces[p].ch;
        sfx('tap');
        render();
        if (spFull()) setTimeout(spCheck, 260);
      }
      return;
    }
    if (act === 'sp-unslot') {
      const i = +el.dataset.i;
      state.spellBuf[i] = '';
      sfx('tap');
      render();
      return;
    }
    if (act === 'sp-gap') {
      const q = state.spellQs[state.spellI];
      const pos = q.gaps[state.spellGapAt];
      if (pos == null) return;
      if (el.dataset.c.toLowerCase() === q.en[pos].toLowerCase()) {
        state.spellBuf[pos] = q.en[pos];
        state.spellGapAt++;
        state.spellMsg = '';
        sfx('right');
        render();
        if (state.spellGapAt >= q.gaps.length) setTimeout(spCheck, 300);
      } else {
        state.spellBad = true;
        state.spellMsg = '这个字母不对，再想想';
        sfx('wrong');
        render();
        setTimeout(() => { state.spellBad = false; render(); }, 700);
      }
      return;
    }
    if (act === 'sp-key') {
      const q = state.spellQs[state.spellI];
      if (state.spellBuf.length < q.en.length) {
        state.spellBuf.push(el.dataset.c);
        sfx('tap');
        render();
        if (spFull()) setTimeout(spCheck, 260);
      }
      return;
    }
    if (act === 'sp-back') {
      state.spellBuf.pop();
      sfx('tap');
      render();
      return;
    }
    if (act === 'sp-hint') { spHint(); return; }
    if (act === 'sp-speak') { speak(state.spellQs[state.spellI].en); return; }
    if (act === 'sp-reset') { spResetBuf(); sfx('tap'); render(); return; }
    if (act === 'sp-skip') {
      const q = state.spellQs.splice(state.spellI, 1)[0];
      state.spellQs.push(q);
      spResetBuf();
      sfx('tap');
      render();
      return;
    }

    // 填空
    if (act === 'fill-pick') { fillPick(el); return; }

    // 听音
    if (act === 'ls-play') { listenPlay(); return; }
    if (act === 'ls-pick') { listenPick(el); return; }

    // 对话
    if (act === 'tk-role') {
      data.settings.role = el.dataset.r;
      saveData();
      state.talkI = 0;
      sfx('tap');
      render();
      return;
    }
    if (act === 'tk-avatar') { pickAvatar(); return; }
    if (act === 'tk-jump') {
      const i = +el.dataset.i;
      if (!isNaN(i) && i < data.sentences.length) {
        state.talkI = i;
        sfx('tap');
        render();
        speak(data.sentences[i].en, { rate: 0.75 });
      }
      return;
    }
    if (act === 'tk-mic') { talkMic(); return; }
    if (act === 'tk-play') { speak(data.sentences[state.talkI].en, { rate: 0.75 }); return; }
    if (act === 'tk-done') { talkDone(); return; }
    if (act === 'tk-prev') { state.talkI = Math.max(0, state.talkI - 1); sfx('tap'); render(); return; }
    if (act === 'tk-restart') { state.talkI = 0; hideOverlay(); sfx('tap'); render(); return; }

    // 设置
    if (act === 'su-save') { saveSetup(); return; }
    if (act === 'su-level') { setLevel(el.dataset.v); sfx('tap'); render(); return; }
    if (act === 'su-demo') { demoData(); sfx('right'); showOverlay(`<div class="overlay-emoji">🎁</div><h3 class="overlay-title">示例已填入</h3><p class="overlay-text">先拿示例玩一遍，熟了再换成孩子真正的课本内容</p><button class="big-btn" data-act="ov-close">知道了</button>`); return; }
    if (act === 'su-week1') {
      const w1 = week1Data();
      data.week = w1.week; data.sentences = w1.sentences; data.words = w1.words; data.isDemo = false;
      state.puzzleIdx = null; state.fillQs = []; state.fillI = 0; state.listenQs = []; state.listenI = 0; state.talkI = 0;
      saveData(); sfx('right'); render();
      showOverlay(`<div class="overlay-emoji">📘</div><h3 class="overlay-title">已换成第 1 周内容</h3>
        <p class="overlay-text">9 个句型 · 12 个单词（来自课堂笔记 PDF）<br>以后每周发我 PDF，我整理好给你新的</p>
        <button class="big-btn" data-act="ov-close">开始玩 →</button>`);
      return;
    }
    if (act === 'su-clear') {
      data.sentences = []; data.words = [];
      state.puzzleIdx = null; state.fillQs = []; state.fillI = 0; state.listenQs = []; state.listenI = 0; state.talkI = 0;
      saveData(); sfx('tap'); render();
      return;
    }
    if (act === 'su-delword') { data.words.splice(+el.dataset.i, 1); saveData(); render(); return; }
    if (act === 'su-recog') {
      data.settings.recog = !data.settings.recog;
      saveData();
      render();
      if (data.settings.recog) speak('Hello, I can hear you.', { rate: 0.85 });
      return;
    }
    if (act === 'su-rate') { data.settings.rate = +el.dataset.v; saveData(); render(); speak('Hello!', { rate: +el.dataset.v }); return; }
    if (act === 'su-test') { speak('Hello! This is my mother. I like apples.', { rate: data.settings.rate }); return; }
    if (act === 'su-export') { exportData(); return; }
    if (act === 'su-import') { importData(); return; }
    if (act === 'su-resetstars') {
      ['juicy', 'geimi'].forEach(k => prog[k] = { awarded: {} });
      saveProg(); sfx('tap'); paintTop();
      showOverlay(`<div class="overlay-emoji">🔄</div><h3 class="overlay-title">星星已清空</h3><p class="overlay-text">换新一周内容时清一次就行</p><button class="big-btn" data-act="ov-close">好的</button>`);
      return;
    }
  });

  // 弹层事件
  $('#overlay').addEventListener('click', e => {
    const el = e.target.closest('[data-act]');
    if (e.target.id === 'overlay') { hideOverlay(); return; }
    if (!el) return;
    const act = el.dataset.act;
    hideOverlay();
    if (act === 'ov-closepuzzle') { render(); }
    if (act === 'pz-next') { goPuzzle(+el.dataset.i); return; }
    if (act === 'ov-again') { switchView(el.dataset.v); return; }
    if (act === 'ov-restart-spell') { state.spellQs = []; state.spellI = 0; spResetBuf(); render(); }
    if (act === 'ov-restart-fill') { state.fillQs = []; state.fillI = 0; render(); }
    if (act === 'ov-restart-listen') { state.listenQs = []; state.listenI = 0; render(); }
  });

  snowfall();
  render();
});

/* ---------- 保存设置 ---------- */
function saveSetup() {
  const week = ($('#inpWeek').value || '').trim() || '本周';
  const sentLines = ($('#inpSent').value || '').split('\n').map(s => s.trim()).filter(Boolean);
  const wordLines = ($('#inpWord').value || '').split('\n').map(s => s.trim()).filter(Boolean);

  data.week = week;
  data.sentences = sentLines.map(splitSent).filter(x => x && x.en);
  data.words = wordLines.map(splitWord).filter(x => x && x.en);
  data.isDemo = false;

  state.puzzleIdx = null;
  state.fillQs = []; state.fillI = 0;
  state.listenQs = []; state.listenI = 0;
  state.talkI = 0;

  saveData();
  sfx('right');
  render();
  showOverlay(`<div class="overlay-emoji">✅</div>
    <h3 class="overlay-title">已保存</h3>
    <p class="overlay-text">${data.sentences.length} 个句型 · ${data.words.length} 个单词<br>可以去玩了</p>
    <button class="big-btn green" data-act="ov-close">开始玩 →</button>`);
}

/* ---------- 导入导出 ---------- */
function exportData() {
  const name = `${data.week || '本周'}-英语内容.json`;
  const blob = new Blob([JSON.stringify({ week: data.week, sentences: data.sentences, words: data.words }, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = name;
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 500);
  showOverlay(`<div class="overlay-emoji">📤</div><h3 class="overlay-title">已导出</h3><p class="overlay-text">文件名：${esc(name)}<br>存在「文件」App 里，下周可以导回来</p><button class="big-btn" data-act="ov-close">好的</button>`);
}

function importData() {
  const inp = document.createElement('input');
  inp.type = 'file';
  inp.accept = '.json,application/json';
  inp.onchange = () => {
    const f = inp.files && inp.files[0];
    if (!f) return;
    const fr = new FileReader();
    fr.onload = () => {
      try {
        const d = JSON.parse(fr.result);
        if (!d || !Array.isArray(d.sentences) || !Array.isArray(d.words)) throw new Error('格式不对');
        data.week = d.week || '本周';
        data.sentences = d.sentences;
        data.words = d.words;
        data.isDemo = false;
        state.puzzleIdx = null;
        state.fillQs = []; state.fillI = 0;
        state.listenQs = []; state.listenI = 0;
        state.talkI = 0;
        saveData();
        sfx('right');
        render();
        showOverlay(`<div class="overlay-emoji">📥</div><h3 class="overlay-title">导入成功</h3><p class="overlay-text">${esc(data.week)}：${data.sentences.length} 句型 · ${data.words.length} 单词</p><button class="big-btn green" data-act="ov-close">开始玩 →</button>`);
      } catch (err) {
        showOverlay(`<div class="overlay-emoji">🙈</div><h3 class="overlay-title">导入失败</h3><p class="overlay-text">这个文件读不出来，确认是本游戏导出的 JSON</p><button class="big-btn" data-act="ov-close">知道了</button>`);
      }
    };
    fr.readAsText(f);
  };
  inp.click();
}

/* ---------- 首次进入：没有内容就先给示例，方便上手 ---------- */
(function firstRun() {
  if (!data.sentences.length && !data.words.length) {
    demoData();
  }
})();

</script>
