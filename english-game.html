/* =========================================================
   渲染与事件
   ========================================================= */
function render() {
  document.body.dataset.view = state.view; // 每章换场景配色
  const v = $('#view');
  const map = { quest: viewQuest, puzzle: viewPuzzle, spell: viewSpell, fill: viewFill, listen: viewListen, talk: viewTalk, setup: viewSetup };
  v.innerHTML = (map[state.view] || viewPuzzle)();
  v.scrollTop = 0;
  paintTop();
  if (state.view === 'spell') {
    // 拼写页内容高（键盘/卡片/按钮），自动滚到底保证底部按钮看得见
    const bar = document.querySelector('.sp-bar');
    if (bar && bar.scrollIntoView) setTimeout(() => { try { bar.scrollIntoView({ block: 'nearest' }); } catch (e) {} }, 30);
  }
  if (state.view === 'talk') {
    const now = document.getElementById('msgNow');
    if (now && now.scrollIntoView) { try { now.scrollIntoView({ block: 'center' }); } catch (e) {} }
  }
  if (state.view === 'puzzle' && state.puzzleIdx !== null) initPuzzle();
  if (state.view === 'quest' && state.quest.screen === 'play') {
    const qs = qEnsureQs();
    const mode = Q_MODES[state.quest.mode % Q_MODES.length];
    if (qs.length && mode.k === 'listen') {
      const w = qLevelWords(state.quest.region, state.quest.level)[qs[0].i];
      speak(w.ph || w.en, { rate: 0.8 });
    }
  }
}

function switchView(name) {
  shutUp();
  state.view = name;
  if (name === 'fill') { state.fillQs = []; state.fillI = 0; }
  if (name === 'listen') { state.listenQs = []; state.listenI = 0; }
  if (name === 'spell') { state.spellQs = []; state.spellI = 0; spResetBuf(); }
  if (name === 'talk') { state.talkI = 0; }
  if (name === 'quest') {
    // 点「探险」tab 直接进到该玩的那一关（地图可从关卡页「🗺️ 地图」打开）
    const nx = qNextLevel(state.quest.region, state.quest.level);
    if (nx) { state.quest.region = nx.r; state.quest.level = nx.l; state.quest.qs = null; }
    state.quest.screen = nx ? 'play' : 'map';
  }
  if (name === 'puzzle') {
    // 点「拼句子」tab 直接进到没拼过的句子，不再先停在列表/地图页
    if (state.puzzleIdx === null) {
      const nx = nextPuzzleIdx(-1);
      state.puzzleIdx = nx === null ? 0 : nx; // 全拼完就回第一句复习
    }
  } else {
    state.puzzleIdx = null;
  }
  render();
}

document.addEventListener('DOMContentLoaded', () => {
  // 底部导航
  $('#tabbar').addEventListener('click', e => {
    const t = e.target.closest('.tab');
    if (!t) return;
    sfx('tap');
    switchView(t.dataset.view);
  });

  // 孩子切换
  $('#kidSwitch').addEventListener('click', e => {
    const b = e.target.closest('.kid-btn');
    if (!b) return;
    state.kid = b.dataset.kid;
    // 两个孩子的难度可能不同，换人就把本轮题目重置（同样只在拼图页重画）
    state.fillQs = []; state.fillI = 0;
    state.listenQs = []; state.listenI = 0;
    state.spellQs = []; state.spellI = 0; spResetBuf();
    if (state.puzzleIdx !== null && state.view === 'puzzle') initPuzzle();
    sfx('tap');
    render();
  });

  // 顶部「录入」按钮
  $('#editBtn').addEventListener('click', () => {
    sfx('tap');
    switchView('setup');
  });

  // 主视图事件
  $('#view').addEventListener('click', e => {
    const el = e.target.closest('[data-act]');
    if (!el) return;
    const act = el.dataset.act;

    if (act === 'go-setup') { switchView('setup'); return; }
    if (act === 'map-toggle') { state.mapOpen = !state.mapOpen; sfx('tap'); render(); return; }
    if (act === 'go-view') {
      const v = el.dataset.v;
      if (STORY_ORDER.includes(v)) {
        state.view = v;
        if (v !== 'puzzle') state.puzzleIdx = null;
        hideOverlay();
        sfx('tap');
        render();
      }
      return;
    }

    // 拼句子
    if (act === 'pz-open') { state.puzzleIdx = +el.dataset.i; sfx('tap'); render(); return; }
    if (act === 'pz-jump') { goPuzzle(+el.dataset.i); return; }

    // 220 词探险
    if (act === 'q-level') { qGo(+el.dataset.r, +el.dataset.l); return; }
    if (act === 'q-map') { state.quest.screen = 'map'; sfx('tap'); render(); return; }
    if (act === 'q-ans') { qAnswer(el.dataset.v); return; }
    if (act === 'q-hint') { qHint(); return; }
    if (act === 'q-skip') { qSkip(); return; }
    if (act === 'q-say') {
      const q0 = qEnsureQs()[0];
      const w0 = qLevelWords(state.quest.region, state.quest.level)[q0.i];
      speak(w0.ph || w0.en, { rate: 0.8 });
      return;
    }
    if (act === 'q-next') {
      hideOverlay();
      const nx = qNextLevel(state.quest.region, state.quest.level);
      if (nx) qGo(nx.r, nx.l);
      else { state.quest.screen = 'map'; render(); }
      return;
    }
    if (act === 'pz-slot') { pzPlace(+el.dataset.p); return; }
    if (act === 'pz-unslot') { pzUnslot(+el.dataset.i); return; }
    if (act === 'pz-hint') { pzHint(); return; }
    if (act === 'pz-speak') { speak(data.sentences[state.puzzleIdx].en, { rate: 0.8 }); return; }
    if (act === 'pz-reset') { initPuzzle(); return; }
    if (act === 'pz-back') { state.puzzleIdx = null; sfx('tap'); render(); return; }

    // 拼写
    if (act === 'sp-tile') {
      const q = state.spellQs[state.spellI];
      const p = +el.dataset.p;
      const empty = state.spellBuf.findIndex(c => !c);
      if (empty >= 0) {
        state.spellBuf[empty] = q.pieces[p].ch;
        sfx('tap');
        render();
        if (spFull()) setTimeout(spCheck, 260);
      }
      return;
    }
    if (act === 'sp-unslot') {
      const i = +el.dataset.i;
      state.spellBuf[i] = '';
      sfx('tap');
      render();
      return;
    }
    if (act === 'sp-gap') {
      const q = state.spellQs[state.spellI];
      const pos = q.gaps[state.spellGapAt];
      if (pos == null) return;
      if (el.dataset.c.toLowerCase() === q.en[pos].toLowerCase()) {
        state.spellBuf[pos] = q.en[pos];
        state.spellGapAt++;
        state.spellMsg = '';
        sfx('right');
        render();
        if (state.spellGapAt >= q.gaps.length) setTimeout(spCheck, 300);
      } else {
        state.spellBad = true;
        state.spellMsg = '这个字母不对，再想想';
        sfx('wrong');
        render();
        setTimeout(() => { state.spellBad = false; render(); }, 700);
      }
      return;
    }
    if (act === 'sp-key') {
      const q = state.spellQs[state.spellI];
      if (state.spellBuf.length < q.en.length) {
        state.spellBuf.push(el.dataset.c);
        sfx('tap');
        render();
        if (spFull()) setTimeout(spCheck, 260);
      }
      return;
    }
    if (act === 'sp-back') {
      state.spellBuf.pop();
      sfx('tap');
      render();
      return;
    }
    if (act === 'sp-hint') { spHint(); return; }
    if (act === 'sp-speak') { speak(state.spellQs[state.spellI].en); return; }
    if (act === 'sp-reset') { spResetBuf(); sfx('tap'); render(); return; }
    if (act === 'sp-skip') {
      const q = state.spellQs.splice(state.spellI, 1)[0];
      state.spellQs.push(q);
      spResetBuf();
      sfx('tap');
      render();
      return;
    }

    // 填空
    if (act === 'fill-pick') { fillPick(el); return; }

    // 听音
    if (act === 'ls-play') { listenPlay(); return; }
    if (act === 'ls-pick') { listenPick(el); return; }

    // 对话
    if (act === 'tk-role') {
      data.settings.role = el.dataset.r;
      saveData();
      state.talkI = 0;
      sfx('tap');
      render();
      return;
    }
    if (act === 'tk-avatar') { pickAvatar(); return; }
    if (act === 'tk-jump') {
      const i = +el.dataset.i;
      if (!isNaN(i) && i < data.sentences.length) {
        stopTalkRec();
        state.talkI = i;
        sfx('tap');
        render();
        speak(data.sentences[i].en, { rate: 0.75 });
      }
      return;
    }
    if (act === 'tk-mic') { talkMic(); return; }
    if (act === 'tk-hear') { if (talkRecUrl) { const au = new Audio(talkRecUrl); au.play().catch(() => {}); } return; }
    if (act === 'tk-play') { speak(data.sentences[state.talkI].en, { rate: 0.75 }); return; }
    if (act === 'tk-done') { talkDone(); return; }
    if (act === 'tk-prev') { stopTalkRec(); state.talkI = Math.max(0, state.talkI - 1); sfx('tap'); render(); return; }
    if (act === 'tk-restart') { stopTalkRec(); state.talkI = 0; hideOverlay(); sfx('tap'); render(); return; }

    // 设置
    if (act === 'su-save') { saveSetup(); return; }
    if (act === 'su-level') { setLevel(el.dataset.v); sfx('tap'); render(); return; }
    if (act === 'su-demo') { demoData(); sfx('right'); showOverlay(`<div class="overlay-emoji">🎁</div><h3 class="overlay-title">示例已填入</h3><p class="overlay-text">先拿示例玩一遍，熟了再换成孩子真正的课本内容</p><button class="big-btn" data-act="ov-close">知道了</button>`); return; }
    if (act === 'su-week1') {
      const w1 = week1Data();
      data.week = w1.week; data.sentences = w1.sentences; data.words = w1.words; data.isDemo = false;
      state.puzzleIdx = null; state.fillQs = []; state.fillI = 0; state.listenQs = []; state.listenI = 0; state.talkI = 0;
      saveData(); sfx('right'); render();
      showOverlay(`<div class="overlay-emoji">📘</div><h3 class="overlay-title">已换成第 1 周内容</h3>
        <p class="overlay-text">9 个句型 · 12 个单词（来自课堂笔记 PDF）<br>以后每周发我 PDF，我整理好给你新的</p>
        <button class="big-btn" data-act="ov-close">开始玩 →</button>`);
      return;
    }
    if (act === 'su-clear') {
      data.sentences = []; data.words = [];
      state.puzzleIdx = null; state.fillQs = []; state.fillI = 0; state.listenQs = []; state.listenI = 0; state.talkI = 0;
      saveData(); sfx('tap'); render();
      return;
    }
    if (act === 'su-delword') { data.words.splice(+el.dataset.i, 1); saveData(); render(); return; }
    if (act === 'su-recog') {
      data.settings.recog = !data.settings.recog;
      saveData();
      render();
      if (data.settings.recog) speak('Hello, I can hear you.', { rate: 0.85 });
      return;
    }
    if (act === 'su-rate') { data.settings.rate = +el.dataset.v; saveData(); render(); speak('Hello!', { rate: +el.dataset.v }); return; }
    if (act === 'su-test') { speak('Hello! This is my mother. I like apples.', { rate: data.settings.rate }); return; }
    if (act === 'su-export') { exportData(); return; }
    if (act === 'su-import') { importData(); return; }
    if (act === 'su-resetstars') {
      ['juicy', 'geimi'].forEach(k => prog[k] = { awarded: {} });
      saveProg(); sfx('tap'); paintTop();
      showOverlay(`<div class="overlay-emoji">🔄</div><h3 class="overlay-title">星星已清空</h3><p class="overlay-text">换新一周内容时清一次就行</p><button class="big-btn" data-act="ov-close">好的</button>`);
      return;
    }
  });

  // 弹层事件
  $('#overlay').addEventListener('click', e => {
    const el = e.target.closest('[data-act]');
    if (e.target.id === 'overlay') { hideOverlay(); return; }
    if (!el) return;
    const act = el.dataset.act;
    hideOverlay();
    if (act === 'ov-closepuzzle') { render(); }
    if (act === 'pz-next') { goPuzzle(+el.dataset.i); return; }
    if (act === 'ov-again') { switchView(el.dataset.v); return; }
    if (act === 'ov-restart-spell') { state.spellQs = []; state.spellI = 0; spResetBuf(); render(); }
    if (act === 'ov-restart-fill') { state.fillQs = []; state.fillI = 0; render(); }
    if (act === 'ov-restart-listen') { state.listenQs = []; state.listenI = 0; render(); }
  });

  snowfall();
  render();
});

/* ---------- 保存设置 ---------- */
function saveSetup() {
  const week = ($('#inpWeek').value || '').trim() || '本周';
  const sentLines = ($('#inpSent').value || '').split('\n').map(s => s.trim()).filter(Boolean);
  const wordLines = ($('#inpWord').value || '').split('\n').map(s => s.trim()).filter(Boolean);

  data.week = week;
  data.sentences = sentLines.map(splitSent).filter(x => x && x.en);
  data.words = wordLines.map(splitWord).filter(x => x && x.en);
  data.isDemo = false;

  state.puzzleIdx = null;
  state.fillQs = []; state.fillI = 0;
  state.listenQs = []; state.listenI = 0;
  state.talkI = 0;

  saveData();
  sfx('right');
  render();
  showOverlay(`<div class="overlay-emoji">✅</div>
    <h3 class="overlay-title">已保存</h3>
    <p class="overlay-text">${data.sentences.length} 个句型 · ${data.words.length} 个单词<br>可以去玩了</p>
    <button class="big-btn green" data-act="ov-close">开始玩 →</button>`);
}

/* ---------- 导入导出 ---------- */
function exportData() {
  const name = `${data.week || '本周'}-英语内容.json`;
  const blob = new Blob([JSON.stringify({ week: data.week, sentences: data.sentences, words: data.words }, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = name;
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 500);
  showOverlay(`<div class="overlay-emoji">📤</div><h3 class="overlay-title">已导出</h3><p class="overlay-text">文件名：${esc(name)}<br>存在「文件」App 里，下周可以导回来</p><button class="big-btn" data-act="ov-close">好的</button>`);
}

function importData() {
  const inp = document.createElement('input');
  inp.type = 'file';
  inp.accept = '.json,application/json';
  inp.onchange = () => {
    const f = inp.files && inp.files[0];
    if (!f) return;
    const fr = new FileReader();
    fr.onload = () => {
      try {
        const d = JSON.parse(fr.result);
        if (!d || !Array.isArray(d.sentences) || !Array.isArray(d.words)) throw new Error('格式不对');
        data.week = d.week || '本周';
        data.sentences = d.sentences;
        data.words = d.words;
        data.isDemo = false;
        state.puzzleIdx = null;
        state.fillQs = []; state.fillI = 0;
        state.listenQs = []; state.listenI = 0;
        state.talkI = 0;
        saveData();
        sfx('right');
        render();
        showOverlay(`<div class="overlay-emoji">📥</div><h3 class="overlay-title">导入成功</h3><p class="overlay-text">${esc(data.week)}：${data.sentences.length} 句型 · ${data.words.length} 单词</p><button class="big-btn green" data-act="ov-close">开始玩 →</button>`);
      } catch (err) {
        showOverlay(`<div class="overlay-emoji">🙈</div><h3 class="overlay-title">导入失败</h3><p class="overlay-text">这个文件读不出来，确认是本游戏导出的 JSON</p><button class="big-btn" data-act="ov-close">知道了</button>`);
      }
    };
    fr.readAsText(f);
  };
  inp.click();
}

/* ---------- 首次进入：没有内容就先给示例，方便上手 ---------- */
(function firstRun() {
  if (!data.sentences.length && !data.words.length) {
    demoData();
  }
})();

/* ---------- iOS「添加到主屏幕」提示（一次性，可关） ---------- */
(function pwaHint() {
  const iOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
    (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1); // iPadOS 13+ 伪装成 Mac
  const inStandalone = window.navigator.standalone === true ||
    (typeof window.matchMedia === 'function' && window.matchMedia('(display-mode: standalone)').matches);
  if (!iOS || inStandalone) return;
  if (localStorage.getItem('pwa_hint_dismissed')) return;
  const bar = document.createElement('div');
  bar.className = 'pwa-hint';
  bar.innerHTML = '📲 想像 App 一样打开？点 Safari 底部的 <b>分享</b> → <b>添加到主屏幕</b>' +
    '<button class="pwa-x" aria-label="关闭">✕</button>';
  document.body.appendChild(bar);
  bar.querySelector('.pwa-x').addEventListener('click', () => {
    bar.remove();
    localStorage.setItem('pwa_hint_dismissed', '1');
  });
})();
