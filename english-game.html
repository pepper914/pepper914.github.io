<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="英语游戏">
<meta name="theme-color" content="#fff8ee">
<title>本周英语游戏</title>
<style>
/* ===== 基础 ===== */
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
  -webkit-touch-callout: none;
  user-select: none;
}

html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  overflow: hidden;
  background: #fff8ee;
  font-family: -apple-system, "PingFang SC", "Helvetica Neue", "Microsoft YaHei", sans-serif;
  color: #3a3a3a;
  touch-action: manipulation;
}

button {
  font-family: inherit;
  border: none;
  background: none;
  cursor: pointer;
  color: inherit;
}

#app {
  display: flex;
  flex-direction: column;
  height: 100vh;
  max-width: 1180px;
  margin: 0 auto;
  background: #fffdf8;
}

/* ===== 顶部栏 ===== */
.topbar {
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  padding: 12px 20px;
  padding-top: max(12px, env(safe-area-inset-top));
  background: #fff;
  border-bottom: 3px solid #ffe6cc;
}

.kid-switch {
  display: flex;
  gap: 8px;
}

.kid-btn {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 8px 14px;
  border-radius: 999px;
  background: #f4f4f6;
  font-size: 18px;
  font-weight: 700;
  color: #9a9a9a;
  transition: all .18s;
}

.kid-btn.active {
  background: #ffb27a;
  color: #fff;
  box-shadow: 0 4px 0 #f0935a;
}

.kid-face { font-size: 24px; }

.week-title { flex: 1; text-align: center; }

.week-label {
  font-size: 22px;
  font-weight: 800;
  color: #4a4a4a;
}

.week-sub {
  font-size: 14px;
  color: #a5a5a5;
  margin-top: 2px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 420px;
}

.edit-btn {
  display: flex;
  align-items: center;
  gap: 6px;
  min-height: 52px;
  padding: 0 22px;
  border-radius: 16px;
  background: #ffe9d2;
  color: #e08238;
  font-size: 19px;
  font-weight: 900;
  transition: transform .12s;
}

.edit-btn:active { transform: scale(.95); }

.star-box {
  display: flex;
  align-items: center;
  gap: 6px;
  background: #fff4d6;
  padding: 8px 16px;
  border-radius: 999px;
}

.star-icon { font-size: 24px; }

.star-num {
  font-size: 24px;
  font-weight: 900;
  color: #f5a623;
}

/* ===== 主视图 ===== */
.view {
  flex: 1;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding: 20px;
}

.view-inner {
  max-width: 900px;
  margin: 0 auto;
}

/* ===== 底部导航 ===== */
.tabbar {
  flex: 0 0 auto;
  display: flex;
  background: #fff;
  border-top: 3px solid #ffe6cc;
  padding-bottom: env(safe-area-inset-bottom);
}

.tab {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  padding: 12px 0;
  color: #b0b0b0;
  font-weight: 700;
  transition: all .15s;
}

.tab-ico { font-size: 30px; }

.tab-txt { font-size: 14px; }

.tab.active {
  color: #ff8b3d;
}

.tab.active .tab-ico {
  transform: scale(1.18);
}

.tab:active { transform: scale(.94); }

/* ===== 通用组件 ===== */
.page-title {
  font-size: 26px;
  font-weight: 900;
  color: #4a4a4a;
  margin: 0 0 4px;
}

.page-hint {
  font-size: 16px;
  color: #a0a0a0;
  margin: 0 0 18px;
}

.big-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: 64px;
  padding: 0 30px;
  border-radius: 20px;
  background: #ff9f43;
  color: #fff;
  font-size: 24px;
  font-weight: 800;
  box-shadow: 0 5px 0 #e8863a;
  transition: transform .1s;
}

.big-btn:active {
  transform: translateY(4px);
  box-shadow: 0 1px 0 #e8863a;
}

.big-btn.green { background: #4ecdc4; box-shadow: 0 5px 0 #35b3ab; }
.big-btn.blue  { background: #6aa9ff; box-shadow: 0 5px 0 #4d8ce6; }
.big-btn.ghost { background: #fff; color: #7a7a7a; box-shadow: 0 0 0 3px #eee inset; }

:disabled { opacity: .45; }

/* ===== 示例内容提示条 ===== */
.demo-banner {
  display: block;
  width: 100%;
  text-align: left;
  background: #eef7ff;
  border: 3px dashed #a9d3ff;
  border-radius: 20px;
  padding: 16px 22px;
  margin-bottom: 18px;
  font-size: 19px;
  font-weight: 700;
  color: #3d7dbf;
  line-height: 1.6;
}

.demo-banner:active { transform: scale(.985); }

.demo-banner .demo-cta {
  font-size: 20px;
  font-weight: 900;
  color: #1f66ad;
}

/* ===== 句子选择列表（拼句子 / 对话共用） ===== */
.sent-list {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 14px;
}

.sent-card {
  position: relative;
  background: #fff;
  border: 3px solid #ffe0bd;
  border-radius: 22px;
  padding: 18px 20px;
  text-align: left;
  transition: all .15s;
}

.sent-card:active { transform: scale(.97); }

.sent-card .en {
  font-size: 26px;
  font-weight: 800;
  color: #3a3a3a;
  line-height: 1.3;
}

.sent-card .zh {
  font-size: 16px;
  color: #a8a8a8;
  margin-top: 6px;
}

.sent-card .done-flag {
  position: absolute;
  top: -10px;
  right: -8px;
  font-size: 30px;
}

.sent-card.done {
  border-color: #b7e6c4;
  background: #f4fdf6;
}

/* ===== 拼句子游戏 ===== */
.slots-row {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  justify-content: center;
  min-height: 84px;
  padding: 14px;
  background: #fff;
  border: 3px dashed #ffd1a3;
  border-radius: 22px;
  margin-bottom: 18px;
}

.slot {
  min-width: 92px;
  height: 66px;
  padding: 0 14px;
  border-radius: 16px;
  border: 3px solid #ffd1a3;
  background: #fffaf3;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 28px;
  font-weight: 800;
  color: #ff8b3d;
  transition: all .15s;
}

.slot.filled {
  background: #fff;
  border-style: solid;
  border-color: #ffb27a;
  color: #3a3a3a;
  box-shadow: 0 3px 0 #ffd9b8;
}

.slot.wrong {
  border-color: #ff7a7a;
  background: #fff2f2;
  color: #e05c5c;
  animation: shake .4s;
}

.slot.right {
  border-color: #7bd389;
  background: #f1fdf3;
  color: #3f9e52;
}

.cards-row {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  justify-content: center;
  margin-bottom: 20px;
}

.word-card {
  min-width: 92px;
  height: 66px;
  padding: 0 16px;
  border-radius: 16px;
  background: #fff;
  border: 3px solid #e6e6ee;
  box-shadow: 0 4px 0 #e6e6ee;
  font-size: 28px;
  font-weight: 800;
  color: #3a3a3a;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: transform .12s;
}

.word-card:active { transform: translateY(3px); box-shadow: 0 1px 0 #e6e6ee; }

.word-card.used {
  opacity: .25;
  pointer-events: none;
}

.word-card.hinted {
  border-color: #ffb27a;
  background: #fff6ec;
  animation: pop .3s;
}

.puzzle-bar {
  display: flex;
  gap: 12px;
  justify-content: center;
  flex-wrap: wrap;
}

/* ===== 填空游戏 ===== */
.fill-sentence {
  text-align: center;
  font-size: 40px;
  font-weight: 900;
  color: #3a3a3a;
  line-height: 1.5;
  margin: 10px 0 6px;
  word-break: break-word;
}

.fill-sentence .blank {
  display: inline-block;
  min-width: 150px;
  border-bottom: 6px solid #ff9f43;
  color: #ff9f43;
}

.fill-zh {
  text-align: center;
  font-size: 20px;
  color: #a8a8a8;
  margin-bottom: 26px;
}

.opt-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 14px;
  max-width: 760px;
  margin: 0 auto;
}

.opt-card {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
  min-height: 100px;
  padding: 14px;
  border-radius: 22px;
  background: #fff;
  border: 3px solid #e6e6ee;
  box-shadow: 0 5px 0 #e6e6ee;
  transition: all .12s;
}

.opt-card:active { transform: translateY(4px); box-shadow: 0 1px 0 #e6e6ee; }

.opt-card .ico { font-size: 40px; line-height: 1; }
.opt-card .en { font-size: 30px; font-weight: 900; }
.opt-card .zh { font-size: 15px; color: #a8a8a8; }

.opt-card.ok  { border-color: #7bd389; background: #f1fdf3; box-shadow: 0 5px 0 #b7e6c4; }
.opt-card.no  { border-color: #ff9d9d; background: #fff2f2; animation: shake .4s; }

/* ===== 听音游戏 ===== */
.listen-hero {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 14px;
  margin: 8px 0 24px;
}

.play-btn {
  width: 150px;
  height: 150px;
  border-radius: 50%;
  background: #6aa9ff;
  color: #fff;
  font-size: 66px;
  box-shadow: 0 8px 0 #4d8ce6;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: transform .12s;
}

.play-btn:active { transform: translateY(6px); box-shadow: 0 2px 0 #4d8ce6; }
.play-btn.playing { animation: pulse 1s infinite; }

.listen-hint {
  font-size: 18px;
  color: #a0a0a0;
}

.listen-zh-hint {
  font-size: 20px;
  color: #7a7a7a;
  min-height: 28px;
  font-weight: 700;
}

/* ===== 对话 / 跟读 ===== */
.talk-stage {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 16px;
  padding: 24px 20px;
  background: #fff;
  border-radius: 26px;
  border: 3px solid #d8ecff;
  text-align: center;
}

.talk-role {
  font-size: 16px;
  color: #a0a0a0;
  font-weight: 700;
}

.talk-en {
  font-size: 38px;
  font-weight: 900;
  color: #3a3a3a;
  line-height: 1.35;
}

.talk-zh {
  font-size: 20px;
  color: #8a8a8a;
}

.talk-emoji { font-size: 64px; line-height: 1; }

.mic-btn {
  width: 130px;
  height: 130px;
  border-radius: 50%;
  background: #ff6b9d;
  color: #fff;
  font-size: 56px;
  box-shadow: 0 7px 0 #e2548a;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all .12s;
}

.mic-btn:active { transform: translateY(5px); box-shadow: 0 2px 0 #e2548a; }
.mic-btn.recording { background: #e05c5c; box-shadow: 0 7px 0 #c94b4b; animation: pulse 1.2s infinite; }

.heard-text {
  font-size: 22px;
  font-weight: 800;
  color: #3f9e52;
  min-height: 34px;
  background: #f1fdf3;
  border-radius: 14px;
  padding: 6px 18px;
}

.heard-text.bad { color: #c96a6a; background: #fff2f2; }

.talk-nav {
  display: flex;
  justify-content: center;
  gap: 14px;
  margin-top: 18px;
}

.progress-dots {
  display: flex;
  gap: 8px;
  justify-content: center;
  margin-top: 14px;
}

.dot {
  width: 14px;
  height: 14px;
  border-radius: 50%;
  background: #e6e6ee;
}

.dot.on { background: #ff9f43; }
.dot.done { background: #7bd389; }

/* ===== 设置页 ===== */
.setup-block {
  background: #fff;
  border-radius: 24px;
  padding: 20px;
  margin-bottom: 18px;
  border: 3px solid #ffe6cc;
}

.setup-block h3 {
  margin: 0 0 6px;
  font-size: 22px;
  font-weight: 900;
  color: #4a4a4a;
}

.setup-block .desc {
  margin: 0 0 14px;
  font-size: 15px;
  color: #a0a0a0;
  line-height: 1.6;
}

textarea.input {
  width: 100%;
  min-height: 150px;
  border: 3px solid #e6e6ee;
  border-radius: 16px;
  padding: 14px;
  font-size: 18px;
  font-family: inherit;
  line-height: 1.6;
  resize: vertical;
  user-select: text;
  -webkit-user-select: text;
  color: #3a3a3a;
  background: #fdfdfd;
}

textarea.input:focus {
  outline: none;
  border-color: #ffb27a;
}

input.input {
  width: 100%;
  border: 3px solid #e6e6ee;
  border-radius: 16px;
  padding: 12px 14px;
  font-size: 20px;
  font-family: inherit;
  font-weight: 800;
  user-select: text;
  -webkit-user-select: text;
  color: #3a3a3a;
  background: #fdfdfd;
}

input.input:focus { outline: none; border-color: #ffb27a; }

.row-btns {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
  margin-top: 14px;
}

.small-btn {
  padding: 12px 22px;
  border-radius: 16px;
  background: #f4f4f6;
  font-size: 18px;
  font-weight: 800;
  color: #6a6a6a;
  transition: all .12s;
}

.small-btn:active { transform: scale(.96); }
.small-btn.primary { background: #ff9f43; color: #fff; }
.small-btn.danger { background: #fff0f0; color: #d96969; }

.word-chips {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin-top: 14px;
}

.chip {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 10px 16px;
  border-radius: 999px;
  background: #fff6ec;
  font-size: 18px;
  font-weight: 700;
}

.chip .chip-ico { font-size: 22px; }
.chip .chip-zh { color: #a0a0a0; font-size: 15px; }
.chip .chip-x { color: #d09090; font-weight: 900; margin-left: 4px; }

.switch-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  padding: 12px 0;
}

.switch-row + .switch-row { border-top: 2px solid #f2f2f5; }

.switch-label { font-size: 18px; font-weight: 800; color: #4a4a4a; }
.switch-desc { font-size: 14px; color: #a5a5a5; margin-top: 2px; }

.toggle {
  flex: 0 0 auto;
  width: 74px;
  height: 42px;
  border-radius: 999px;
  background: #e6e6ee;
  position: relative;
  transition: background .2s;
}

.toggle.on { background: #7bd389; }

.toggle .knob {
  position: absolute;
  top: 4px;
  left: 4px;
  width: 34px;
  height: 34px;
  border-radius: 50%;
  background: #fff;
  box-shadow: 0 2px 4px rgba(0,0,0,.18);
  transition: left .2s;
}

.toggle.on .knob { left: 36px; }

/* ===== 弹层 ===== */
.overlay {
  position: fixed;
  inset: 0;
  background: rgba(50, 40, 30, .45);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 50;
  padding: 24px;
}

.overlay.hidden { display: none; }

.overlay-card {
  background: #fff;
  border-radius: 28px;
  padding: 30px 34px;
  text-align: center;
  max-width: 560px;
  width: 100%;
  box-shadow: 0 20px 50px rgba(0,0,0,.2);
  animation: pop .3s;
}

.overlay-title {
  font-size: 34px;
  font-weight: 900;
  margin: 0 0 8px;
  color: #4a4a4a;
}

.overlay-text {
  font-size: 19px;
  color: #8a8a8a;
  line-height: 1.6;
  margin: 0 0 20px;
}

.overlay-emoji { font-size: 82px; line-height: 1; margin-bottom: 10px; }

/* ===== 空状态 ===== */
.empty {
  text-align: center;
  padding: 50px 20px;
}

.empty .ico { font-size: 90px; line-height: 1; }
.empty .txt { font-size: 22px; color: #a0a0a0; margin: 14px 0 22px; }

/* ===== 彩纸 ===== */
.confetti-layer {
  position: fixed;
  inset: 0;
  pointer-events: none;
  overflow: hidden;
  z-index: 60;
}

.confetti-piece {
  position: absolute;
  font-size: 30px;
  will-change: transform;
}

/* ===== 动画 ===== */
@keyframes shake {
  0%, 100% { transform: translateX(0); }
  20% { transform: translateX(-9px); }
  40% { transform: translateX(9px); }
  60% { transform: translateX(-6px); }
  80% { transform: translateX(6px); }
}

@keyframes pop {
  0% { transform: scale(.82); opacity: 0; }
  70% { transform: scale(1.06); }
  100% { transform: scale(1); opacity: 1; }
}

@keyframes pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.07); }
}

.hidden { display: none !important; }

</style>
</head>
<body>

<div id="app">
  <!-- 顶部栏 -->
  <header class="topbar">
    <div class="kid-switch" id="kidSwitch">
      <button class="kid-btn" data-kid="juicy"><span class="kid-face">👧</span><span class="kid-name">juicy</span></button>
      <button class="kid-btn" data-kid="geimi"><span class="kid-face">🧒</span><span class="kid-name">geimi</span></button>
    </div>
    <div class="week-title">
      <div class="week-label" id="weekLabel">本周句型</div>
      <div class="week-sub" id="weekSub">点右边「录入」放句型和单词</div>
    </div>
    <button class="edit-btn" id="editBtn">✏️ 录入</button>
    <div class="star-box">
      <span class="star-icon">⭐</span>
      <span class="star-num" id="starNum">0</span>
    </div>
  </header>

  <!-- 主视图区 -->
  <main id="view" class="view"></main>

  <!-- 底部导航 -->
  <nav class="tabbar" id="tabbar">
    <button class="tab" data-view="puzzle"><span class="tab-ico">🧩</span><span class="tab-txt">拼句子</span></button>
    <button class="tab" data-view="fill"><span class="tab-ico">🕳️</span><span class="tab-txt">填空</span></button>
    <button class="tab" data-view="listen"><span class="tab-ico">👂</span><span class="tab-txt">听音</span></button>
    <button class="tab" data-view="talk"><span class="tab-ico">💬</span><span class="tab-txt">对话</span></button>
    <button class="tab" data-view="setup"><span class="tab-ico">✏️</span><span class="tab-txt">录入</span></button>
  </nav>
</div>

<!-- 通用弹层 -->
<div class="overlay hidden" id="overlay">
  <div class="overlay-card" id="overlayCard"></div>
</div>

<!-- 彩纸层 -->
<div id="confetti" class="confetti-layer"></div>

<script>
/* =========================================================
   本周英语游戏 —— 句型 + 单词，iPad 触屏版
   ========================================================= */

/* ---------- 常见儿童英语词 → 表情图（不联网、不依赖图片文件） ---------- */
const EMOJI_MAP = {
  mother: '👩', mom: '👩', father: '👨', dad: '👨', parents: '👨‍👩‍👧',
  sister: '👧', brother: '👦', baby: '👶', grandma: '👵', grandpa: '👨‍🦳',
  family: '👨‍👩‍👧‍👦', friend: '🧑‍🤝‍🧑', teacher: '👩‍🏫', doctor: '👨‍⚕️', nurse: '👩‍⚕️',
  boy: '👦', girl: '👧', child: '🧒', man: '👨', woman: '👩', people: '👫',
  student: '🧑‍🎓', driver: '🚗', farmer: '👨‍🌾', cook: '👨‍🍳', police: '👮',
  apple: '🍎', banana: '🍌', orange: '🍊', grape: '🍇', pear: '🍐', peach: '🍑',
  strawberry: '🍓', watermelon: '🍉', lemon: '🍋', cherry: '🍒', mango: '🥭',

  const ex = exclude.map(x => String(x).toLowerCase());
  return shuffle(DICT.filter(k => ex.indexOf(k) < 0)).slice(0, need);
}

const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));

function esc(s) {
  return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
}

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function emoOf(word) {
  const k = String(word || '').toLowerCase().replace(/[^a-z]/g, '');
  return EMOJI_MAP[k] || '';
}

function tokenize(s) {
  return (String(s).trim().match(/[A-Za-z][A-Za-z']*|[.,!?]/g) || []);
}

// 拆分 "英文 | 中文"
function splitSent(line) {
  let parts = line.split(/[|｜\t]/).map(s => s.trim()).filter(Boolean);
  if (!parts.length) return null;
  if (parts.length === 1) return { en: parts[0], zh: '' };
  const zi = parts.findIndex(p => /[\u4e00-\u9fa5]/.test(p));
  if (zi >= 0) {
    const zh = parts[zi];
    const en = parts.filter((_, i) => i !== zi).join(' ');
    return { en, zh };
  }
  return { en: parts[0], zh: parts.slice(1).join(' ') };
}

// 拆分 "apple 苹果" / "ice cream 冰淇淋"
function splitWord(line) {
  let parts;
  if (/[\t,，;；]/.test(line)) {
    parts = line.split(/[\t,，;；]/).map(s => s.trim()).filter(Boolean);
  } else {
    const seg = line.trim().split(/\s+/);
    if (seg.length <= 2) parts = seg;
    else parts = [seg.slice(0, -1).join(' '), seg[seg.length - 1]];
  }
  const en = (parts[0] || '').trim();
  const zh = parts.slice(1).join(' ').trim();
  if (!en) return null;
  return { en, zh };
}

/* ---------- 朗读 ---------- */
let cachedVoice = null;

function pickVoice() {
  if (cachedVoice) return cachedVoice;
  if (!('speechSynthesis' in window)) return null;
  const all = speechSynthesis.getVoices().filter(v => v.lang && v.lang.toLowerCase().startsWith('en'));
  if (!all.length) return null;
  const us = all.filter(v => v.lang.replace('_', '-').toLowerCase() === 'en-us');
  const pool = us.length ? us : all;
  const prefer = ['samantha', 'alex', 'ava', 'allison', 'susan', 'karen', 'daniel', 'moira', 'google us english'];
  for (const n of prefer) {
    const hit = pool.find(v => v.name.toLowerCase().includes(n));
    if (hit) { cachedVoice = hit; return hit; }
  }
  cachedVoice = pool[0];
  return cachedVoice;
}

if ('speechSynthesis' in window) {
  speechSynthesis.onvoiceschanged = () => { cachedVoice = null; pickVoice(); };
  pickVoice();
}

function speak(text, opts) {
  opts = opts || {};
  if (!('speechSynthesis' in window)) return;
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'en-US';
    u.rate = opts.rate || (data.settings.rate || 0.85);
    u.pitch = 1.05;
    const v = pickVoice();
    if (v) u.voice = v;
    if (opts.onend) u.onend = opts.onend;
    speechSynthesis.speak(u);
  } catch (e) {}
}

function shutUp() {
  if ('speechSynthesis' in window) { try { speechSynthesis.cancel(); } catch (e) {} }
}

/* ---------- 音效（无需音频文件） ---------- */
let AC = null;
function sfx(type) {
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    if (AC.state === 'suspended') AC.resume();
    const notes = { right: [523, 659, 784], wrong: [311, 233], tap: [700], win: [523, 659, 784, 1047] }[type] || [600];
    const t0 = AC.currentTime;
    notes.forEach((f, i) => {
      const o = AC.createOscillator(), g = AC.createGain();
      o.type = 'sine';
      o.frequency.value = f;
      const st = t0 + i * 0.1;
      g.gain.setValueAtTime(0.0001, st);
      g.gain.linearRampToValueAtTime(0.16, st + 0.015);
      g.gain.exponentialRampToValueAtTime(0.0001, st + 0.25);
      o.connect(g); g.connect(AC.destination);
      o.start(st); o.stop(st + 0.28);
    });
  } catch (e) {}
}

/* iOS 上语音引擎必须在用户手势里先"碰"一次，否则后面自动朗读会没声音 */
let unlocked = false;
function unlockSpeech() {
  if (unlocked) return;
  unlocked = true;
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    if (AC.state === 'suspended') AC.resume();
  } catch (e) {}
  if ('speechSynthesis' in window) {
    try {
      const u = new SpeechSynthesisUtterance(' ');
      u.volume = 0;
      u.lang = 'en-US';
      speechSynthesis.speak(u);
    } catch (e) {}
  }
}
document.addEventListener('click', unlockSpeech);

    const dur = 1700 + Math.random() * 1300;

  }
}

function puzzleState() {
  const s = data.sentences[state.puzzleIdx];
  const toks = tokenize(s.en);

  const words = tail ? toks.slice(0, -1) : toks;
  return { words, pieces: shuffle(words) };
}

// 运行时状态挂在 DOM 上
let pz = { words: [], pieces: [], used: {}, slots: [] };

function initPuzzle() {
  const st = puzzleState();
  pz = { words: st.words, pieces: st.pieces, used: {}, slots: new Array(st.words.length).fill(null) };
  paintPuzzle();
}

function paintPuzzle() {
  const slotsEl = $('#slots');
  slotsEl.innerHTML = pz.words.map((w, i) => {
    const v = pz.slots[i];
    return `<div class="slot ${v ? 'filled' : ''}" data-act="pz-unslot" data-i="${i}">${v ? esc(v) : ''}</div>`;
  }).join('');

  $('#cards').innerHTML = pz.pieces.map((w, i) => {
    return `<button class="word-card ${pz.used[i] ? 'used' : ''}" data-act="pz-slot" data-p="${i}">${esc(w)}</button>`;
  }).join('');
}

function pzPlace(pIdx) {
  if (pz.used[pIdx]) return;
  const empty = pz.slots.indexOf(null);
  if (empty < 0) return;
  pz.used[pIdx] = true;
  pz.slots[empty] = pz.pieces[pIdx];
  sfx('tap');
  paintPuzzle();
  if (pz.slots.indexOf(null) < 0) setTimeout(pzCheck, 180);
}

function pzUnslot(i) {
  if (!pz.slots[i]) return;
  const w = pz.slots[i];
  // 找到对应卡片下标（优先未使用的同内容卡片）
  const idx = pz.pieces.findIndex((p, k) => p === w && !pz.used[k]);
  if (idx >= 0) pz.used[idx] = false;
  else {
    const any = pz.pieces.findIndex((p, k) => p === w && pz.used[k]);
    if (any >= 0) pz.used[any] = false;
  }
  pz.slots[i] = null;
  sfx('tap');
  paintPuzzle();
}

function pzCheck() {
  const ok = pz.slots.every((v, i) => String(v).toLowerCase() === String(pz.words[i]).toLowerCase());
  const s = data.sentences[state.puzzleIdx];
  if (ok) {
    sfx('win');
    confetti();
    $$('.slot').forEach(el => el.classList.add('right'));
    const fresh = award('puzzle_' + state.puzzleIdx);
    speak(s.en, { rate: 0.8 });
    showOverlay(`<div class="overlay-emoji">🎉</div>
      <h3 class="overlay-title">拼对啦！</h3>
      <p class="overlay-text">${esc(s.en)}<br><span style="color:#a0a0a0">${esc(s.zh || '')}</span></p>
      <button class="big-btn green" data-act="ov-closepuzzle">继续 →</button>`);
  } else {
    sfx('wrong');
    $$('.slot').forEach(el => el.classList.add('wrong'));
    setTimeout(() => {
      pz.slots = new Array(pz.words.length).fill(null);
      pz.used = {};
      paintPuzzle();
    }, 1200);
  }
}

function pzPut(i) {
  const idx = pz.pieces.findIndex((p, k) => p.toLowerCase() === pz.words[i].toLowerCase() && !pz.used[k]);
  if (idx < 0) return false;
  pz.used[idx] = true;
  pz.slots[i] = pz.pieces[idx];
  paintPuzzle();
  const c = $$('.word-card')[idx];
  if (c) c.classList.add('hinted');
  return true;
}

function pzHint() {
  // 从左往右找到第一个不对的位置：错的先撤回，再把正确词放进去
  for (let i = 0; i < pz.words.length; i++) {
    const cur = pz.slots[i];
    if (cur && String(cur).toLowerCase() === String(pz.words[i]).toLowerCase()) continue;
    if (cur) pzUnslot(i);
    if (pzPut(i)) sfx('tap');
    if (pz.slots.indexOf(null) < 0) setTimeout(pzCheck, 180);
    return;
  }
}

/* =========================================================
   视图：挖空填空
   ========================================================= */
function buildFillQs() {
  const qs = [];
  const allWords = data.words.map(w => w.en);

  data.sentences.forEach((s, si) => {
    const toks = tokenize(s.en);
    const cands = toks.filter(t => /^[A-Za-z]/.test(t) && t.length > 2 && !STOP.has(t.toLowerCase()));
    if (!cands.length) return;
    const target = cands[Math.floor(Math.random() * cands.length)];
    // 干扰项：本周其他单词
    let pool = allWords.filter(w => w.toLowerCase() !== target.toLowerCase());
    // 再从其他句型里捞实词
    data.sentences.forEach((o, oi) => {
      if (oi === si) return;
      tokenize(o.en).forEach(t => {
        if (/^[A-Za-z]/.test(t) && t.length > 2 && !STOP.has(t.toLowerCase()) && t.toLowerCase() !== target.toLowerCase()) pool.push(t);
      });
    });
    pool = Array.from(new Set(pool));
    const need = 3 - pool.length;
    if (need > 0) pool = pool.concat(filler(need, pool.concat([target])));
    const opts = shuffle([target].concat(shuffle(pool).slice(0, 3)));
    qs.push({ kind: 'sentence', target, opts, sent: s, si });
  });

  data.words.forEach((w, wi) => {
    let pool = allWords.filter(x => x.toLowerCase() !== w.en.toLowerCase());
    const need = 3 - pool.length;
    if (need > 0) pool = pool.concat(filler(need, pool.concat([w.en])));
    const opts = shuffle([w.en].concat(shuffle(pool).slice(0, 3)));
    qs.push({ kind: 'word', target: w.en, opts, word: w, wi });
  });

  return qs;
}

function viewFill() {
  if (!data.sentences.length && !data.words.length) return emptyView('🕳️', '还没有内容', '去「设置」里添加句型和单词');
  if (!state.fillQs.length) state.fillQs = shuffle(buildFillQs());
  const q = state.fillQs[state.fillI];
  if (!q) { setTimeout(() => { state.fillQs = []; state.fillI = 0; render(); }, 0); return '<div class="view-inner"></div>'; }

  let body = '';
  if (q.kind === 'sentence') {
    const parts = q.sent.en.split(new RegExp(`\\b${q.target.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')}\\b`, 'i'));
    body = `<div class="fill-sentence">${esc(parts[0] || '')}<span class="blank">&nbsp;?&nbsp;</span>${esc(parts.slice(1).join(q.target) || '')}</div>
            <div class="fill-zh">${esc(q.sent.zh || '')}</div>`;
  } else {
    body = `<div class="fill-sentence"><span class="blank">&nbsp;?&nbsp;</span></div>
            <div class="fill-zh">${esc(q.word.zh || '这个东西英文怎么说？')}</div>`;
  }

  let html = '<div class="view-inner">';
  html += `<h2 class="page-title">选一个词填进去</h2>`;
  html += `<p class="page-hint">第 ${state.fillI + 1} / ${state.fillQs.length} 题</p>`;
  html += body;
  html += '<div class="opt-grid" id="optGrid">';
  q.opts.forEach(o => {
    const ico = emoOf(o);
    html += `<button class="opt-card" data-act="fill-pick" data-w="${esc(o)}">
      ${ico ? `<span class="ico">${ico}</span>` : ''}
      <span class="en">${esc(o)}</span>
    </button>`;
  });
  html += '</div></div>';
  return html;
}

function fillPick(btn) {
  const q = state.fillQs[state.fillI];
  const pick = btn.dataset.w;
  if (pick.toLowerCase() === q.target.toLowerCase()) {
    btn.classList.add('ok');
    sfx('right');
    const key = q.kind === 'sentence' ? 'fill_s' + q.si : 'fill_w' + q.wi;
    award(key);
    speak(q.kind === 'sentence' ? q.sent.en : q.target);
    setTimeout(() => {
      state.fillI++;
      if (state.fillI >= state.fillQs.length) {
        state.fillQs = [];
        state.fillI = 0;
        showFillFinish();
      } else render();
    }, 1100);
  } else {
    btn.classList.add('no');
    sfx('wrong');
    setTimeout(() => btn.classList.remove('no'), 600);
  }
}

function showFillFinish() {
  sfx('win');
  confetti();
  showOverlay(`<div class="overlay-emoji">🏆</div>
    <h3 class="overlay-title">全部填完啦！</h3>
    <p class="overlay-text">这一轮的题目都做完了</p>
    <button class="big-btn green" data-act="ov-restart-fill">再来一轮 →</button>`);
}

/* =========================================================
   视图：听音选词
   ========================================================= */
function buildListenQs() {
  const qs = [];
  const allWords = data.words.map(w => w.en);
  data.words.forEach((w, wi) => {
    let pool = allWords.filter(x => x.toLowerCase() !== w.en.toLowerCase());
    const need = 3 - pool.length;
    if (need > 0) pool = pool.concat(filler(need, pool.concat([w.en])));
    const opts = shuffle([w.en].concat(shuffle(pool).slice(0, 3)));
    qs.push({ kind: 'word', target: w.en, opts, zh: w.zh, wi });
  });
  data.sentences.forEach((s, si) => {
    const pool = data.sentences.filter((_, i) => i !== si).map(o => o.zh).filter(Boolean);
    if (pool.length < 3) return;
    const opts = shuffle([s.zh].concat(shuffle(pool).slice(0, 3)));
    qs.push({ kind: 'sent', target: s.en, opts, zh: '', si });
  });
  return qs;
}

function viewListen() {
  if (!data.words.length && !data.sentences.length) return emptyView('👂', '还没有内容', '去「设置」里添加句型和单词');
  if (!state.listenQs.length) state.listenQs = shuffle(buildListenQs());
  const q = state.listenQs[state.listenI];
  if (!q) { setTimeout(() => { state.listenQs = []; state.listenI = 0; render(); }, 0); return '<div class="view-inner"></div>'; }

  let html = '<div class="view-inner">';
  html += `<h2 class="page-title">听一听，是哪个？</h2>`;
  html += `<p class="page-hint">第 ${state.listenI + 1} / ${state.listenQs.length} 题</p>`;
  html += `<div class="listen-hero">
      <button class="play-btn" data-act="ls-play">🔊</button>

      <div class="listen-zh-hint" id="lsReveal"></div>
    </div>`;
  html += '<div class="opt-grid" id="lsGrid">';
  q.opts.forEach(o => {

}

function listenPlay() {
  const q = state.listenQs[state.listenI];

  speak(q.target, { rate: 0.75 });
}

function listenPick(btn) {
  const q = state.listenQs[state.listenI];

  // 单词题：听到的英文；句型题：听到的整句对应的中文
  const right = q.kind === 'word'
    ? pick.toLowerCase() === q.target.toLowerCase()
    : pick === data.sentences[q.si].zh;

        showListenFinish();

    }, 1100);
  } else {
    btn.classList.add('no');

}

function showListenFinish() {
  sfx('win');
  confetti();
  showOverlay(`<div class="overlay-emoji">🎧</div>
    <h3 class="overlay-title">耳朵真灵！</h3>

/* =========================================================
   视图：语音对话 / 跟读

function viewTalk() {
  if (!data.sentences.length) return emptyView('💬', '还没有句型', '去「设置」里把本周句型粘进去');

function talkFinishView() {
  return `<div class="view-inner"><div class="empty">
    <div class="ico">🗣️</div>

  </div></div>`;
}

/* 语音识别（可选，不支持会自动退回跟读） */
let recogObj = null;

function startRecog(cb) {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { cb(null, 'unsupported'); return; }
  try {
    const r = new SR();
    r.lang = 'en-US';
    r.interimResults = false;
    r.maxAlternatives = 3;
    let got = false;
    r.onresult = e => {
      got = true;
      const res = e.results[0];
      let best = '';
      for (let i = 0; i < res.length; i++) best = best || res[i].transcript;
      cb(best, null);
    };
    r.onerror = e => { if (!got) cb(null, e.error || 'error'); };
    r.onend = () => { if (!got) cb(null, 'noresult'); };
    r.start();
    recogObj = r;
  } catch (e) { cb(null, 'error'); }
}

function talkMic() {
  const s = data.sentences[state.talkI];
  const heard = $('#heard');
  if (!heard) return;

  if (!data.settings.recog) {
    // 跟读模式：点击 = 朗读 + 提示孩子跟着读
    speak(s.en, { rate: 0.75 });
    heard.classList.remove('hidden', 'bad');
    heard.textContent = '🔊 跟着读一遍吧';
    return;
  }

  if (state.recording) {
    try { recogObj && recogObj.stop(); } catch (e) {}
    state.recording = false;
    render();
    return;
  }

  state.recording = true;
  render();
  const btn = document.querySelector('.mic-btn');
  btn && btn.classList.add('recording');
  heard.classList.remove('hidden', 'bad');
  heard.textContent = '🎙️ 在听你说…';

  startRecog((text, err) => {
    state.recording = false;
    const el = $('#heard');
    if (!el) return;
    if (text) {
      const norm = t => String(t).toLowerCase().replace(/[^a-z\s]/g, ' ').trim();
      const want = norm(s.en).split(/\s+/).filter(Boolean);
      const got = norm(text).split(/\s+/).filter(Boolean);
      let hit = 0;
      want.forEach(w => { if (got.indexOf(w) >= 0) hit++; });
      const score = hit / Math.max(want.length, 1);
      el.classList.remove('hidden');
      if (score >= 0.6) {
        el.classList.remove('bad');
        el.textContent = `👂 听到啦：${text}`;
        sfx('right');
        award('talk_' + state.talkI);
      } else {
        el.classList.add('bad');
        el.textContent = `👂 听到：${text}（再试一次）`;
      }
    } else {
      el.classList.add('bad');
      const msg = err === 'not-allowed' ? '没拿到麦克风权限，去设置里打开' :
        err === 'no-speech' ? '没听到声音，靠近一点再说' :
        err === 'unsupported' ? '这台设备不能用听写，已切回跟读模式' : '没听清，再试一次';
      el.textContent = `🙈 ${msg}`;
      if (err === 'unsupported') data.settings.recog = false;
    }
  });
}

function talkDone() {
  const s = data.sentences[state.talkI];
  if (state.recording) {
    try { recogObj && recogObj.stop(); } catch (e) {}
    state.recording = false;
  }
  if (!data.settings.recog) {
    award('talk_' + state.talkI);   // 跟读模式：读完即记
  }
  speak(s.en, { rate: 0.8 });
  sfx('tap');
  state.talkI++;
  if (state.talkI >= data.sentences.length) {
    sfx('win');
    confetti();
    showOverlay(`<div class="overlay-emoji">🎤</div>
      <h3 class="overlay-title">全部读完啦！</h3>
      <p class="overlay-text">今天又说了 ${data.sentences.length} 句英语</p>
      <button class="big-btn green" data-act="tk-restart">再来一轮 →</button>`);
    state.talkI = 0;
    render();
    return;
  }
  render();
}

/* =========================================================
   渲染与事件
   ========================================================= */
function render() {
  const v = $('#view');
  const map = { puzzle: viewPuzzle, fill: viewFill, listen: viewListen, talk: viewTalk, setup: viewSetup };
  v.innerHTML = (map[state.view] || viewPuzzle)();
  v.scrollTop = 0;
  paintTop();
  if (state.view === 'puzzle' && state.puzzleIdx !== null) initPuzzle();
}

function switchView(name) {
  shutUp();
  state.view = name;
  if (name === 'fill') { state.fillQs = []; state.fillI = 0; }
  if (name === 'listen') { state.listenQs = []; state.listenI = 0; }
  render();
}

document.addEventListener('DOMContentLoaded', () => {
  // 底部导航
  $('#tabbar').addEventListener('click', e => {
    const t = e.target.closest('.tab');
    if (!t) return;
    sfx('tap');
    switchView(t.dataset.view);
  });

  // 孩子切换
  $('#kidSwitch').addEventListener('click', e => {
    const b = e.target.closest('.kid-btn');
    if (!b) return;
    state.kid = b.dataset.kid;
    sfx('tap');
    render();
  });

  // 顶部「录入」按钮
  $('#editBtn').addEventListener('click', () => {
    sfx('tap');
    switchView('setup');
  });

  // 主视图事件
  $('#view').addEventListener('click', e => {
    const el = e.target.closest('[data-act]');
    if (!el) return;
    const act = el.dataset.act;

    if (act === 'go-setup') { switchView('setup'); return; }

    // 拼句子
    if (act === 'pz-open') { state.puzzleIdx = +el.dataset.i; sfx('tap'); render(); return; }
    if (act === 'pz-slot') { pzPlace(+el.dataset.p); return; }
    if (act === 'pz-unslot') { pzUnslot(+el.dataset.i); return; }
    if (act === 'pz-hint') { pzHint(); return; }
    if (act === 'pz-speak') { speak(data.sentences[state.puzzleIdx].en, { rate: 0.8 }); return; }
    if (act === 'pz-reset') { initPuzzle(); return; }
    if (act === 'pz-back') { state.puzzleIdx = null; sfx('tap'); render(); return; }

    // 填空
    if (act === 'fill-pick') { fillPick(el); return; }

    // 听音
    if (act === 'ls-play') { listenPlay(); return; }
    if (act === 'ls-pick') { listenPick(el); return; }

    // 对话
    if (act === 'tk-mic') { talkMic(); return; }
    if (act === 'tk-play') { speak(data.sentences[state.talkI].en, { rate: 0.75 }); return; }
    if (act === 'tk-done') { talkDone(); return; }
    if (act === 'tk-prev') { state.talkI = Math.max(0, state.talkI - 1); sfx('tap'); render(); return; }
    if (act === 'tk-restart') { state.talkI = 0; hideOverlay(); sfx('tap'); render(); return; }

    // 设置
    if (act === 'su-save') { saveSetup(); return; }
    if (act === 'su-demo') { demoData(); sfx('right'); showOverlay(`<div class="overlay-emoji">🎁</div><h3 class="overlay-title">示例已填入</h3><p class="overlay-text">先拿示例玩一遍，熟了再换成孩子真正的课本内容</p><button class="big-btn" data-act="ov-close">知道了</button>`); return; }
    if (act === 'su-clear') {
      data.sentences = []; data.words = [];
      state.puzzleIdx = null; state.fillQs = []; state.fillI = 0; state.listenQs = []; state.listenI = 0; state.talkI = 0;
      saveData(); sfx('tap'); render();
      return;
    }
    if (act === 'su-delword') { data.words.splice(+el.dataset.i, 1); saveData(); render(); return; }
    if (act === 'su-recog') {
      data.settings.recog = !data.settings.recog;
      saveData();
      render();
      if (data.settings.recog) speak('Hello, I can hear you.', { rate: 0.85 });
      return;
    }
    if (act === 'su-rate') { data.settings.rate = +el.dataset.v; saveData(); render(); speak('Hello!', { rate: +el.dataset.v }); return; }
    if (act === 'su-test') { speak('Hello! This is my mother. I like apples.', { rate: data.settings.rate }); return; }
    if (act === 'su-export') { exportData(); return; }
    if (act === 'su-import') { importData(); return; }
    if (act === 'su-resetstars') {
      ['juicy', 'geimi'].forEach(k => prog[k] = { awarded: {} });
      saveProg(); sfx('tap'); paintTop();
      showOverlay(`<div class="overlay-emoji">🔄</div><h3 class="overlay-title">星星已清空</h3><p class="overlay-text">换新一周内容时清一次就行</p><button class="big-btn" data-act="ov-close">好的</button>`);
      return;
    }
  });

  // 弹层事件
  $('#overlay').addEventListener('click', e => {
    const el = e.target.closest('[data-act]');
    if (e.target.id === 'overlay') { hideOverlay(); return; }
    if (!el) return;
    const act = el.dataset.act;
    hideOverlay();
    if (act === 'ov-closepuzzle') { state.puzzleIdx = null; render(); }
    if (act === 'ov-restart-fill') { state.fillQs = []; state.fillI = 0; render(); }
    if (act === 'ov-restart-listen') { state.listenQs = []; state.listenI = 0; render(); }
  });

  render();
});

/* ---------- 保存设置 ---------- */
function saveSetup() {
  const week = ($('#inpWeek').value || '').trim() || '本周';
  const sentLines = ($('#inpSent').value || '').split('\n').map(s => s.trim()).filter(Boolean);
  const wordLines = ($('#inpWord').value || '').split('\n').map(s => s.trim()).filter(Boolean);

  data.week = week;
  data.sentences = sentLines.map(splitSent).filter(x => x && x.en);
  data.words = wordLines.map(splitWord).filter(x => x && x.en);
  data.isDemo = false;

  state.puzzleIdx = null;
  state.fillQs = []; state.fillI = 0;
  state.listenQs = []; state.listenI = 0;
  state.talkI = 0;

  saveData();
  sfx('right');
  render();
  showOverlay(`<div class="overlay-emoji">✅</div>
    <h3 class="overlay-title">已保存</h3>
    <p class="overlay-text">${data.sentences.length} 个句型 · ${data.words.length} 个单词<br>可以去玩了</p>
    <button class="big-btn green" data-act="ov-close">开始玩 →</button>`);
}

/* ---------- 导入导出 ---------- */
function exportData() {
  const name = `${data.week || '本周'}-英语内容.json`;
  const blob = new Blob([JSON.stringify({ week: data.week, sentences: data.sentences, words: data.words }, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = name;
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 500);
  showOverlay(`<div class="overlay-emoji">📤</div><h3 class="overlay-title">已导出</h3><p class="overlay-text">文件名：${esc(name)}<br>存在「文件」App 里，下周可以导回来</p><button class="big-btn" data-act="ov-close">好的</button>`);
}

function importData() {
  const inp = document.createElement('input');
  inp.type = 'file';
  inp.accept = '.json,application/json';
  inp.onchange = () => {
    const f = inp.files && inp.files[0];
    if (!f) return;
    const fr = new FileReader();
    fr.onload = () => {
      try {
        const d = JSON.parse(fr.result);
        if (!d || !Array.isArray(d.sentences) || !Array.isArray(d.words)) throw new Error('格式不对');
        data.week = d.week || '本周';
        data.sentences = d.sentences;
        data.words = d.words;
        data.isDemo = false;
        state.puzzleIdx = null;
        state.fillQs = []; state.fillI = 0;
        state.listenQs = []; state.listenI = 0;
        state.talkI = 0;
        saveData();
        sfx('right');
        render();
        showOverlay(`<div class="overlay-emoji">📥</div><h3 class="overlay-title">导入成功</h3><p class="overlay-text">${esc(data.week)}：${data.sentences.length} 句型 · ${data.words.length} 单词</p><button class="big-btn green" data-act="ov-close">开始玩 →</button>`);
      } catch (err) {
        showOverlay(`<div class="overlay-emoji">🙈</div><h3 class="overlay-title">导入失败</h3><p class="overlay-text">这个文件读不出来，确认是本游戏导出的 JSON</p><button class="big-btn" data-act="ov-close">知道了</button>`);
      }
    };
    fr.readAsText(f);
  };
  inp.click();
}

/* ---------- 首次进入：没有内容就先给示例，方便上手 ---------- */
(function firstRun() {
  if (!data.sentences.length && !data.words.length) {
    demoData();
  }
})();

</script>
