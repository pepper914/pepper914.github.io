<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="英语游戏">
<meta name="theme-color" content="#3f9fd6">
<title>英语冰雪岛 · Elsa & Anna</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>
/* ===== 基础 ===== */
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
  -webkit-touch-callout: none;
  user-select: none;
}

html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  overflow: hidden;
  background: #e9f4fe;
  font-family: -apple-system, "PingFang SC", "Helvetica Neue", "Microsoft YaHei", sans-serif;
  color: #3a3a3a;
  touch-action: manipulation;
}

button {
  font-family: inherit;
  border: none;
  background: none;
  cursor: pointer;
  color: inherit;
}

#app {
  display: flex;
  flex-direction: column;
  height: 100vh;
  max-width: 1180px;
  margin: 0 auto;
  background: #f3faff;
}

/* ===== 顶部栏 ===== */
.topbar {
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  padding: 12px 20px;
  padding-top: max(12px, env(safe-area-inset-top));
  background: #fff;
  border-bottom: 3px solid #cfe6ff;
}

.kid-switch {
  display: flex;
  gap: 8px;
}

.kid-btn {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 8px 14px;
  border-radius: 999px;
  background: #f4f4f6;
  font-size: 18px;
  font-weight: 700;
  color: #9a9a9a;
  transition: all .18s;
}

.kid-btn.active {
  background: #74bdf0;
  color: #fff;
  box-shadow: 0 4px 0 #46a0dc;
}

.kid-face { font-size: 24px; }

.week-title { flex: 1; text-align: center; }

.week-label {
  font-size: 22px;
  font-weight: 800;
  color: #4a4a4a;
}

.week-sub {
  font-size: 14px;
  color: #a5a5a5;
  margin-top: 2px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 420px;
}

.edit-btn {
  display: flex;
  align-items: center;
  gap: 6px;
  min-height: 52px;
  padding: 0 22px;
  border-radius: 16px;
  background: #dcf0ff;
  color: #1a6fb8;
  font-size: 19px;
  font-weight: 900;
  transition: transform .12s;
}

.edit-btn:active { transform: scale(.95); }

.star-box {
  display: flex;
  align-items: center;
  gap: 6px;
  background: #e0f1ff;
  padding: 8px 16px;
  border-radius: 999px;
}

.star-icon { font-size: 24px; }

.star-num {
  font-size: 24px;
  font-weight: 900;
  color: #1f7fc4;
}

/* ===== 主视图 ===== */
.view {
  flex: 1;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding: 20px;
}

.view-inner {
  max-width: 900px;
  margin: 0 auto;
}

/* ===== 底部导航 ===== */
.tabbar {
  flex: 0 0 auto;
  display: flex;
  background: #fff;
  border-top: 3px solid #cfe6ff;
  padding-bottom: env(safe-area-inset-bottom);
}

.tab {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  padding: 12px 0;
  color: #b0b0b0;
  font-weight: 700;
  transition: all .15s;
}

.tab-ico { font-size: 30px; }

.tab-txt { font-size: 14px; }

.tab.active {
  color: #1f7fc4;
}

.tab.active .tab-ico {
  transform: scale(1.18);
}

.tab:active { transform: scale(.94); }

/* ===== 通用组件 ===== */
.page-title {
  font-size: 26px;
  font-weight: 900;
  color: #4a4a4a;
  margin: 0 0 4px;
}

.page-hint {
  font-size: 16px;
  color: #a0a0a0;
  margin: 0 0 18px;
}

.big-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: 64px;
  padding: 0 30px;
  border-radius: 20px;
  background: #4fa8e8;
  color: #fff;
  font-size: 24px;
  font-weight: 800;
  box-shadow: 0 5px 0 #e8863a;
  transition: transform .1s;
}

.big-btn:active {
  transform: translateY(4px);
  box-shadow: 0 1px 0 #e8863a;
}

.big-btn.green { background: #4ecdc4; box-shadow: 0 5px 0 #35b3ab; }
.big-btn.blue  { background: #6aa9ff; box-shadow: 0 5px 0 #4d8ce6; }
.big-btn.ghost { background: #fff; color: #7a7a7a; box-shadow: 0 0 0 3px #eee inset; }

:disabled { opacity: .45; }

/* ===== 示例内容提示条 ===== */
.demo-banner {
  display: block;
  width: 100%;
  text-align: left;
  background: #eef7ff;
  border: 3px dashed #a9d3ff;
  border-radius: 20px;
  padding: 16px 22px;
  margin-bottom: 18px;
  font-size: 19px;
  font-weight: 700;
  color: #3d7dbf;
  line-height: 1.6;
}

.demo-banner:active { transform: scale(.985); }

.demo-banner .demo-cta {
  font-size: 20px;
  font-weight: 900;
  color: #1f66ad;
}

/* ===== 句子选择列表（拼句子 / 对话共用） ===== */
.sent-list {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 14px;
}

.sent-card {
  position: relative;
  background: #fff;
  border: 3px solid #ffe0bd;
  border-radius: 22px;
  padding: 18px 20px;
  text-align: left;
  transition: all .15s;
}

.sent-card:active { transform: scale(.97); }

.sent-card .en {
  font-size: 26px;
  font-weight: 800;
  color: #3a3a3a;
  line-height: 1.3;
}

.sent-card .zh {
  font-size: 16px;
  color: #a8a8a8;
  margin-top: 6px;
}

.sent-card .done-flag {
  position: absolute;
  top: -10px;
  right: -8px;
  font-size: 30px;
}

.sent-card.done {
  border-color: #b7e6c4;
  background: #f4fdf6;
}

/* ===== 拼句子游戏 ===== */
.slots-row {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  justify-content: center;
  min-height: 84px;
  padding: 14px;
  background: #fff;
  border: 3px dashed #ffd1a3;
  border-radius: 22px;
  margin-bottom: 18px;
}

.slot {
  min-width: 92px;
  height: 66px;
  padding: 0 14px;
  border-radius: 16px;
  border: 3px solid #ffd1a3;
  background: #f2fbff;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 28px;
  font-weight: 800;
  color: #1f7fc4;
  transition: all .15s;
}

.slot.filled {
  background: #fff;
  border-style: solid;
  border-color: #74bdf0;
  color: #3a3a3a;
  box-shadow: 0 3px 0 #ffd9b8;
}

.slot.wrong {
  border-color: #ff7a7a;
  background: #fff2f2;
  color: #e05c5c;
  animation: shake .4s;
}

.slot.right {
  border-color: #7bd389;
  background: #f1fdf3;
  color: #3f9e52;
}

.cards-row {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  justify-content: center;
  margin-bottom: 20px;
}

.word-card {
  min-width: 92px;
  height: 66px;
  padding: 0 16px;
  border-radius: 16px;
  background: #fff;
  border: 3px solid #e6e6ee;
  box-shadow: 0 4px 0 #e6e6ee;
  font-size: 28px;
  font-weight: 800;
  color: #3a3a3a;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: transform .12s;
}

.word-card:active { transform: translateY(3px); box-shadow: 0 1px 0 #e6e6ee; }

.word-card.used {
  opacity: .25;
  pointer-events: none;
}

.word-card.hinted {
  border-color: #74bdf0;
  background: #eaf6ff;
  animation: pop .3s;
}

.puzzle-bar {
  display: flex;
  gap: 12px;
  justify-content: center;
  flex-wrap: wrap;
}

/* ===== 填空游戏 ===== */
.fill-sentence {
  text-align: center;
  font-size: 40px;
  font-weight: 900;
  color: #3a3a3a;
  line-height: 1.5;
  margin: 10px 0 6px;
  word-break: break-word;
}

.fill-sentence .blank {
  display: inline-block;
  min-width: 110px;
  padding: 0 6px;
  border-bottom: 6px solid #4fa8e8;
  color: #4fa8e8;
}

/* 正在填的那个空：底色highlight，孩子一眼知道该填哪 */
.fill-sentence .blank.cur {
  background: #e0f1ff;
  border-bottom-color: #2f8fd8;
  animation: blink 1.4s ease-in-out infinite;
}

.fill-sentence .blank.filled {
  color: #2e9e46;
  border-bottom-color: #7bd389;
  background: transparent;
  animation: none;
}

@keyframes blink {
  0%, 100% { background: #e0f1ff; }
  50%      { background: #cfe9ff; }
}

/* 中文题面（中译英） */
.fill-sentence.zh-big {
  font-size: 46px;
  color: #2b2b2b;
  margin: 26px 0 34px;
}

/* 进阶模式提示条 */
.page-hint.hard-tip {
  display: inline-block;
  background: #e0f1ff;
  color: #16639e;
  font-weight: 800;
  font-size: 17px;
  padding: 6px 16px;
  border-radius: 999px;
  margin: 0 auto 6px;
}

/* 选项是整句时，字号降下来，避免溢出 */
.opt-card.sent .en {
  font-size: 21px;
  font-weight: 800;
  line-height: 1.35;
  text-align: left;
}

.fill-zh {
  text-align: center;
  font-size: 20px;
  color: #a8a8a8;
  margin-bottom: 26px;
}

.opt-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 14px;
  max-width: 760px;
  margin: 0 auto;
}

.opt-card {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
  min-height: 100px;
  padding: 14px;
  border-radius: 22px;
  background: #fff;
  border: 3px solid #e6e6ee;
  box-shadow: 0 5px 0 #e6e6ee;
  transition: all .12s;
}

.opt-card:active { transform: translateY(4px); box-shadow: 0 1px 0 #e6e6ee; }

.opt-card .ico { font-size: 40px; line-height: 1; }
.opt-card .en { font-size: 30px; font-weight: 900; }
.opt-card .zh { font-size: 15px; color: #a8a8a8; }

.opt-card.ok  { border-color: #7bd389; background: #f1fdf3; box-shadow: 0 5px 0 #b7e6c4; }
.opt-card.no  { border-color: #ff9d9d; background: #fff2f2; animation: shake .4s; }

/* ===== 听音游戏 ===== */
.listen-hero {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 14px;
  margin: 8px 0 24px;
}

.play-btn {
  width: 150px;
  height: 150px;
  border-radius: 50%;
  background: #6aa9ff;
  color: #fff;
  font-size: 66px;
  box-shadow: 0 8px 0 #4d8ce6;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: transform .12s;
}

.play-btn:active { transform: translateY(6px); box-shadow: 0 2px 0 #4d8ce6; }
.play-btn.playing { animation: pulse 1s infinite; }

.listen-hint {
  font-size: 18px;
  color: #a0a0a0;
}

.listen-zh-hint {
  font-size: 20px;
  color: #7a7a7a;
  min-height: 28px;
  font-weight: 700;
}

/* ===== 对话 / 跟读 ===== */
.talk-stage {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 16px;
  padding: 24px 20px;
  background: #fff;
  border-radius: 26px;
  border: 3px solid #d8ecff;
  text-align: center;
}

.talk-role {
  font-size: 16px;
  color: #a0a0a0;
  font-weight: 700;
}

.talk-en {
  font-size: 38px;
  font-weight: 900;
  color: #3a3a3a;
  line-height: 1.35;
}

.talk-zh {
  font-size: 20px;
  color: #8a8a8a;
}

.talk-emoji { font-size: 64px; line-height: 1; }

.mic-btn {
  width: 130px;
  height: 130px;
  border-radius: 50%;
  background: #ff6b9d;
  color: #fff;
  font-size: 56px;
  box-shadow: 0 7px 0 #e2548a;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all .12s;
}

.mic-btn:active { transform: translateY(5px); box-shadow: 0 2px 0 #e2548a; }
.mic-btn.recording { background: #e05c5c; box-shadow: 0 7px 0 #c94b4b; animation: pulse 1.2s infinite; }

.heard-text {
  font-size: 22px;
  font-weight: 800;
  color: #3f9e52;
  min-height: 34px;
  background: #f1fdf3;
  border-radius: 14px;
  padding: 6px 18px;
}

.heard-text.bad { color: #c96a6a; background: #fff2f2; }

.talk-nav {
  display: flex;
  justify-content: center;
  gap: 14px;
  margin-top: 18px;
}

.progress-dots {
  display: flex;
  gap: 8px;
  justify-content: center;
  margin-top: 14px;
}

.dot {
  width: 14px;
  height: 14px;
  border-radius: 50%;
  background: #e6e6ee;
}

.dot.on { background: #4fa8e8; }
.dot.done { background: #7bd389; }

/* ===== 设置页 ===== */
.setup-block {
  background: #fff;
  border-radius: 24px;
  padding: 20px;
  margin-bottom: 18px;
  border: 3px solid #cfe6ff;
}

.setup-block h3 {
  margin: 0 0 6px;
  font-size: 22px;
  font-weight: 900;
  color: #4a4a4a;
}

.setup-block .desc {
  margin: 0 0 14px;
  font-size: 15px;
  color: #a0a0a0;
  line-height: 1.6;
}

textarea.input {
  width: 100%;
  min-height: 150px;
  border: 3px solid #e6e6ee;
  border-radius: 16px;
  padding: 14px;
  font-size: 18px;
  font-family: inherit;
  line-height: 1.6;
  resize: vertical;
  user-select: text;
  -webkit-user-select: text;
  color: #3a3a3a;
  background: #fdfdfd;
}

textarea.input:focus {
  outline: none;
  border-color: #74bdf0;
}

input.input {
  width: 100%;
  border: 3px solid #e6e6ee;
  border-radius: 16px;
  padding: 12px 14px;
  font-size: 20px;
  font-family: inherit;
  font-weight: 800;
  user-select: text;
  -webkit-user-select: text;
  color: #3a3a3a;
  background: #fdfdfd;
}

input.input:focus { outline: none; border-color: #74bdf0; }

.row-btns {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
  margin-top: 14px;
}

.small-btn {
  padding: 12px 22px;
  border-radius: 16px;
  background: #f4f4f6;
  font-size: 18px;
  font-weight: 800;
  color: #6a6a6a;
  transition: all .12s;
}

.small-btn:active { transform: scale(.96); }
.small-btn.primary { background: #4fa8e8; color: #fff; }
.small-btn.danger { background: #fff0f0; color: #d96969; }

.word-chips {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin-top: 14px;
}

.chip {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 10px 16px;
  border-radius: 999px;
  background: #eaf6ff;
  font-size: 18px;
  font-weight: 700;
}

.chip .chip-ico { font-size: 22px; }
.chip .chip-zh { color: #a0a0a0; font-size: 15px; }
.chip .chip-x { color: #d09090; font-weight: 900; margin-left: 4px; }

.switch-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  padding: 12px 0;
}

.switch-row + .switch-row { border-top: 2px solid #f2f2f5; }

.switch-label { font-size: 18px; font-weight: 800; color: #4a4a4a; }
.switch-desc { font-size: 14px; color: #a5a5a5; margin-top: 2px; }

.toggle {
  flex: 0 0 auto;
  width: 74px;
  height: 42px;
  border-radius: 999px;
  background: #e6e6ee;
  position: relative;
  transition: background .2s;
}

.toggle.on { background: #7bd389; }

.toggle .knob {
  position: absolute;
  top: 4px;
  left: 4px;
  width: 34px;
  height: 34px;
  border-radius: 50%;
  background: #fff;
  box-shadow: 0 2px 4px rgba(0,0,0,.18);
  transition: left .2s;
}

.toggle.on .knob { left: 36px; }

/* ===== 弹层 ===== */
.overlay {
  position: fixed;
  inset: 0;
  background: rgba(50, 40, 30, .45);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 50;
  padding: 24px;
}

.overlay.hidden { display: none; }

.overlay-card {
  background: #fff;
  border-radius: 28px;
  padding: 30px 34px;
  text-align: center;
  max-width: 560px;
  width: 100%;
  box-shadow: 0 20px 50px rgba(0,0,0,.2);
  animation: pop .3s;
}

.overlay-title {
  font-size: 34px;
  font-weight: 900;
  margin: 0 0 8px;
  color: #4a4a4a;
}

.overlay-text {
  font-size: 19px;
  color: #8a8a8a;
  line-height: 1.6;
  margin: 0 0 20px;
}

.overlay-emoji { font-size: 82px; line-height: 1; margin-bottom: 10px; }

/* ===== 空状态 ===== */
.empty {
  text-align: center;
  padding: 50px 20px;
}

.empty .ico { font-size: 90px; line-height: 1; }
.empty .txt { font-size: 22px; color: #a0a0a0; margin: 14px 0 22px; }

/* ===== 彩纸 ===== */
.confetti-layer {
  position: fixed;
  inset: 0;
  pointer-events: none;
  overflow: hidden;
  z-index: 60;
}

.confetti-piece {
  position: absolute;
  font-size: 30px;
  will-change: transform;
}

/* ===== 动画 ===== */
@keyframes shake {
  0%, 100% { transform: translateX(0); }
  20% { transform: translateX(-9px); }
  40% { transform: translateX(9px); }
  60% { transform: translateX(-6px); }
  80% { transform: translateX(6px); }
}

@keyframes pop {
  0% { transform: scale(.82); opacity: 0; }
  70% { transform: scale(1.06); }
  100% { transform: scale(1); opacity: 1; }
}

@keyframes pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.07); }
}

.hidden { display: none !important; }

/* =========================================================
   冰雪世界：雪花、角色、剧本对话
   ========================================================= */

/* 飘雪背景（不挡点击） */
.snow {
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  overflow: hidden;
}

.snow .flake {
  position: absolute;
  top: -40px;
  color: #9fd3f5;
  animation: fall linear infinite;
}

@keyframes fall {
  to { transform: translateY(112vh) rotate(320deg); }
}

#app { position: relative; z-index: 1; }

/* ------ 角色头像 ------ */
.role-pick {
  display: flex;
  justify-content: center;
  gap: 18px;
  margin-bottom: 14px;
}

.role-card {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  padding: 10px 18px 12px;
  border-radius: 22px;
  background: #fff;
  border: 4px solid #d8e9fb;
  transition: transform .15s, border-color .15s;
}

.role-card .av { width: 74px; height: 74px; }

.role-card .nm {
  font-size: 17px;
  font-weight: 900;
  color: #4a7fa8;
}

.role-card.on {
  border-color: #4fa8e8;
  background: #eaf6ff;
  transform: translateY(-3px);
  box-shadow: 0 6px 0 #b9dcf7;
}

.role-card.on.anna { border-color: #f0873f; background: #fff2e8; box-shadow: 0 6px 0 #f9c8a2; }
.role-card.on.anna .nm { color: #c95f18; }

/* ------ 剧情台词卡 ------ */
.scene {
  background: linear-gradient(180deg, #fff 0%, #f2faff 100%);
  border: 4px solid #cfe6ff;
  border-radius: 26px;
  padding: 18px 20px;
  margin-bottom: 16px;
}

.scene-line {
  display: flex;
  align-items: center;
  gap: 14px;
}

.scene-line.me { flex-direction: row-reverse; }

.scene-line .av {
  width: 84px;
  height: 84px;
  flex: 0 0 auto;
}

.scene-line .who {
  font-size: 15px;
  font-weight: 800;
  color: #8aa8c4;
  margin-bottom: 4px;
}

.scene-line.me .who { text-align: right; }

.bubble {
  flex: 1;
  background: #fff;
  border: 4px solid #d8e9fb;
  border-radius: 20px;
  padding: 14px 18px;
}

.scene-line.me .bubble {
  background: #eaf6ff;
  border-color: #a8d4f5;
}

.bubble .en {
  font-size: 27px;
  font-weight: 900;
  color: #2b5f8c;
  line-height: 1.35;
}

.bubble .zh {
  font-size: 16px;
  color: #8aa8c4;
  margin-top: 4px;
}

/* 正在轮到她说的那一句 */
.scene-line.active .bubble {
  border-color: #4fa8e8;
  box-shadow: 0 0 0 4px #cfe9ff;
}

.scene-role-tip {
  text-align: center;
  font-size: 17px;
  font-weight: 800;
  color: #1f7fc4;
  margin: 10px 0 0;
}

/* ------ 两人对话：爱莎 ⇄ 女儿 ------ */
.duo {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  margin-bottom: 14px;
  flex-wrap: wrap;
}

.duo-who {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  min-width: 148px;
  padding: 10px 16px 12px;
  border-radius: 24px;
  background: #fff;
  border: 4px solid #d8e9fb;
}

.duo-who .av { width: 84px; height: 84px; }
.duo-who.elsa { border-color: #a8d4f5; background: #f0f9ff; }
.duo-who.kid { border-color: #f7b8d0; background: #fff5f9; }

.duo-nm {
  font-size: 18px;
  font-weight: 900;
  color: #2b5f8c;
  line-height: 1.25;
  text-align: center;
}

.duo-nm span {
  display: block;
  font-size: 13px;
  font-weight: 700;
  color: #9ab4c9;
}

.duo-vs { font-size: 26px; }

/* 自己上传的照片头像 */
.av.pic { border-radius: 50%; object-fit: cover; background: #fff; }

.mini-btn {
  margin-top: 2px;
  padding: 6px 10px;
  font-size: 14px;
  font-weight: 800;
  color: #c95f8a;
  background: #fff;
  border: 2px solid #f7c9dc;
  border-radius: 14px;
}

.chat {
  background: linear-gradient(180deg, #fff 0%, #f2faff 100%);
  border: 4px solid #cfe6ff;
  border-radius: 26px;
  padding: 16px 14px 6px;
  margin-bottom: 14px;
}

.msg {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  margin-bottom: 12px;
  opacity: .6;
}

.msg.kid { flex-direction: row-reverse; }
.msg .av { width: 52px; height: 52px; flex: 0 0 auto; }

.msg .bubble {
  max-width: calc(100% - 72px);
  background: #fff;
  border: 3px solid #e3eefb;
  border-radius: 18px;
  padding: 8px 14px;
}

.msg .bubble .en { font-size: 19px; font-weight: 800; color: #4a7fa8; line-height: 1.35; }
.msg .bubble .zh { font-size: 14px; color: #9ab4c9; margin-top: 2px; }
.msg .tip { font-size: 13px; font-weight: 800; color: #b7c8d8; margin-top: 3px; }
.msg.kid .bubble { background: #fff2f7; border-color: #f8cfdf; }
.msg.kid .bubble .en { color: #c25b86; }
.msg.past { cursor: pointer; }

.msg.future { opacity: .38; }
.msg.future .bubble {
  background: #f6f9fc;
  border-style: dashed;
  border-color: #dbe7f3;
  color: #bccfe0;
  font-size: 20px;
  font-weight: 900;
  letter-spacing: 2px;
}

.msg.now { opacity: 1; }
.msg.now .av { width: 88px; height: 88px; }

.msg.now .bubble {
  max-width: calc(100% - 108px);
  padding: 14px 18px;
  border-width: 4px;
  border-color: #4fa8e8;
  box-shadow: 0 0 0 4px #dcefff;
}

.msg.now .bubble .en { font-size: 30px; color: #1f5d8c; }
.msg.now .bubble .zh { font-size: 17px; }
.msg.now .tip { font-size: 16px; color: #1f7fc4; }
.msg.now.kid .bubble { border-color: #ef87ae; box-shadow: 0 0 0 4px #ffe0ec; }
.msg.now.kid .bubble .en { color: #b93d6d; }
.msg.now.kid .tip { color: #c95f8a; }

.big-btn.pink { background: #f2789f; box-shadow: 0 5px 0 #d95c86; }
.big-btn.pink:active { box-shadow: 0 1px 0 #d95c86; }

/* ------ 城堡进度（四个区域） ------ */
.castle-bar {
  display: flex;
  justify-content: center;
  gap: 10px;
  margin: 0 0 16px;
  flex-wrap: wrap;
}

.castle-node {
  display: flex;
  align-items: center;
  gap: 5px;
  padding: 6px 14px;
  border-radius: 999px;
  background: #eef6fd;
  border: 3px solid #dbe9f8;
  font-size: 15px;
  font-weight: 800;
  color: #a9bfd4;
}

.castle-node.done {
  background: #dff0ff;
  border-color: #8cc6ee;
  color: #1f7fc4;
}

/* =========================================================
   剧情章节：故事地图 + 章节横幅
   ========================================================= */
.story-map {
  background: linear-gradient(180deg, #ffffff 0%, #f0f9ff 100%);
  border: 4px solid #cfe6ff;
  border-radius: 26px;
  padding: 16px 18px 10px;
  margin-bottom: 20px;
}

.story-head {
  text-align: center;
  font-size: 21px;
  font-weight: 900;
  color: #1f7fc4;
  margin-bottom: 12px;
}

.chapter {
  display: flex;
  align-items: flex-start;
  gap: 14px;
  padding: 10px 12px;
  border-radius: 18px;
  opacity: 0.92;
}

.chapter.done { background: #e7f6ff; }
.chapter.open { background: #fff; border: 3px solid #a8d4f5; }
.chapter.lock { background: #f0f4f9; opacity: 0.55; }

.chapter.lock .ch-title,
.chapter.lock .ch-text { color: #9ab0c4; }

.ch-ico {
  width: 58px;
  height: 58px;
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 32px;
  background: #fff;
  border-radius: 50%;
  border: 3px solid #dbe9f8;
}

.chapter.open .ch-ico { border-color: #4fa8e8; box-shadow: 0 0 0 5px #e3f2ff; }

.ch-title {
  font-size: 19px;
  font-weight: 900;
  color: #2b5f8c;
}

.ch-text {
  font-size: 15px;
  color: #6f93b1;
  margin-top: 3px;
  line-height: 1.45;
}

.ch-path {
  width: 5px;
  height: 20px;
  margin-left: 38px;
  border-radius: 3px;
  background: repeating-linear-gradient(#bcdcf5 0 6px, transparent 6px 12px);
}

/* 游戏页顶部章节横幅 */
.chapter-banner {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
  justify-content: center;
  background: #e7f3fd;
  border: 3px solid #c6e2f8;
  border-radius: 999px;
  padding: 7px 18px;
  margin: 0 auto 14px;
  font-size: 16px;
  font-weight: 800;
  color: #2b5f8c;
  width: fit-content;
}

.chapter-banner .cb-n {
  background: #4fa8e8;
  color: #fff;
  border-radius: 999px;
  padding: 2px 12px;
  font-size: 15px;
}

.chapter-banner .cb-tip {
  color: #7fa3c0;
  font-weight: 700;
}

/* =========================================================
   拼写：字母格 / 字母卡 / 屏幕键盘
   ========================================================= */
.sp-prompt {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  margin-bottom: 14px;
}

.sp-ico { font-size: 44px; }

.sp-zh {
  font-size: 26px;
  font-weight: 900;
  color: #2b5f8c;
}

.sp-speak {
  font-size: 17px;
  font-weight: 800;
  padding: 8px 16px;
  border-radius: 999px;
  background: #eaf6ff;
  border: 3px solid #bcdcf5;
  color: #2b7fc4;
}

.sp-stage {
  display: flex;
  justify-content: center;
  padding: 6px 0;
  border-radius: 20px;
  transition: background .2s;
}

.sp-stage.bad { animation: shake .4s; }

@keyframes shake {
  0%, 100% { transform: translateX(0); }
  25% { transform: translateX(-9px); }
  75% { transform: translateX(9px); }
}

.sp-slots {
  display: flex;
  justify-content: center;
  gap: 8px;
  flex-wrap: wrap;
}

.sp-slot {
  min-width: 54px;
  height: 70px;
  padding: 0 6px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 38px;
  font-weight: 900;
  color: #2b5f8c;
  background: #fff;
  border: 4px solid #cfe6ff;
  border-radius: 14px;
  text-transform: lowercase;
}

.sp-slot.fixed {
  background: #eef6fd;
  border-color: #dbe9f8;
  color: #7fa3c0;
}

.sp-slot.ok {
  background: #e4f7e8;
  border-color: #86d99b;
  color: #2f8f4e;
}

.sp-slot.cur {
  border-color: #4fa8e8;
  box-shadow: 0 0 0 5px #dbeefc;
  animation: blink 1.2s infinite;
}

@keyframes blink {
  0%, 100% { box-shadow: 0 0 0 5px #dbeefc; }
  50% { box-shadow: 0 0 0 5px #a8d4f5; }
}

.sp-msg {
  text-align: center;
  min-height: 26px;
  font-size: 17px;
  font-weight: 800;
  color: #2f8f4e;
  margin: 10px 0 4px;
}

.sp-msg.bad { color: #d9534f; }

.sp-cards {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 10px;
  margin: 14px 0 6px;
}

.sp-card {
  min-width: 58px;
  height: 66px;
  font-size: 32px;
  font-weight: 900;
  text-transform: lowercase;
  color: #2b5f8c;
  background: linear-gradient(180deg, #fff 0%, #eaf6ff 100%);
  border: 4px solid #bcdcf5;
  border-radius: 16px;
  box-shadow: 0 4px 0 #cfe6ff;
}

.sp-card:active { transform: translateY(3px); box-shadow: 0 1px 0 #cfe6ff; }

.sp-card.used {
  opacity: .32;
  background: #f1f5f9;
  border-color: #dbe4ee;
  box-shadow: none;
  pointer-events: none;
}

.sp-kb { margin: 14px 0 6px; }

.sp-kb-row {
  display: flex;
  justify-content: center;
  gap: 8px;
  margin-bottom: 8px;
}

.sp-key {
  min-width: 52px;
  height: 58px;
  font-size: 25px;
  font-weight: 900;
  color: #2b5f8c;
  background: #fff;
  border: 3px solid #cfe6ff;
  border-radius: 12px;
  box-shadow: 0 3px 0 #cfe6ff;
}

.sp-key:active { transform: translateY(3px); box-shadow: none; }

.sp-key.wide {
  min-width: 150px;
  font-size: 20px;
  background: #fff2e8;
  border-color: #f9c8a2;
  box-shadow: 0 3px 0 #f9c8a2;
  color: #c95f18;
}

.sp-bar {
  display: flex;
  justify-content: center;
  gap: 12px;
  flex-wrap: wrap;
  margin-top: 18px;
}

/* 六个 tab 时略微收紧，避免 iPad 竖屏挤 */
.tabbar .tab { flex: 1; min-width: 0; }
.tabbar .tab-txt { font-size: 15px; }

/* 弹层里并排的按钮 */
.ov-btns {
  display: flex;
  gap: 10px;
  justify-content: center;
  flex-wrap: wrap;
  margin-top: 8px;
}

/* 拼对后自动跳下一句的小提示 */
.auto-tip {
  text-align: center;
  font-size: 13px;
  font-weight: 700;
  color: #b7c8d8;
  margin: 8px 0 0;
}

/* 故事地图收起态：一条细横条 */
.story-mini {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  text-align: left;
  font: inherit;
  background: linear-gradient(135deg, #eaf6ff, #f5fbff);
  border: 2px solid #cfe8fa;
  border-radius: 16px;
  padding: 10px 14px;
  margin: 0 0 14px;
  cursor: pointer;
}
.story-mini:active { transform: scale(0.98); }
.story-mini .sm-ico { font-size: 22px; }
.story-mini .sm-title {
  flex: 1;
  font-size: 16px;
  font-weight: 800;
  color: #1f6fa8;
}
.story-mini .sm-shards { font-size: 15px; letter-spacing: 2px; }
.story-mini .sm-arrow {
  font-size: 13px;
  font-weight: 800;
  color: #7fb4d6;
}
.story-map { position: relative; }
.story-map.open { margin-top: 6px; }
.story-close {
  position: absolute;
  top: 10px;
  right: 12px;
  font: inherit;
  font-size: 13px;
  font-weight: 800;
  color: #7fb4d6;
  background: #f2f9ff;
  border: 1.5px solid #d8ecfb;
  border-radius: 999px;
  padding: 5px 12px;
  cursor: pointer;
}
button.chapter {
  width: 100%;
  text-align: left;
  font: inherit;
  border: none;
  background: none;
  cursor: pointer;
}
button.chapter.open:active { transform: scale(0.98); }

/* 添加到主屏幕提示条 */
.pwa-hint {
  position: fixed;
  left: 12px;
  right: 12px;
  bottom: calc(76px + env(safe-area-inset-bottom));
  z-index: 60;
  background: #22405c;
  color: #fff;
  font-size: 15px;
  font-weight: 700;
  line-height: 1.5;
  padding: 12px 42px 12px 16px;
  border-radius: 14px;
  box-shadow: 0 6px 24px rgba(20, 60, 90, 0.35);
}
.pwa-hint b { color: #9fdcff; }
.pwa-x {
  position: absolute;
  top: 50%;
  right: 10px;
  transform: translateY(-50%);
  background: none;
  border: none;
  color: #9db8cc;
  font-size: 16px;
  padding: 8px;
  cursor: pointer;
}

/* ============ 每章不同场景配色（body[data-view] 由 JS 设置） ============ */
body[data-view="puzzle"] #view { background: linear-gradient(180deg, #dceeff 0%, #f2faff 40%, #eaf7ff 100%); }
body[data-view="spell"]  #view { background: linear-gradient(180deg, #e9e2ff 0%, #f6f2ff 40%, #f0eaff 100%); }
body[data-view="fill"]   #view { background: linear-gradient(180deg, #dcf6ea 0%, #f0fdf8 40%, #e6fbf2 100%); }
body[data-view="listen"] #view { background: linear-gradient(180deg, #ffefce 0%, #fff9ec 40%, #fff3d9 100%); }
body[data-view="talk"]   #view { background: linear-gradient(180deg, #ffe4ef 0%, #fff2f7 40%, #ffeaf2 100%); }
body[data-view="setup"]  #view { background: linear-gradient(180deg, #eef1f5 0%, #f8fafc 60%, #f2f5f8 100%); }

/* 章节横幅跟随场景色 */
body[data-view="puzzle"] .chapter-banner { background: linear-gradient(90deg, #bfe3ff, #e3f3ff); }
body[data-view="spell"]  .chapter-banner { background: linear-gradient(90deg, #d9ccff, #efe8ff); }
body[data-view="fill"]   .chapter-banner { background: linear-gradient(90deg, #b6ecd6, #e2fbf0); }
body[data-view="listen"] .chapter-banner { background: linear-gradient(90deg, #ffe1a6, #fff3d6); }
body[data-view="talk"]   .chapter-banner { background: linear-gradient(90deg, #ffc9dd, #ffe6f0); }

/* 单词卡：冰晶立体感 + 按下回弹 */
.word-card {
  background: linear-gradient(180deg, #ffffff 0%, #eaf6ff 100%);
  border-color: #b9dcf3;
  box-shadow: 0 4px 0 #b9dcf3, 0 6px 14px rgba(80, 140, 190, 0.18);
  text-shadow: 0 1px 0 #fff;
}
.word-card:active { transform: translateY(3px) scale(.96); }
.word-card.used {
  opacity: .32;
  transform: scale(.92);
  box-shadow: none;
}

/* 拼句子进度点 */
.pz-progress {
  display: flex;
  align-items: center;
  gap: 10px;
  margin: -4px 0 12px;
  flex-wrap: wrap;
}
.pz-count {
  font-size: 13px;
  font-weight: 800;
  color: #5f8db0;
  background: #ffffffcc;
  border: 1.5px solid #cfe7f8;
  border-radius: 999px;
  padding: 3px 10px;
}
.pz-dots { display: flex; gap: 6px; flex-wrap: wrap; }
.pz-dot {
  width: 13px;
  height: 13px;
  border-radius: 50%;
  border: 2px solid #9cc8e6;
  background: #fff;
  padding: 0;
  cursor: pointer;
  transition: transform .12s;
}
.pz-dot.done { background: #57c793; border-color: #57c793; }
.pz-dot.cur { background: #3f9fd6; border-color: #3f9fd6; transform: scale(1.35); }
.pz-dot:active { transform: scale(1.5); }

/* 拼对迸出的星星 */
.pop-star {
  position: fixed;
  z-index: 70;
  font-size: 26px;
  pointer-events: none;
  transform: translate(-50%, -50%);
}

/* 选中的空格亮起来 */
.slot.filled {
  background: linear-gradient(180deg, #ffffff, #e8f6ff);
  border-color: #7fc3ea;
  animation: slotPop .18s ease-out;
}
@keyframes slotPop {
  0% { transform: scale(.85); }
  60% { transform: scale(1.06); }
  100% { transform: scale(1); }
}

/* ============ 220 词探险 ============ */
.q-banner { background: linear-gradient(90deg, #cfe6ff, #eaf6ff); }
.q-region {
  background: #fff;
  border: 2px solid #e3eef8;
  border-radius: 16px;
  padding: 12px 14px;
  margin: 10px 0 6px;
  box-shadow: 0 3px 10px rgba(90, 140, 180, 0.08);
}
.q-region.done { border-color: #b6ecd6; background: #f4fdf9; }
.q-region.lock { opacity: .6; }
.qr-head { display: flex; align-items: center; gap: 12px; }
.qr-ico { font-size: 30px; }
.qr-body { flex: 1; min-width: 0; }
.qr-title { font-size: 16px; font-weight: 800; color: #2f5b78; }
.qr-text { font-size: 13px; color: #7b8b98; line-height: 1.5; }
.qr-count { font-size: 13px; font-weight: 800; color: #7fb4d6; }
.q-steps { display: flex; gap: 8px; flex-wrap: wrap; padding: 2px 0 12px 8px; }
.q-step {
  width: 42px; height: 42px;
  border-radius: 12px;
  border: 2px solid #cfe7f8;
  background: #f7fcff;
  font-size: 15px; font-weight: 800; color: #5f8db0;
  cursor: pointer;
}
.q-step.open:active { transform: scale(.94); }
.q-step.done { background: #e8fbf2; border-color: #57c793; color: #3f9f78; }
.q-step.lock { opacity: .55; cursor: default; }

.q-card {
  background: linear-gradient(180deg, #ffffff, #f2f9ff);
  border: 3px solid #cfe7f8;
  border-radius: 20px;
  padding: 22px 16px 18px;
  text-align: center;
  box-shadow: 0 5px 16px rgba(90, 140, 180, 0.12);
}
.q-emoji { font-size: 44px; line-height: 1.2; }
.q-word { font-size: 34px; font-weight: 800; color: #2f5b78; margin-top: 8px; }
.q-ask { font-size: 14px; color: #8ba0b0; margin-top: 6px; }
.q-listen { text-align: center; margin: 12px 0 2px; }
.q-opts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }
.q-opt {
  background: #fff;
  border: 3px solid #e6e6ee;
  border-radius: 16px;
  box-shadow: 0 4px 0 #e6e6ee;
  padding: 16px 10px;
  font-size: 20px; font-weight: 800; color: #3a3a3a;
  cursor: pointer;
}
.q-opt:active { transform: translateY(3px); box-shadow: 0 1px 0 #e6e6ee; }
.q-done-card { text-align: center; padding: 30px 10px; }
.qd-emoji { font-size: 60px; }
.qd-sub { color: #8ba0b0; }

/* 自制解锁动画：大门打开 + 宝箱 + 光环 + 雪花 */
.ul-stage { position: relative; height: 210px; text-align: center; overflow: hidden; }
.ul-glow {
  position: absolute; left: 50%; top: 96px; width: 130px; height: 130px;
  margin-left: -65px; border-radius: 50%;
  background: radial-gradient(circle, rgba(255,241,180,.95), rgba(255,241,180,0) 70%);
  animation: ulGlow .9s ease-out;
}
@keyframes ulGlow { from { transform: scale(.3); opacity: 0 } to { transform: scale(1); opacity: 1 } }
.ul-door {
  position: absolute; top: 46px; width: 62px; height: 108px;
  background: linear-gradient(180deg, #bfe3ff, #8fc7e8);
  border: 2px solid #6fa8cc;
}
.ul-door.left { left: 50%; margin-left: -62px; border-radius: 30px 0 0 6px; animation: ulDoorL 1.1s ease-in-out .15s both; }
.ul-door.right { left: 50%; border-radius: 0 30px 6px 0; animation: ulDoorR 1.1s ease-in-out .15s both; }
@keyframes ulDoorL { 0%,100% { transform: translateX(0) } 55% { transform: translateX(-42px) } }
@keyframes ulDoorR { 0%,100% { transform: translateX(0) } 55% { transform: translateX(42px) } }

const STOP = new Set(['a', 'an', 'the', 'is', 'am', 'are', 'to', 'of', 'in', 'on',
  'at', 'it', 'this', 'that', 'my', 'your', 'i', 'you', 'he', 'she', 'we', 'they',
  'and', 'do', 'does', 'can', 'have', 'has', 'me', 'him', 'her', 'his', 'our']);

// 词不够时，从内置词典随机借几个当干扰项
const DICT = Object.keys(EMOJI_MAP).filter(k => !/\d/.test(k) && k.length > 2 && !STOP.has(k));

function filler(need, exclude) {
  const ex = exclude.map(x => String(x).toLowerCase());
  return shuffle(DICT.filter(k => ex.indexOf(k) < 0)).slice(0, need);
}

// 本周出现过的所有英文实词（去掉标点、缩写、功能词）
function contentWords() {
  const pool = [];
  data.words.forEach(w => {
    String(w.en).split(/\s+/).forEach(t => { if (/^[A-Za-z]/.test(t)) pool.push(t.replace(/[.,!?]/g, '')); });
  });
  data.sentences.forEach(s => {
    tokenize(s.en).forEach(t => {
      const bare = t.replace(/[.,!?]/g, '');
      if (/^[A-Za-z]/.test(bare) && bare.length > 1 && !STOP.has(bare.toLowerCase()) && !/['']/.test(bare)) pool.push(bare);
    });
  });
  return Array.from(new Set(pool.filter(Boolean)));
}

// 干扰项：优先本周同类词、首字母相同（形近），不够用内置词库补
function optsAround(target, n) {
  const t = String(target).replace(/[.,!?]/g, '');
  const tl = t.toLowerCase();
  let pool = contentWords().filter(w => w.toLowerCase() !== tl);
  const first = w => (w[0] || '').toLowerCase() === (t[0] || '').toLowerCase() ? 0 : 1;
  pool = shuffle(pool).sort((a, b) => first(a) - first(b));
  let picked = pool.slice(0, n - 1);
  if (picked.length < n - 1) picked = picked.concat(filler(n - 1 - picked.length, [t].concat(picked)));
  return shuffle([t].concat(picked));
}

// 简单模式的选项：本周词随机
function easyOpts(target) {
  const all = data.words.map(w => w.en);
  let pool = all.filter(x => x.toLowerCase() !== String(target).toLowerCase());
  const need = 3 - pool.length;
  if (need > 0) pool = pool.concat(filler(need, pool.concat([target])));
  return shuffle([target].concat(shuffle(pool).slice(0, 3)));
}

// 多余的卡片（拼句子用）
function decoys(exclude, n) {
  const ex = new Set(exclude.map(x => String(x).replace(/[.,!?]/g, '').toLowerCase()));
  let pool = contentWords().filter(w => !ex.has(w.toLowerCase()));
  if (pool.length < n) pool = pool.concat(filler(n - pool.length, Array.from(ex)));
  return shuffle(pool).slice(0, n);
}

// 把一个句子换个关键词，造出「听着很像」的干扰句
function sentVariants(s, n) {
  const toks = tokenize(s.en);
  const cand = [];
  toks.forEach((t, i) => {
    const bare = t.replace(/[.,!?]/g, '');
    if (/^[A-Za-z]/.test(bare) && bare.length > 2 && !STOP.has(bare.toLowerCase()) && !/['']/.test(bare)) cand.push(i);
  });
  const subs = shuffle(contentWords().concat(DICT.slice(0, 80)));
  const outs = [];
  for (const i of cand) {
    if (outs.length >= n) break;
    const w = toks[i];
    const bare = w.replace(/[.,!?]/g, '');
    const tailCh = w.slice(bare.length);
    const alt = subs.find(x => x.toLowerCase() !== bare.toLowerCase());
    if (!alt) continue;
    const copy = toks.slice();
    copy[i] = alt + tailCh;
    outs.push(copy.join(' ').replace(/\s+([.,!?])/g, '$1'));
  }
  return outs;
}

const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));

function esc(s) {
  return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
}

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function emoOf(word) {
  const k = String(word || '').toLowerCase().replace(/[^a-z]/g, '');
  return EMOJI_MAP[k] || '';
}

function tokenize(s) {
  return (String(s).trim().match(/[A-Za-z][A-Za-z']*|[.,!?]/g) || []);
}

// 拆分 "英文 | 中文"
function splitSent(line) {
  let parts = line.split(/[|｜\t]/).map(s => s.trim()).filter(Boolean);
  if (!parts.length) return null;
  if (parts.length === 1) return { en: parts[0], zh: '' };
  const zi = parts.findIndex(p => /[\u4e00-\u9fa5]/.test(p));
  if (zi >= 0) {
    const zh = parts[zi];
    const en = parts.filter((_, i) => i !== zi).join(' ');
    return { en, zh };
  }
  return { en: parts[0], zh: parts.slice(1).join(' ') };
}

// 拆分 "apple 苹果" / "ice cream 冰淇淋"
function splitWord(line) {
  let parts;
  if (/[\t,，;；]/.test(line)) {
    parts = line.split(/[\t,，;；]/).map(s => s.trim()).filter(Boolean);
  } else {
    const seg = line.trim().split(/\s+/);
    if (seg.length <= 2) parts = seg;
    else parts = [seg.slice(0, -1).join(' '), seg[seg.length - 1]];
  }
  const en = (parts[0] || '').trim();
  const zh = parts.slice(1).join(' ').trim();
  if (!en) return null;
  return { en, zh };
}

/* ---------- 朗读 ---------- */
let cachedVoice = null;

function pickVoice() {
  if (cachedVoice) return cachedVoice;
  if (!('speechSynthesis' in window)) return null;
  const all = speechSynthesis.getVoices().filter(v => v.lang && v.lang.toLowerCase().startsWith('en'));
  if (!all.length) return null;
  const us = all.filter(v => v.lang.replace('_', '-').toLowerCase() === 'en-us');
  const pool = us.length ? us : all;
  const prefer = ['samantha', 'alex', 'ava', 'allison', 'susan', 'karen', 'daniel', 'moira', 'google us english'];
  for (const n of prefer) {
    const hit = pool.find(v => v.name.toLowerCase().includes(n));
    if (hit) { cachedVoice = hit; return hit; }
  }
  cachedVoice = pool[0];
  return cachedVoice;
}

if ('speechSynthesis' in window) {
  speechSynthesis.onvoiceschanged = () => { cachedVoice = null; pickVoice(); };
  pickVoice();
}

function speak(text, opts) {
  opts = opts || {};
  if (!('speechSynthesis' in window)) return;
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'en-US';
    u.rate = opts.rate || (data.settings.rate || 0.85);
    u.pitch = 1.05;
    const v = pickVoice();
    if (v) u.voice = v;
    if (opts.onend) u.onend = opts.onend;
    speechSynthesis.speak(u);
  } catch (e) {}
}

function shutUp() {
  if ('speechSynthesis' in window) { try { speechSynthesis.cancel(); } catch (e) {} }
}

/* ---------- 音效（无需音频文件） ---------- */
let AC = null;
function sfx(type) {
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    if (AC.state === 'suspended') AC.resume();
    const notes = { right: [523, 659, 784], wrong: [311, 233], tap: [700], win: [523, 659, 784, 1047] }[type] || [600];
    const t0 = AC.currentTime;
    notes.forEach((f, i) => {
      const o = AC.createOscillator(), g = AC.createGain();
      o.type = 'sine';
      o.frequency.value = f;
      const st = t0 + i * 0.1;
      g.gain.setValueAtTime(0.0001, st);
      g.gain.linearRampToValueAtTime(0.16, st + 0.015);
      g.gain.exponentialRampToValueAtTime(0.0001, st + 0.25);
      o.connect(g); g.connect(AC.destination);
      o.start(st); o.stop(st + 0.28);
    });
  } catch (e) {}
}

/* iOS 上语音引擎必须在用户手势里先"碰"一次，否则后面自动朗读会没声音 */
let unlocked = false;
function unlockSpeech() {
  if (unlocked) return;
  unlocked = true;
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    if (AC.state === 'suspended') AC.resume();
  } catch (e) {}
  if ('speechSynthesis' in window) {
    try {
      const u = new SpeechSynthesisUtterance(' ');
      u.volume = 0;
      u.lang = 'en-US';
      speechSynthesis.speak(u);
    } catch (e) {}
  }
}
document.addEventListener('click', unlockSpeech);

  const toks = tokenize(s.en);
  const tail = /[.,!?]/.test(toks[toks.length - 1]) ? toks[toks.length - 1] : '';
  const words = tail ? toks.slice(0, -1) : toks;
  let pieces;
  if (levelOf() === 'hard') {
    // 进阶：混入多余卡片，卡片数 > 空格数
    const extra = words.length >= 4 ? 2 : 1;
    pieces = shuffle(words.concat(decoys(words, extra)));
  } else {
    pieces = shuffle(words);
  }
  return { words, pieces };
}

// 运行时状态挂在 DOM 上
let pz = { words: [], pieces: [], used: {}, slots: [] };
let pzAutoTimer = null;   // 拼对后自动跳下一句的定时器

function initPuzzle() {
  const st = puzzleState();
  pz = { words: st.words, pieces: st.pieces, used: {}, slots: new Array(st.words.length).fill(null) };
  paintPuzzle();
}

function paintPuzzle() {
  const slotsEl = $('#slots');
  slotsEl.innerHTML = pz.words.map((w, i) => {
    const v = pz.slots[i];
    return `<div class="slot ${v ? 'filled' : ''}" data-act="pz-unslot" data-i="${i}">${v ? esc(v) : ''}</div>`;
  }).join('');

  $('#cards').innerHTML = pz.pieces.map((w, i) => {
    return `<button class="word-card ${pz.used[i] ? 'used' : ''}" data-act="pz-slot" data-p="${i}">${esc(w)}</button>`;
  }).join('');
}

function pzPlace(pIdx) {
  if (pz.used[pIdx]) return;
  const empty = pz.slots.indexOf(null);
  if (empty < 0) return;
  pz.used[pIdx] = true;
  pz.slots[empty] = pz.pieces[pIdx];
  sfx('tap');
  paintPuzzle();
  if (pz.slots.indexOf(null) < 0) setTimeout(pzCheck, 180);
}

function pzUnslot(i) {
  if (!pz.slots[i]) return;
  const w = pz.slots[i];
  // 找到对应卡片下标（优先未使用的同内容卡片）
  const idx = pz.pieces.findIndex((p, k) => p === w && !pz.used[k]);
  if (idx >= 0) pz.used[idx] = false;
  else {
    const any = pz.pieces.findIndex((p, k) => p === w && pz.used[k]);
    if (any >= 0) pz.used[any] = false;
  }
  pz.slots[i] = null;
  sfx('tap');
  paintPuzzle();
}

function pzCheck() {
  const ok = pz.slots.every((v, i) => String(v).toLowerCase() === String(pz.words[i]).toLowerCase());
  const s = data.sentences[state.puzzleIdx];
  if (ok) {
    sfx('win');
    confetti();
    popStars();
    $$('.slot').forEach(el => el.classList.add('right'));
    const fresh = award('puzzle_' + state.puzzleIdx);
    speak(s.en, { rate: 0.8 });
    if (state.finalePending) { state.finalePending = false; finaleShow(); return; }
    if (state.chapterJustDone === 'puzzle') { state.chapterJustDone = null; state.puzzleIdx = null; chapterClear('puzzle'); return; }

    // 章节还没完：庆祝一下，自动去下一个没拼过的句子（不用回列表再点）
    const next = nextPuzzleIdx(state.puzzleIdx);
    if (next === null) { state.puzzleIdx = null; chapterClear('puzzle'); return; }
    const cheers = ['太棒了！', '冰雪在融化！', '爱莎为你鼓掌！', '句子复活啦！', '好厉害！', '魔法+1！'];
    const cheer = cheers[Math.floor(Math.random() * cheers.length)];
    showOverlay(`<div class="overlay-emoji">🎉</div>
      <h3 class="overlay-title">拼对啦！${cheer}</h3>
      <p class="overlay-text">${esc(s.en)}<br><span style="color:#a0a0a0">${esc(s.zh || '')}</span></p>
      <div class="ov-btns">
        <button class="big-btn green" data-act="pz-next" data-i="${next}">下一句 →</button>
        <button class="big-btn ghost" data-act="ov-closepuzzle">留在这句</button>
      </div>
      <p class="auto-tip">马上自动去下一句…</p>`);
    if (pzAutoTimer) clearTimeout(pzAutoTimer);
    pzAutoTimer = setTimeout(() => { pzAutoTimer = null; goPuzzle(next); }, 2600);
  } else {
    sfx('wrong');
    $$('.slot').forEach(el => el.classList.add('wrong'));
    setTimeout(() => {
      pz.slots = new Array(pz.words.length).fill(null);
      pz.used = {};
      paintPuzzle();
    }, 1200);
  }
}

/* =========================================================
   视图：220 词探险（长期主线 · 五个区域）
   实词记中文意思，功能词放进短语里认识
   ========================================================= */
const Q_MODES = [
  { k: 'e2z',   ico: '🔤', name: '看词选义',   ask: '它的中文意思是？' },
  { k: 'z2e',   ico: '🀄', name: '看义选词',   ask: '用英语怎么说？' },
  { k: 'match', ico: '🧩', name: '配对消消乐', ask: '把英文和中文配成一对' },
  { k: 'listen',ico: '👂', name: '听音选义',   ask: '听一听，它是什么意思？' }
];
const QSIZE = () => (window.QUEST_LEVEL_SIZE || 8);

function qWords(r) { return (window.WORDS220 || []).filter(w => w.r === r); }
function qLevelCount(r) { return Math.ceil(qWords(r).length / QSIZE()); }
function qLevelWords(r, l) { const a = qWords(r), s = QSIZE(); return a.slice(l * s, l * s + s); }
function qKey(r, l, i, d) { return 'q' + r + '_' + l + '_' + i + '_' + d; }
function qKnown(r, l, i, d) {
  const p = prog[state.kid] && prog[state.kid].awarded;
  return !!(p && p[qKey(r, l, i, d)]);
}
function qLevelClear(r, l) {
  return qLevelWords(r, l).every((_, i) => qKnown(r, l, i, 'e') && qKnown(r, l, i, 'z'));
}
function qRegionClear(r) {
  for (let l = 0; l < qLevelCount(r); l++) if (!qLevelClear(r, l)) return false;
  return true;
}
function qRegionUnlocked(r) { return r === 0 || qRegionClear(r - 1); }
function qLevelUnlocked(r, l) {
  return qRegionUnlocked(r) && (l === 0 || qLevelClear(r, l - 1));
}
function qNextLevel(r, l) {
  for (let i = l; i < qLevelCount(r); i++) if (!qLevelClear(r, i)) return { r, l: i };
  if (r + 1 < 5 && qRegionUnlocked(r + 1)) {
    for (let i = 0; i < qLevelCount(r + 1); i++) if (!qLevelClear(r + 1, i)) return { r: r + 1, l: i };
  }
  return null;
}
function qTotalKnown() {
  let n = 0;
  for (let r = 0; r < 5; r++) {
    const cnt = qWords(r).length;
    for (let i = 0; i < cnt; i++) {
      const l = Math.floor(i / QSIZE()), k = i % QSIZE();
      if (qKnown(r, l, k, 'e')) n++;
      if (qKnown(r, l, k, 'z')) n++;
    }
  }
  return n;
}

function viewQuest() {
  return state.quest.screen === 'play' ? viewQuestPlay() : viewQuestMap();
}

/* ---------- 探险地图 ---------- */
function viewQuestMap() {
  const R = window.QUEST_REGIONS || [];
  let html = '<div class="view-inner">';
  html += `<h2 class="page-title">🗺️ 单词探险地图</h2>`;
  html += `<p class="page-hint">每个词要走两遍：英→中、中→英。已点亮 ${qTotalKnown()} / 440</p>`;

  R.forEach((reg, r) => {
    const unlocked = qRegionUnlocked(r);
    const clear = qRegionClear(r);
    const lc = qLevelCount(r);
    let passed = 0;
    for (let l = 0; l < lc; l++) if (qLevelClear(r, l)) passed++;
    html += `<div class="q-region ${clear ? 'done' : unlocked ? 'open' : 'lock'}">
      <div class="qr-head">
        <span class="qr-ico">${clear ? '🏆' : unlocked ? reg.ico : '🔒'}</span>
        <div class="qr-body">
          <div class="qr-title">第${reg.n}区 · ${reg.name}${clear ? ' ✅' : ''}</div>
          <div class="qr-text">${unlocked ? esc(reg.text) : '通过上一个区域后解锁'}</div>
        </div>
        <div class="qr-count">${passed}/${lc} 关</div>
      </div>`;
    if (unlocked) {
      html += '<div class="q-steps">';
      for (let l = 0; l < lc; l++) {
        const ok = qLevelClear(r, l);
        const open = qLevelUnlocked(r, l);
        html += `<button class="q-step ${ok ? 'done' : open ? 'open' : 'lock'}" ${open ? `data-act="q-level" data-r="${r}" data-l="${l}"` : 'disabled'}>${ok ? '⭐' : open ? (l + 1) : '🔒'}</button>`;
      }
      html += '</div>';
    }
  });
  html += '</div>';
  return html;
}

/* ---------- 关卡内 ---------- */
function qEnsureQs() {
  const q = state.quest;
  if (!q.qs || !q.qs.length) {
    const ws = qLevelWords(q.region, q.level);
    const list = [];
    ws.forEach((w, i) => {
      if (!qKnown(q.region, q.level, i, 'e')) list.push({ i, dir: 'e' });
      if (!qKnown(q.region, q.level, i, 'z')) list.push({ i, dir: 'z' });
    });
    q.qs = shuffle(list);
  }
  return q.qs;
}

function qOpts(w, dir) {
  const pool = qWords(state.quest.region).filter(x => x !== w);
  const picks = shuffle(pool).slice(0, 3);
  const right = dir === 'e' ? w.zh : w.en;
  const opts = [right];
  picks.forEach(x => {
    const v = dir === 'e' ? x.zh : x.en;
    if (v && opts.indexOf(v) < 0 && opts.length < 4) opts.push(v);
  });
  return shuffle(opts);
}

function viewQuestPlay() {
  const q = state.quest;
  const R = window.QUEST_REGIONS || [];
  const reg = R[q.region] || { name: '探险', n: q.region + 1, ico: '🏔️' };
  const lc = qLevelCount(q.region);
  const qs = qEnsureQs();

  let html = '<div class="view-inner">';
  html += `<div class="chapter-banner q-banner"><span class="cb-n">第${reg.n}区</span> ${reg.ico} ${reg.name}
    <span class="cb-tip">第 ${q.level + 1} / ${lc} 关</span></div>`;

  if (!qs.length) {
    html += `<div class="q-done-card"><div class="qd-emoji">🎉</div>
      <h3>这一关全部认全了！</h3>
      <p class="qd-sub">${esc(reg.name)} · 第 ${q.level + 1} 关</p>
      <div class="ov-btns">
        <button class="big-btn green" data-act="q-next">去下一关 →</button>
        <button class="big-btn ghost" data-act="q-map">🗺️ 回地图</button>
      </div></div></div>`;
    return html;
  }

  const cur = qs[0];
  const ws = qLevelWords(q.region, q.level);
  const w = ws[cur.i];
  const mode = Q_MODES[q.mode % Q_MODES.length];

  html += '<div class="pz-progress"><span class="pz-count">第 ' + (q.level + 1) + ' 关 · ' + mode.ico + ' ' + mode.name + '</span><span class="pz-dots">';
  ws.forEach((_, i) => {
    const e = qKnown(q.region, q.level, i, 'e');
    const z = qKnown(q.region, q.level, i, 'z');
    html += `<span class="pz-dot ${e && z ? 'done' : i === cur.i ? 'cur' : ''}"></span>`;
  });
  html += '</span></div>';

  const isFn = !!w.ph;
  let stem, ask;
  if (cur.dir === 'e') {
    stem = isFn ? w.ph : w.en;
    ask = isFn ? '这句话里的空，中文怎么讲？' : mode.ask;
  } else {
    stem = isFn ? w.ph.replace(new RegExp('\\b' + w.en.replace(/[-/\\^$*+?.()|[\]{}]/g, '\\$&') + '\\b'), '___') : w.zh;
    ask = isFn ? '空格里填哪个词？' : mode.ask;
  }

  html += `<div class="q-card">
    <div class="q-emoji">${w.em || '❄️'}</div>
    <div class="q-word">${esc(stem)}</div>
    <div class="q-ask">${esc(ask)}</div>
  </div>`;

  if (mode.k === 'listen') {
    html += `<div class="q-listen"><button class="big-btn blue" data-act="q-say">🔊 再听一遍</button></div>`;
  }

  html += '<div class="q-opts">';
  qOpts(w, cur.dir).forEach(o => {
    html += `<button class="q-opt" data-act="q-ans" data-v="${esc(o)}">${esc(o)}</button>`;
  });
  html += '</div>';

  html += `<div class="puzzle-bar">
      <button class="big-btn ghost" data-act="q-hint">💡 提示</button>
      <button class="big-btn ghost" data-act="q-skip">⏭️ 换一个</button>
      <button class="big-btn ghost" data-act="q-map">🗺️ 地图</button>
    </div>`;
  html += '</div>';
  return html;
}

function qGo(r, l) {

  q.region = r; q.level = l; q.screen = 'play';
  q.qs = null; q.picked = null; q.wrong = 0;
  sfx('tap');

}

function qAnswer(v) {
  const q = state.quest;
  const qs = qEnsureQs();
  const cur = qs[0];
  const w = qLevelWords(q.region, q.level)[cur.i];
  const right = cur.dir === 'e' ? w.zh : w.en;

  q.wrong++;
  q.qs = shuffle(qs);
  render();
}

function qHint() {

  const qs = qEnsureQs();

  const right = cur.dir === 'e' ? w.zh : w.en;

}

function qSkip() {

  if (qs.length > 1) q.qs = shuffle(qs);

// 下一个还没拼对的句子：先往后找，找不到就绕回开头找
function nextPuzzleIdx(cur) {
  const done = i => !!(prog[state.kid] || { awarded: {} }).awarded['puzzle_' + i];
  for (let i = cur + 1; i < data.sentences.length; i++) if (!done(i)) return i;
  for (let i = 0; i < cur; i++) if (!done(i)) return i;
  return null;
}

function goPuzzle(i) {
  if (pzAutoTimer) { clearTimeout(pzAutoTimer); pzAutoTimer = null; }
  hideOverlay();
  state.puzzleIdx = i;
  sfx('tap');
  render();
}

function pzPut(i) {
  const idx = pz.pieces.findIndex((p, k) => p.toLowerCase() === pz.words[i].toLowerCase() && !pz.used[k]);
  if (idx < 0) return false;
  pz.used[idx] = true;
  pz.slots[i] = pz.pieces[idx];
  paintPuzzle();
  const c = $$('.word-card')[idx];
  if (c) c.classList.add('hinted');
  return true;
}

function pzHint() {
  // 从左往右找到第一个不对的位置：错的先撤回，再把正确词放进去
  for (let i = 0; i < pz.words.length; i++) {
    const cur = pz.slots[i];
    if (cur && String(cur).toLowerCase() === String(pz.words[i]).toLowerCase()) continue;
    if (cur) pzUnslot(i);
    if (pzPut(i)) sfx('tap');
    if (pz.slots.indexOf(null) < 0) setTimeout(pzCheck, 180);
    return;
  }
}

/* =========================================================
   视图：挖空填空
   ========================================================= */
function buildFillQs() {
  const hard = levelOf() === 'hard';
  const qs = [];

  data.sentences.forEach((s, si) => {
    const toks = tokenize(s.en);
    const cand = [];
    toks.forEach((t, i) => {
      const bare = t.replace(/[.,!?]/g, '');
      if (/^[A-Za-z]/.test(bare) && bare.length > 2 && !STOP.has(bare.toLowerCase()) && !/['']/.test(bare)) cand.push(i);
    });
    if (!cand.length) return;
    // 进阶：一句话挖两个空（句子里有 2 个以上实词时）
    const take = (hard && cand.length >= 2) ? 2 : 1;
    const idxs = shuffle(cand).slice(0, take).sort((a, b) => a - b);
    const blanks = idxs.map(i => {
      const ans = toks[i].replace(/[.,!?]/g, '');
      return { at: i, answer: ans, opts: hard ? optsAround(ans, 4) : easyOpts(ans) };
    });
    qs.push({ kind: 'sentence', toks, blanks, filled: [], sent: s, si });
  });

  data.words.forEach((w, wi) => {
    qs.push({ kind: 'word', target: w.en, opts: hard ? optsAround(w.en, 4) : easyOpts(w.en), word: w, wi });
  });

  // 进阶专属题型：给中文，选正确的英文句子
  if (hard) {
    const withZh = data.sentences.filter(s => s.zh);
    if (withZh.length >= 3) {
      data.sentences.forEach((s, si) => {
        if (!s.zh) return;
        const pool = data.sentences.filter((o, i) => i !== si && o.en).map(o => o.en);
        if (pool.length < 3) return;
        qs.push({ kind: 'zh2en', sent: s, si, opts: shuffle([s.en].concat(shuffle(pool).slice(0, 3))) });
      });
    }
  }

  return qs;
}

function fillBlankHTML(tok, i, q) {
  const bi = q.blanks.findIndex(b => b.at === i);
  if (bi < 0) return esc(tok);
  const v = q.filled[bi];
  const cur = q.filled.length === bi;
  return `<span class="blank ${v ? 'filled' : ''} ${cur ? 'cur' : ''}" data-b="${bi}">${v ? esc(v) : '&nbsp;?&nbsp;'}</span>`;
}

function viewFill() {
  if (!data.sentences.length && !data.words.length) return emptyView('🕳️', '还没有内容', '去「设置」里添加句型和单词');
  if (!state.fillQs.length) state.fillQs = shuffle(buildFillQs());
  const q = state.fillQs[state.fillI];
  if (!q) { setTimeout(() => { state.fillQs = []; state.fillI = 0; render(); }, 0); return '<div class="view-inner"></div>'; }

  let body = '', title = '选一个词填进去', opts = [], optClass = '';

  if (q.kind === 'sentence') {
    const parts = q.toks.map((t, i) => fillBlankHTML(t, i, q));
    body = `<div class="fill-sentence">${parts.join(' ').replace(/\s+([.,!?])/g, '$1')}</div>
            <div class="fill-zh">${esc(q.sent.zh || '')}</div>`;
    if (q.blanks.length > 1) title = `把两个空都填上（${Math.min(q.filled.length, q.blanks.length)}/${q.blanks.length}）`;
    const cur = q.blanks[q.filled.length];
    opts = cur ? cur.opts : [];
  } else if (q.kind === 'zh2en') {
    title = '这句话用英语怎么说？';
    body = `<div class="fill-sentence zh-big">${esc(q.sent.zh)}</div>`;
    opts = q.opts;
    optClass = ' sent';
  } else {
    body = `<div class="fill-sentence"><span class="blank cur">&nbsp;?&nbsp;</span></div>
            <div class="fill-zh">${esc(q.word.zh || '这个东西英文怎么说？')}</div>`;
    opts = q.opts;
  }

  let html = '<div class="view-inner">';
  html += chapterBanner('fill');
  html += `<h2 class="page-title">🕳️ ${title}</h2>`;
  html += `<p class="page-hint">第 ${state.fillI + 1} / ${state.fillQs.length} 题</p>`;
  html += body;
  html += '<div class="opt-grid" id="optGrid">';
  opts.forEach(o => {
    const ico = q.kind === 'zh2en' ? '' : emoOf(o);
    html += `<button class="opt-card${optClass}" data-act="fill-pick" data-w="${esc(o)}">
      ${ico ? `<span class="ico">${ico}</span>` : ''}
      <span class="en">${esc(o)}</span>
    </button>`;
  });
  html += '</div></div>';
  return html;
}

function fillPick(btn) {
  const q = state.fillQs[state.fillI];
  const pick = btn.dataset.w;

  // 句子题：逐空填，当前空对了才进下一个
  if (q.kind === 'sentence') {
    const cur = q.blanks[q.filled.length];
    if (!cur) return;
    if (pick.toLowerCase() === cur.answer.toLowerCase()) {
      q.filled.push(cur.answer);
      sfx('right');
      if (q.filled.length >= q.blanks.length) {
        btn.classList.add('ok');
        award('fill_s' + q.si);
        speak(q.sent.en);
        setTimeout(nextFill, 1100);
      } else {
        speak(cur.answer);
        render();
      }
    } else {
      btn.classList.add('no');
      sfx('wrong');
      setTimeout(() => btn.classList.remove('no'), 600);
    }
    return;
  }

  const target = q.kind === 'zh2en' ? q.sent.en : q.target;
  if (pick.toLowerCase() === String(target).toLowerCase()) {
    btn.classList.add('ok');
    sfx('right');
    const key = q.kind === 'zh2en' ? 'fill_z' + q.si : 'fill_w' + q.wi;
    award(key);
    speak(target);
    setTimeout(nextFill, 1100);
  } else {
    btn.classList.add('no');
    sfx('wrong');
    setTimeout(() => btn.classList.remove('no'), 600);
  }
}

function nextFill() {
  state.fillI++;
  if (state.fillI >= state.fillQs.length) {
    state.fillQs = [];
    state.fillI = 0;
    showFillFinish();
  } else render();
}

function showFillFinish() {

  if (state.chapterJustDone === 'fill') { state.chapterJustDone = null; return chapterClear('fill'); }
  showOverlay(`<div class="overlay-emoji">🏆</div>

/* =========================================================
   视图：拼写（名词 + 代词，三档递进：排字母 → 补字母 → 自己打）
   设计原则：错不扣分、提示随时给，先让她愿意拼，再求拼对
   ========================================================= */

// 能拿來拼写的词：单个英文词（名词、代词都算）
function spellWords() {
  const out = [];
  data.words.forEach((w, i) => {
    if (/^[A-Za-z]{2,}$/.test(w.en.trim())) out.push({ en: w.en.trim(), zh: w.zh, wi: i });
  });
  return out;
}

const SPELL_ROUND = 10;

function buildSpellQs() {
  const hard = levelOf() === 'hard';
  const ws = spellWords();
  if (!ws.length) return [];
  const p = prog[state.kid] || { awarded: {} };
  const aw = p.awarded || {};
  // 还不会的排前面；会了的也保留，混着练
  const order = shuffle(ws.filter(x => !aw['spell_' + x.wi]))
    .concat(shuffle(ws.filter(x => aw['spell_' + x.wi])));
  const pick = order.slice(0, Math.min(SPELL_ROUND, order.length));
  const n = pick.length;
  const a = Math.max(1, Math.round(n * 0.3));
  const b = Math.max(1, Math.round(n * 0.3));

  return pick.map((x, k) => {
    const q = { en: x.en, zh: x.zh, wi: x.wi, kind: 'type' };
    q.kind = k < a ? 'tile' : (k < a + b ? 'gap' : 'type');
    if (!hard && q.kind === 'type') q.kind = 'gap'; // 简单模式不做整词默写
    const L = x.en.split('');

    if (q.kind === 'tile') {
      let idxs = L.map((_, i) => i);
      if (!hard) idxs = idxs.slice(1);            // 简单模式首字母直接送
      q.pieces = shuffle(idxs).map(i => ({ ch: L[i] }));
      if (hard) {
        const pool = spellWords().filter(o => o.wi !== x.wi).map(o => o.en).join('').split('');
        const extra = shuffle(Array.from(new Set(pool))).slice(0, 2);
        q.pieces = shuffle(q.pieces.concat(extra.map(ch => ({ ch, decoy: true }))));
      }
    }

    if (q.kind === 'gap') {
      const nGap = hard ? Math.min(2, Math.max(1, L.length - 1)) : 1;
      const cand = hard ? L.map((_, i) => i) : L.map((_, i) => i).slice(1);
      q.gaps = shuffle(cand).slice(0, nGap).sort((m, n2) => m - n2);
      const right = Array.from(new Set(q.gaps.map(i => L[i])));
      const opts = right.slice();
      const alpha = 'abcdefghijklmnopqrstuvwxyz'.split('');
      let guard = 0;
      while (opts.length < 4 && guard++ < 60) {
        const c = alpha[Math.floor(Math.random() * 26)];
        if (!opts.includes(c)) opts.push(c);
      }
      q.opts = shuffle(opts);
    }
    return q;
  });
}

function spResetBuf() {
  const q = state.spellQs[state.spellI];
  state.spellMsg = ''; state.spellBad = false; state.spellGapAt = 0;
  if (!q) { state.spellBuf = []; return; }
  const L = q.en.split('');
  if (q.kind === 'tile') {
    state.spellBuf = L.map(() => '');
    if (levelOf() !== 'hard') state.spellBuf[0] = L[0];
  } else if (q.kind === 'gap') {
    state.spellBuf = L.slice();
  } else {
    state.spellBuf = [];
  }
}

// tile 卡片哪些已被占用：按已填字母贪心反推，不用单独维护
function spUsedFlags(q) {
  const used = q.pieces.map(() => false);
  state.spellBuf.forEach(c => {
    if (!c) return;
    const k = q.pieces.findIndex((p, pi) => !used[pi] && p.ch.toLowerCase() === c.toLowerCase());
    if (k >= 0) used[k] = true;
  });
  return used;
}

function spSlotsHTML(q) {
  const L = q.en.split('');
  const hard = levelOf() === 'hard';
  let html = '<div class="sp-slots">';
  L.forEach((ch, i) => {
    let shown = '', cls = '';
    if (q.kind === 'tile') {
      shown = state.spellBuf[i] || '';
      if (i === 0 && !hard) cls = ' fixed';
    } else if (q.kind === 'gap') {
      const gi = q.gaps.indexOf(i);
      if (gi < 0) { shown = ch; cls = ' fixed'; }
      else if (gi < state.spellGapAt) { shown = ch; cls = ' ok'; }
      else { shown = ''; if (gi === state.spellGapAt) cls = ' cur'; }
    } else {
      shown = state.spellBuf[i] || '';
      if (i === state.spellBuf.length) cls = ' cur';
    }
    html += `<div class="sp-slot${cls}" data-act="${cls.includes('fixed') || cls.includes('ok') ? '' : 'sp-unslot'}" data-i="${i}">${esc(shown)}</div>`;
  });
  html += '</div>';
  return html;
}

const KB_ROWS = [
  ['a', 'b', 'c', 'd', 'e', 'f', 'g', 'h', 'i'],
  ['j', 'k', 'l', 'm', 'n', 'o', 'p', 'q', 'r'],
  ['s', 't', 'u', 'v', 'w', 'x', 'y', 'z']
];

function viewSpell() {
  if (!data.words.length) return emptyView('✍️', '还没有单词', '去「录入」里把本周单词粘进去');
  if (!state.spellQs.length) {
    state.spellQs = buildSpellQs();
    state.spellI = 0;
    spResetBuf();
    if (!state.spellQs.length) return emptyView('✍️', '没有可以拼写的单词', '单词要是单独的英文词才好拼');
  }
  const q = state.spellQs[state.spellI];
  if (!q) return '<div class="view-inner"></div>';

  const hard = levelOf() === 'hard';
  const tip = q.kind === 'tile'
    ? (hard ? '把字母卡按顺序点进去（混了多余的卡，要挑出来）' : '首字母已经给你啦，把剩下的字母按顺序点进去')
    : q.kind === 'gap' ? '补上缺掉的那个字母' : '用下面的字母键盘，把这个词自己打出来';
  const ico = emoOf(q.en);

  let html = '<div class="view-inner">';
  html += chapterBanner('spell');
  html += `<h2 class="page-title">✍️ 把这个词拼出来</h2>`;
  html += `<p class="page-hint">第 ${state.spellI + 1} / ${state.spellQs.length} 个 · ${tip}</p>`;
  html += `<div class="sp-prompt">
      ${ico ? `<span class="sp-ico">${ico}</span>` : ''}
      <span class="sp-zh">${esc(q.zh || '听一听，写下来')}</span>
      <button class="sp-speak" data-act="sp-speak">🔊 听</button>
    </div>`;
  html += `<div class="sp-stage${state.spellBad ? ' bad' : ''}">${spSlotsHTML(q)}</div>`;
  html += `<div class="sp-msg ${state.spellBad ? 'bad' : ''}">${state.spellMsg ? esc(state.spellMsg) : '&nbsp;'}</div>`;

  if (q.kind === 'tile') {
    const used = spUsedFlags(q);
    html += '<div class="sp-cards">';
    q.pieces.forEach((p, i) => {
      html += `<button class="sp-card${used[i] ? ' used' : ''}" data-act="sp-tile" data-p="${i}">${esc(p.ch)}</button>`;
    });
    html += '</div>';
  } else if (q.kind === 'gap') {
    html += '<div class="sp-cards">';
    q.opts.forEach(c => {
      html += `<button class="sp-card" data-act="sp-gap" data-c="${esc(c)}">${esc(c)}</button>`;
    });
    html += '</div>';
  } else {
    html += '<div class="sp-kb">';
    KB_ROWS.forEach(row => {
      html += '<div class="sp-kb-row">';
      row.forEach(c => { html += `<button class="sp-key" data-act="sp-key" data-c="${c}">${c.toUpperCase()}</button>`; });
      html += '</div>';
    });
    html += `<div class="sp-kb-row"><button class="sp-key wide" data-act="sp-back">⌫ 退一格</button></div>`;
    html += '</div>';
  }

  html += `<div class="sp-bar">
      <button class="big-btn ghost" data-act="sp-hint">💡 提示</button>
      <button class="big-btn ghost" data-act="sp-reset">🔄 重来</button>
      <button class="big-btn ghost" data-act="sp-skip">⏭️ 换一个</button>
    </div>`;
  html += '</div>';
  return html;
}

function spFull() {
  const q = state.spellQs[state.spellI];
  if (q.kind === 'gap') return state.spellGapAt >= q.gaps.length;
  return state.spellBuf.filter(Boolean).length >= q.en.length;
}

function spCheck() {
  const q = state.spellQs[state.spellI];
  if (!q) return;
  let ok = false;
  if (q.kind === 'gap') ok = state.spellGapAt >= q.gaps.length;
  else ok = state.spellBuf.join('').toLowerCase() === q.en.toLowerCase();

  if (ok) {
    state.spellBad = false;
    state.spellMsg = '对啦！';
    sfx('right');
    award('spell_' + q.wi);
    speak(q.en);
    render();
    setTimeout(() => {
      state.spellI++;
      if (state.spellI >= state.spellQs.length) {
        state.spellQs = []; state.spellI = 0;
        showSpellFinish();
      } else { spResetBuf(); render(); }
    }, 950);
  } else {
    state.spellBad = true;
    state.spellMsg = '还差一点点，再看一眼';
    sfx('wrong');
    render();
    setTimeout(() => { state.spellBad = false; render(); }, 700);
  }
}

// 提示：揭示下一个正确的字母（不限次数，不给压力）
function spHint() {
  const q = state.spellQs[state.spellI];
  if (!q) return;
  const L = q.en.split('');

  if (q.kind === 'gap') {
    const pos = q.gaps[state.spellGapAt];
    if (pos == null) return;
    state.spellBuf[pos] = L[pos];
    state.spellGapAt++;
    state.spellMsg = '这一个字母是 ' + L[pos];
    sfx('tap');
    render();
    if (state.spellGapAt >= q.gaps.length) setTimeout(spCheck, 300);
    return;
  }

  const lock = (q.kind === 'tile' && levelOf() !== 'hard') ? 1 : 0;
  for (let i = lock; i < L.length; i++) {
    if ((state.spellBuf[i] || '').toLowerCase() !== L[i].toLowerCase()) {
      state.spellBuf[i] = L[i];
      state.spellMsg = '第 ' + (i + 1) + ' 个字母是 ' + L[i];
      sfx('tap');
      render();
      if (spFull()) setTimeout(spCheck, 300);
      return;
    }
  }
}

function showSpellFinish() {
  sfx('win');
  confetti();
  if (state.finalePending) { state.finalePending = false; return finaleShow(); }
  if (state.chapterJustDone === 'spell') { state.chapterJustDone = null; return chapterClear('spell'); }

function buildListenQs() {
  const hard = levelOf() === 'hard';
  const qs = [];

  data.words.forEach((w, wi) => {
    qs.push({ kind: 'word', target: w.en, opts: hard ? optsAround(w.en, 4) : easyOpts(w.en), zh: w.zh, wi });
  });

  data.sentences.forEach((s, si) => {
    if (hard) {
      // 进阶：四句英文里选听到的那句，干扰句只差一两个词
      let pool = shuffle(data.sentences.filter((o, i) => i !== si && o.en).map(o => o.en)).slice(0, 3);
      if (pool.length < 3) pool = pool.concat(sentVariants(s, 3 - pool.length));
      pool = Array.from(new Set(pool.filter(x => x.toLowerCase() !== s.en.toLowerCase())));
      if (pool.length < 3) return;
      qs.push({ kind: 'sent', target: s.en, opts: shuffle([s.en].concat(pool.slice(0, 3))), si });
    } else {
      const pool = data.sentences.filter((_, i) => i !== si).map(o => o.zh).filter(Boolean);
      if (pool.length < 3) return;
      qs.push({ kind: 'sent', target: s.en, opts: shuffle([s.zh].concat(shuffle(pool).slice(0, 3))), si, byZh: true });
    }
  });

  return qs;
}

function viewListen() {
  if (!data.words.length && !data.sentences.length) return emptyView('👂', '还没有内容', '去「设置」里添加句型和单词');

// 把本周句型编成「爱莎 ⇄ 女儿」的剧本：问句给爱莎，答句/陈述句给女儿
function scriptLines() {

  if (allKid || allElsa) lines.forEach((l, i) => { l.who = i % 2 ? 'elsa' : 'kid'; });
  return lines;
}

/* 换女儿头像：从相册/相机选一张，压缩后存在本机（不上传任何服务器） */
function pickAvatar() {
  const inp = document.createElement('input');
  inp.type = 'file';
  inp.accept = 'image/*';
  inp.onchange = () => {
    const f = inp.files && inp.files[0];
    if (!f) return;
    const fr = new FileReader();
    fr.onload = () => {
      const img = new Image();
      img.onload = () => {
        try {
          const size = 320;
          const c = document.createElement('canvas');
          c.width = size; c.height = size;
          const g = c.getContext('2d');
          // 居中裁成正方形
          const s = Math.min(img.width, img.height);
          const sx = (img.width - s) / 2, sy = (img.height - s) / 2;
          g.drawImage(img, sx, sy, s, s, 0, 0, size, size);
          const url = c.toDataURL('image/jpeg', 0.72);
          if (!data.settings.avatar) data.settings.avatar = {};

/* 语音识别（可选，不支持会自动退回跟读） */
let recogObj = null;

function startRecog(cb) {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { cb(null, 'unsupported'); return; }
  try {
    const r = new SR();
    r.lang = 'en-US';
    r.interimResults = false;
    r.maxAlternatives = 3;
    let got = false;
    r.onresult = e => {
      got = true;
      const res = e.results[0];
      let best = '';
      for (let i = 0; i < res.length; i++) best = best || res[i].transcript;
      cb(best, null);
    };
    r.onerror = e => { if (!got) cb(null, e.error || 'error'); };
    r.onend = () => { if (!got) cb(null, 'noresult'); };
    r.start();
    recogObj = r;
  } catch (e) { cb(null, 'error'); }
}

/* 录音跟读：录下孩子自己的声音，说完自动回放（不判分，保护积极性） */
let talkRec = null, talkChunks = [], talkStream = null, talkRecUrl = null;

function talkMic() {
  const s = data.sentences[state.talkI];
  const heard = $('#heard');
  if (!heard) return;

  // 识别打分模式（录入页里手动打开）
  if (data.settings.recog) { talkMicRecog(s, heard); return; }

  // 正在录音 → 这次点击 = 停止并回放
  if (state.recording) { try { talkRec && talkRec.stop(); } catch (e) {} return; }

  // 设备不支持录音 → 退回"机器示范+跟读"
  if (!navigator.mediaDevices || !window.MediaRecorder) {
    speak(s.en, { rate: 0.75 });
    heard.classList.remove('hidden', 'bad');
    heard.textContent = '🔊 先听一遍，然后你来说';
    return;
  }

  navigator.mediaDevices.getUserMedia({ audio: true }).then(stream => {
    talkStream = stream;
    talkChunks = [];
    talkRec = new MediaRecorder(stream);
    talkRec.ondataavailable = e => { if (e.data && e.data.size) talkChunks.push(e.data); };
    talkRec.onstop = () => {
      try { talkStream.getTracks().forEach(t => t.stop()); } catch (e) {}
      const blob = new Blob(talkChunks, { type: talkRec.mimeType || 'audio/mp4' });
      if (talkRecUrl) { try { URL.revokeObjectURL(talkRecUrl); } catch (e) {} }
      talkRecUrl = URL.createObjectURL(blob);
      state.recording = false;
      render();
      const el = $('#heard');
      const silent = talkRecSilent;
      talkRecSilent = false;
      if (el && !silent) {
        el.classList.remove('hidden', 'bad');
        el.innerHTML = '✅ 录好啦！听听你自己的声音 <button class="mini-btn" data-act="tk-hear">🔊 再听一遍</button>';
      }
      if (!silent) {
        const au = new Audio(talkRecUrl);
        au.play().catch(() => {});
        sfx('right');
      }
    };
    talkRec.start();
    state.recording = true;
    render();
    const el = $('#heard');
    if (el) { el.classList.remove('hidden', 'bad'); el.textContent = '🎙️ 在听你说…说完再点一下 ⏹'; }
  }).catch(() => {
    // 没给麦克风权限：退回跟读
    speak(s.en, { rate: 0.75 });
    heard.classList.remove('hidden', 'bad');
    heard.textContent = '🎤 录音没打开，先听我读，你大声跟着说';
  });
}

/* 停止正在进行的录音/识别（切句、换人时用）——静默停止，不回放 */
let talkRecSilent = false;
function stopTalkRec() {
  if (state.recording) {
    state.recording = false;
    talkRecSilent = true;
    try { talkRec && talkRec.stop(); } catch (e) {}
    try { recogObj && recogObj.stop(); } catch (e) {}
  }
}

/* 识别打分模式的对话麦克风（原来那套逻辑） */
function talkMicRecog(s, heard) {
  if (state.recording) {
    try { recogObj && recogObj.stop(); } catch (e) {}
    state.recording = false;
    render();
    return;
  }

  state.recording = true;
  render();
  const btn = document.querySelector('.mic-btn');
  btn && btn.classList.add('recording');
  heard.classList.remove('hidden', 'bad');
  heard.textContent = '🎙️ 在听你说…';

  startRecog((text, err) => {
    state.recording = false;
    const el = $('#heard');
    if (!el) return;
    if (text) {
      const norm = t => String(t).toLowerCase().replace(/[^a-z\s]/g, ' ').trim();
      const want = norm(s.en).split(/\s+/).filter(Boolean);
      const got = norm(text).split(/\s+/).filter(Boolean);
      let hit = 0;
      want.forEach(w => { if (got.indexOf(w) >= 0) hit++; });
      const score = hit / Math.max(want.length, 1);
      el.classList.remove('hidden');
      if (score >= 0.6) {
        el.classList.remove('bad');
        el.textContent = `👂 听到啦：${text}`;
        sfx('right');
        award('talk_' + state.talkI);
      } else {
        el.classList.add('bad');
        el.textContent = `👂 听到：${text}（再试一次）`;
      }
    } else {
      el.classList.add('bad');
      const msg = err === 'not-allowed' ? '没拿到麦克风权限，去设置里打开' :
        err === 'no-speech' ? '没听到声音，靠近一点再说' :
        err === 'unsupported' ? '这台设备不能用听写，已切回跟读模式' : '没听清，再试一次';
      el.textContent = `🙈 ${msg}`;
      if (err === 'unsupported') data.settings.recog = false;
    }
  });
}

function talkDone() {
  const s = data.sentences[state.talkI];
  stopTalkRec();
  if (!data.settings.recog) {
    award('talk_' + state.talkI);   // 跟读模式：读完即记
  }
  speak(s.en, { rate: 0.8 });
  sfx('tap');
  state.talkI++;
  if (state.talkI >= data.sentences.length) {
    sfx('win');
    confetti();
    state.talkI = 0;
    if (state.finalePending) { state.finalePending = false; finaleShow(); }
    else if (state.chapterJustDone === 'talk') { state.chapterJustDone = null; chapterClear('talk'); }
    else showOverlay(`<div class="overlay-emoji">🎤</div>
      <h3 class="overlay-title">全部读完啦！</h3>
      <p class="overlay-text">今天又说了 ${data.sentences.length} 句英语</p>
      <button class="big-btn green" data-act="tk-restart">再来一轮 →</button>`);
    render();
    return;
  }
  render();
}
